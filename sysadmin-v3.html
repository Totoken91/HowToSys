<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS://ADMIN — Formation v3</title>
<link rel="stylesheet" href="https://unpkg.com/xp.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--win-bg:#ECE9D8;--win-title:#0A246A;--win-border:#808080;--win-tree-bg:#fff;--win-tree-sel:#316AC5;
--win-text:#000;--win-text-dim:#555;--win-hover:#316AC5;--win-btn:#D4D0C8;--win-btn-hover:#B5B3A8;
--win-success:#107c10;--win-error:#d83b01;
}
html,body{height:100%;background:#3A6EA5;font-family:Tahoma,'MS Sans Serif',sans-serif;font-size:11px;overflow:hidden;color:#000}
.app{display:flex;height:100vh;padding:2px;gap:2px}

/* ─── SIDEBAR ─── */
.sidebar{width:300px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
.sidebar .title-bar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);padding:3px 4px;display:flex;align-items:center;gap:6px}
.sidebar .title-bar-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px #000;letter-spacing:0.5px}
.sidebar .window-body{background:var(--win-bg);flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0;margin:0}
.sidebar-stats{padding:4px 8px;background:#D4D0C8;border-bottom:1px solid #808080;font-size:10px;color:#555;display:flex;gap:12px;flex-wrap:wrap}
.sidebar-stats span{color:#0A246A;font-weight:700}
.module-list{flex:1;overflow-y:auto;padding:2px}
.module-list::-webkit-scrollbar{width:16px}
.module-list::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.module-list::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.module-list ul.tree-view{margin:0;font-size:11px}

/* Tree view module items */
.cat-header{padding:4px 6px 2px;font-size:10px;letter-spacing:1px;font-weight:700;color:#0A246A;margin-top:2px;display:flex;align-items:center;gap:6px}
.cat-header.linux{color:#0A246A}.cat-header.windows{color:#0A246A}
.cat-header::after{content:'';flex:1;height:1px;background:#808080}
.mi{padding:3px 6px;cursor:pointer;border:1px solid transparent;margin-bottom:0;display:flex;align-items:center;gap:6px;font-size:11px;color:#000}
.mi:hover{background:#316AC5;color:#fff}
.mi.active{background:#316AC5;color:#fff;border:1px dotted #D4D0C8}
.mi.win:hover{background:#316AC5;color:#fff}.mi.win.active{background:#316AC5;color:#fff}
.mi.done .mi-s{color:var(--win-success)}.mi.win.done .mi-s{color:var(--win-success)}
.mi-n{font-size:10px;color:inherit;min-width:18px;opacity:.6}
.mi-t{flex:1;color:inherit;line-height:1.3}
.mi-lv{font-size:9px;margin-left:4px;opacity:.7}.mi-lv.beginner{color:#008000}.mi-lv.intermediate{color:#808000}.mi-lv.advanced{color:#B45F06}.mi-lv.expert{color:#C00000}
.mi.active .mi-lv,.mi:hover .mi-lv{color:#fff;opacity:.8}
.mi-s{font-size:11px;color:#808080}
.mi.active .mi-n,.mi:hover .mi-n{opacity:1}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{background:#D4D0C8;padding:0;border-bottom:1px solid #808080;display:flex;flex-direction:column}
.main-header .path-bar{padding:4px 8px;font-size:11px;color:#000;background:#fff;border:2px inset #D4D0C8;margin:4px 8px 2px}
.main-header .path-bar span{color:#808080}
.main-header.wa .path-bar{color:#000}
.path{font-size:11px;color:#000} .path span{color:#808080}
.tabs-bar{padding:0 4px}
.tabs{display:flex;gap:0;padding:0}
.tab{padding:4px 16px;font-size:11px;cursor:pointer;color:#000;border:1px solid #808080;border-bottom:none;background:#D4D0C8;font-family:Tahoma,sans-serif;margin-right:-1px;position:relative}
.tab:hover{background:#ECE9D8}
.tab.active{background:#ECE9D8;font-weight:700;z-index:1;border-bottom:1px solid #ECE9D8;margin-bottom:-1px}
.wa .tab.active{background:#ECE9D8}
.content{flex:1;overflow-y:auto;padding:12px 16px;background:#ECE9D8;border-top:1px solid #808080}
.content::-webkit-scrollbar{width:16px}
.content::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.content::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

/* ─── COURSE ─── */
.course h2{color:#0A246A;font-size:14px;margin-bottom:10px;font-weight:700;text-shadow:none}
.course.w h2{color:#0A246A}
.course h3{color:#000;font-size:12px;margin:14px 0 6px;font-weight:700}
.course p{line-height:1.6;margin-bottom:8px;font-size:11px}
.course code{background:#F0F0F0;color:#000;padding:1px 4px;border:1px solid #C0C0C0;font-family:'Courier New',monospace;font-size:11px}
.course.w code{background:#F0F0F0;color:#000}
.course pre{background:#F0F0F0;border:2px inset #D4D0C8;padding:8px;margin:8px 0;overflow-x:auto;line-height:1.5;font-size:11px;font-family:'Courier New',monospace}
.course pre code{background:none;border:none;padding:0}
.course .tip{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#E8F4F8;font-size:11px}
.course .warn{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#FFFACD;font-size:11px}
.course ul{margin:6px 0 6px 18px;line-height:1.8;font-size:11px}
.course ul li::marker{color:#0A246A}.course.w ul li::marker{color:#0A246A}

.mark-read{margin-top:16px;padding:4px 16px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.mark-read:hover{background:#B5B3A8}.mark-read:active{border-style:inset}
.mark-read.done{color:#808080;cursor:default}
.mark-read.wb{background:#D4D0C8;border:2px outset #D4D0C8;color:#000}.mark-read.wb:hover{background:#B5B3A8}

/* ─── QUIZ ─── */
.qq{margin-bottom:14px;padding:10px;border:2px inset #D4D0C8;background:#fff}
.qq .qn{font-size:10px;color:#808080;margin-bottom:4px}
.qq .qt{color:#000;margin-bottom:10px;line-height:1.5;font-size:11px}
.qo{display:block;width:100%;text-align:left;padding:4px 10px;margin-bottom:2px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.qo:hover:not(:disabled){background:#B5B3A8}
.qo:active:not(:disabled){border-style:inset}
.qo.c{background:#DFF0D8;border:2px solid #5CB85C;color:#000}
.qo.x{background:#F2DEDE;border:2px solid #D9534F;color:#000}
.qo:disabled{cursor:default;color:#808080}
.qe{margin-top:4px;padding:4px 8px;font-size:10px;color:#555;border-left:3px solid #0A246A;display:none}.qe.s{display:block}
.qs{text-align:center;padding:20px;font-size:12px;color:#0A246A}
.qs .big{font-size:36px;font-weight:700;display:block;margin:6px 0;text-shadow:none}
.qs.wb{color:#0A246A}.qs.wb .big{text-shadow:none}
.qr{margin-top:10px;padding:4px 18px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;cursor:pointer;font-size:11px}
.qr:hover{background:#B5B3A8}.qr:active{border-style:inset}
.qr.wb{border:2px outset #D4D0C8;color:#000}.qr.wb:hover{background:#B5B3A8}

/* ─── TERMINAL ─── */
.terminal{border:2px inset #D4D0C8;overflow:hidden;height:100%;display:flex;flex-direction:column;background:#000}
.terminal.w{background:#012456}
.tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);padding:3px 8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#fff;font-weight:700;text-shadow:1px 1px #000}
.terminal.w .tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%)}
.td{display:flex;gap:2px;margin-right:4px}
.tdo{width:14px;height:14px;display:none}
.tby{flex:1;padding:8px;overflow-y:auto;font-size:11px;line-height:1.6;font-family:'Courier New',monospace;color:#C0C0C0;background:#000}
.terminal.w .tby{background:#012456;color:#EEEDF0}
.tby::-webkit-scrollbar{width:16px}.tby::-webkit-scrollbar-track{background:#000}.tby::-webkit-scrollbar-thumb{background:#808080}
.tl{margin-bottom:1px}.tl .pr{color:#C0C0C0;font-weight:700}
.terminal.w .tl .pr{color:#EEEDF0}
.tl .cm{color:#fff}.tl .ou{color:#C0C0C0}.tl .ok{color:#00ff00}.terminal.w .tl .ok{color:#00ff00}.tl .er{color:#ff0000}
.ti{padding:6px 8px;margin-bottom:6px;background:#ECE9D8;border:2px inset #D4D0C8;color:#000;font-size:11px;line-height:1.4;font-family:Tahoma,sans-serif}
.ti .sn{color:#0A246A;font-size:10px;display:block;margin-bottom:2px;font-weight:700}
.th{font-size:10px;color:#808080;margin-top:2px;cursor:pointer;font-family:Tahoma,sans-serif}.th:hover{color:#0A246A}
.til{display:flex;align-items:center;gap:0;padding:2px 8px 8px;background:#000;font-family:'Courier New',monospace}
.terminal.w .til{background:#012456}
.til .pr{color:#C0C0C0;white-space:nowrap;font-size:11px;font-weight:700}
.terminal.w .til .pr{color:#EEEDF0}
.tinp{flex:1;background:none;border:none;color:#fff;font-family:'Courier New',monospace;font-size:11px;outline:none;caret-color:#C0C0C0;padding-left:3px}
.terminal.w .tinp{caret-color:#EEEDF0}

.lc{text-align:center;padding:20px;color:#0A246A;font-family:Tahoma,sans-serif}
.lc .big{font-size:18px;font-weight:700;margin-bottom:6px;text-shadow:none}
.terminal.w .lc{color:#0A246A}.terminal.w .lc .big{text-shadow:none}

.lab-toggle{display:flex;gap:2px;margin-bottom:8px}
.lt-btn{padding:4px 14px;font-size:11px;cursor:pointer;color:#000;border:2px outset #D4D0C8;background:#D4D0C8;font-family:Tahoma,sans-serif}
.lt-btn:hover{background:#B5B3A8}
.lt-btn.active{border-style:inset;background:#ECE9D8;font-weight:700}

/* ─── WIN SIMULATION (GUI AD etc.) ─── */
.win-sim{height:100%;display:flex;flex-direction:column;font-family:Tahoma,sans-serif;font-size:11px;color:#000;overflow:hidden;border:2px outset #D4D0C8}
.win-titlebar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);color:#fff;padding:3px 6px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;user-select:none;flex-shrink:0;text-shadow:1px 1px #000}
.win-titlebar .ico{text-shadow:none}
.win-titlebar .spacer{flex:1}
.win-btns{display:flex;gap:2px}
.win-btn{width:21px;height:21px;display:flex;align-items:center;justify-content:center;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:10px;font-weight:400;text-shadow:none;padding:0}
.win-btn:active{border-style:inset}
.win-btn.close:hover{background:#D4D0C8}

.win-toolbar{background:#D4D0C8;border-bottom:1px solid #808080;padding:2px 4px;display:flex;gap:2px;flex-wrap:wrap;flex-shrink:0}
.win-tool{padding:2px 8px;font-size:10px;background:#D4D0C8;border:1px solid transparent;cursor:pointer;font-family:Tahoma,sans-serif;color:#000}
.win-tool:hover{border:1px outset #D4D0C8;background:#ECE9D8}
.win-tool.active{border:1px inset #808080;background:#ECE9D8}

.win-body{flex:1;display:flex;overflow:hidden;background:#fff}
.win-tree{width:220px;min-width:180px;background:#fff;border-right:1px solid #808080;overflow-y:auto;padding:2px 0}
.win-tree::-webkit-scrollbar{width:16px}
.win-tree::-webkit-scrollbar-track{background:#D4D0C8}
.win-tree::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.wt-item{padding:2px 6px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:11px;user-select:none;white-space:nowrap}
.wt-item:hover{background:#316AC5;color:#fff}
.wt-item.sel{background:#316AC5;color:#fff}

.win-detail{flex:1;overflow-y:auto;background:#fff}
.win-detail::-webkit-scrollbar{width:16px}
.win-detail::-webkit-scrollbar-track{background:#D4D0C8}
.win-detail::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

.wl-header{display:flex;background:#D4D0C8;border-bottom:1px solid #808080;position:sticky;top:0;z-index:2}
.wl-h{flex:1;padding:3px 6px;font-size:10px;font-weight:700;color:#000;border-right:1px solid #fff;border-left:1px solid #808080;text-transform:uppercase;background:#D4D0C8;border-top:1px solid #fff;border-bottom:1px solid #808080}
.wl-row{display:flex;border-bottom:1px solid #ECE9D8;cursor:pointer}
.wl-row:nth-child(even){background:#F5F5F5}
.wl-row:hover{background:#316AC5;color:#fff}
.wl-cell{flex:1;padding:2px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #ECE9D8}

.win-status{background:#D4D0C8;border-top:1px solid #fff;padding:2px 8px;font-size:10px;color:#000;display:flex;justify-content:space-between;flex-shrink:0;border:1px inset #D4D0C8}

/* ─── CONTEXT MENU ─── */
.ctx-menu{position:fixed;background:#fff;border:1px solid #808080;box-shadow:2px 2px 4px rgba(0,0,0,.3);padding:2px 0;z-index:100000;min-width:180px;font-family:Tahoma,sans-serif;font-size:11px}
.ctx-item{padding:4px 20px 4px 8px;cursor:pointer;color:#000}
.ctx-item:hover{background:#316AC5;color:#fff}
.ctx-sep{height:1px;background:#808080;margin:2px 0}

/* ─── DIALOGS ─── */
.win-dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100001;display:flex;align-items:center;justify-content:center}
.win-dialog{background:#ECE9D8;border:2px outset #D4D0C8;width:380px;font-family:Tahoma,sans-serif;box-shadow:4px 4px 8px rgba(0,0,0,.4)}
.wd-title{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);color:#fff;padding:3px 8px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px #000}
.wd-close{background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:11px;width:21px;height:21px;display:flex;align-items:center;justify-content:center;text-shadow:none}
.wd-close:active{border-style:inset}
.wd-body{padding:12px}
.wd-row{margin-bottom:8px}
.wd-row label{display:block;font-size:10px;color:#000;margin-bottom:2px;font-weight:700}
.wd-row input,.wd-row select{width:100%;padding:3px 4px;border:2px inset #D4D0C8;font-family:Tahoma,sans-serif;font-size:11px;background:#fff}
.wd-row input:focus,.wd-row select:focus{outline:1px dotted #000}
.wd-row .val{font-size:11px;padding:2px 0}
.wd-actions{padding:8px 12px;background:#ECE9D8;border-top:1px solid #808080;display:flex;justify-content:flex-end;gap:6px}
.wd-btn{padding:3px 16px;border:2px outset #D4D0C8;background:#D4D0C8;cursor:pointer;font-family:Tahoma,sans-serif;font-size:11px}
.wd-btn:hover{background:#B5B3A8}.wd-btn:active{border-style:inset}
.wd-btn.primary{background:#D4D0C8;color:#000;border:2px outset #D4D0C8;font-weight:700}
.wd-btn.primary:hover{background:#B5B3A8}

/* ─── GUI TASKS ─── */
.gui-task{padding:4px 8px;margin:2px 4px;font-size:10px;display:flex;align-items:center;gap:4px;font-family:Tahoma,sans-serif}
.gui-task.pending{background:#FFFACD;border:1px solid #808080;color:#000}
.gui-task.success{background:#DFF0D8;border:1px solid #808080;color:#000}

.fade-up{animation:none}
@media(max-width:800px){.sidebar{width:250px;min-width:250px}}
@media(max-width:600px){.app{flex-direction:column}.sidebar{width:100%;min-width:auto;max-height:45vh}.content{padding:8px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar window" style="margin:0;padding:0">
<div class="title-bar">
<div class="title-bar-text">SYS://ADMIN — Formation v3</div>
<div class="title-bar-controls"><button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button></div>
</div>
<div class="window-body" style="margin:0;padding:0">
<div class="sidebar-stats">MODULES <span id="sD">0</span>/<span id="sT">20</span> &nbsp;|&nbsp; QUIZ <span id="sQ">0</span>% &nbsp;|&nbsp; LABS <span id="sL">0</span>/<span id="sLT">20</span></div>
<div class="module-list" id="ml"></div>
</div>
</aside>
<main class="main window" id="mh" style="margin:0;padding:0">
<div class="title-bar" style="flex-shrink:0">
<div class="title-bar-text"><span id="bc"><span>~/</span>sysadmin</span></div>
<div class="title-bar-controls"><button aria-label="Minimize"></button><button aria-label="Maximize"></button><button aria-label="Close"></button></div>
</div>
<div class="window-body" style="margin:0;padding:0;display:flex;flex-direction:column;flex:1;overflow:hidden">
<div role="tablist" style="padding:2px 4px 0;background:#D4D0C8">
<button class="tab active" role="tab" data-tab="course" onclick="sTab('course')">Cours</button>
<button class="tab" role="tab" data-tab="quiz" onclick="sTab('quiz')">Quiz</button>
<button class="tab" role="tab" data-tab="lab" onclick="sTab('lab')">Lab</button>
</div>
<div class="content" id="ct"></div>
</div>
</main>
</div>
<div id="ctxMenu" class="ctx-menu" style="display:none"></div>
<div id="dialogRoot"></div>
<script>
// === MODULE DATA ===
const M=[
// LINUX 0-9
{id:0,slug:"intro-terminal",title:"Le Terminal : Premiers Pas",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Le Terminal : Premiers Pas</h2><p>Le terminal est l\'interface texte pour communiquer avec le système.</p><h3>Le prompt</h3><pre><code>user@machine:~$</code></pre><p><code>$</code> = utilisateur normal, <code>#</code> = root.</p><h3>Premières commandes</h3><ul><li><code>pwd</code> — répertoire courant</li><li><code>whoami</code> — nom utilisateur</li><li><code>date</code> — date/heure</li><li><code>echo "texte"</code> — affiche texte</li><li><code>clear</code> — efface écran</li><li><code>history</code> — historique</li></ul><div class="tip">💡 ↑ = dernière commande, Tab = auto-complétion.</div><h3>Structure</h3><pre><code>commande -option argument\nls -la /home</code></pre>',quiz:[{q:"$ dans le prompt ?",o:["Root","User normal","Erreur","Déconnecté"],c:1,e:"$ = standard, # = root."},{q:"Répertoire courant ?",o:["cd","ls","pwd","whoami"],c:2,e:"pwd."},{q:"whoami ?",o:["Change user","Affiche nom user","Liste users","Déconnecte"],c:1,e:"Nom de l'utilisateur."},{q:"Dernière commande ?",o:["Ctrl+Z","↑","Tab","Ctrl+R"],c:1,e:"↑ parcourt l'historique."},{q:"'/home' dans 'ls -la /home' ?",o:["Option","Flag","Argument","Pipe"],c:2,e:"Argument."}],lab:[{i:"Affiche ton nom d'utilisateur",x:["whoami"],o:"admin",h:"who..."},{i:"Répertoire courant",x:["pwd"],o:"/home/admin",h:"pwd"},{i:"Affiche la date",x:["date"],o:"Fri Mar 27 14:23:01 CET 2026",h:"4 lettres"},{i:"Affiche 'Hello World'",x:['echo "Hello World"','echo Hello World',"echo 'Hello World'"],o:"Hello World",h:"echo texte"},{i:"Efface l'écran",x:["clear"],o:"[effacé]",h:"cl..."}]},
{id:1,slug:"filesystem",title:"Système de Fichiers",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Système de Fichiers Linux</h2><p>Tout part de <code>/</code>.</p><h3>Dossiers principaux</h3><ul><li><code>/home</code> — personnels</li><li><code>/etc</code> — config</li><li><code>/var</code> — logs</li><li><code>/tmp</code> — temporaire</li></ul><h3>Navigation</h3><pre><code>ls -la   cd /etc   cd ..   cd ~</code></pre><h3>Manipulation</h3><pre><code>mkdir dossier   touch fichier\ncp src dst   mv src dst   rm fichier</code></pre><div class="warn">⚠️ rm -rf / = destruction totale.</div>',quiz:[{q:"Racine ?",o:["/home","C:\\","/","/root"],c:2,e:"/"},{q:"Config ?",o:["/home","/etc","/bin","/tmp"],c:1,e:"/etc"},{q:"cd .. ?",o:["Home","Racine","Remonte","Liste"],c:2,e:"Parent."},{q:"Fichier vide ?",o:["mkdir","touch","create","new"],c:1,e:"touch."},{q:"Fichiers cachés ?",o:["-l","-h","-a","-r"],c:2,e:"-a."}],lab:[{i:"Liste détaillée",x:["ls -l","ls -la","ls -al"],o:"drwxr-xr-x config\n-rw-r--r-- .bashrc",h:"ls -l"},{i:"Va dans /etc",x:["cd /etc"],o:"",h:"cd"},{i:"Crée 'projets'",x:["mkdir projets"],o:"",h:"mkdir"},{i:"Crée 'readme.txt'",x:["touch readme.txt"],o:"",h:"touch"},{i:"10 lignes de /etc/passwd",x:["head /etc/passwd","head -n 10 /etc/passwd"],o:"root:x:0:0:root\ndaemon:x:1:1",h:"head"}]},
{id:2,slug:"permissions",title:"Permissions et Propriétés",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Permissions</h2><pre><code>-rwxr-xr-- 1 admin devs script.sh</code></pre><ul><li>rwx=proprio, r-x=groupe, r--=autres</li></ul><h3>chmod</h3><pre><code>chmod u+x script.sh\nchmod 755 script.sh\nchmod 600 secret</code></pre><div class="tip">💡 4=r, 2=w, 1=x → 7=rwx</div><h3>chown</h3><pre><code>chown user:groupe fichier</code></pre>',quiz:[{q:"Premier - dans -rwx... ?",o:["Pas perm","Fichier","Lien","Dossier"],c:1,e:"- = fichier."},{q:"Octal rwx ?",o:["4","5","6","7"],c:3,e:"4+2+1=7."},{q:"chmod 600 ?",o:["Tous lisent","rw proprio","Exec tous","Rien"],c:1,e:"6=rw, 0=rien."},{q:"Changer proprio ?",o:["chmod","chown","chgrp","usermod"],c:1,e:"chown."},{q:"r-x ?",o:["Read+exec","Read+write","Write+exec","Read"],c:0,e:"r-x."}],lab:[{i:"script.sh exécutable",x:["chmod u+x script.sh","chmod +x script.sh"],o:"",h:"chmod u+x"},{i:"755 sur app.sh",x:["chmod 755 app.sh"],o:"",h:"chmod 755"},{i:"Retire écriture autres config.txt",x:["chmod o-w config.txt"],o:"",h:"chmod o-w"},{i:"Proprio data.db → www-data",x:["chown www-data data.db","sudo chown www-data data.db"],o:"",h:"chown"},{i:"600 sur id_rsa",x:["chmod 600 id_rsa"],o:"",h:"600"}]},

{id:10,slug:"powershell",title:"PowerShell : Les Bases",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:null,course:'<h2>PowerShell : Les Bases</h2><p>Terminal moderne Windows, basé sur des <strong>objets .NET</strong>.</p><h3>Verbe-Nom</h3><pre><code>Get-Process   Get-Service\nStop-Service  New-Item</code></pre><h3>Commandes</h3><pre><code>Get-Help Get-Process\nGet-Command *service*\nGet-Process | Where-Object {$_.CPU -gt 10}</code></pre><div class="tip">💡 Alias : ls=Get-ChildItem. En script : nom complet.</div>',quiz:[{q:"Convention cmdlets ?",o:["cmd-opt","Nom.Action","Verbe-Nom","action_obj"],c:2,e:"Verbe-Nom."},{q:"ls complet ?",o:["List-Dir","Get-ChildItem","Show-Files","Dir"],c:1,e:"Get-ChildItem."},{q:"Cmdlets service ?",o:["Help","Get-Command *service*","Find","Search"],c:1,e:"Get-Command."},{q:"PS retourne ?",o:["Texte","Fichiers","Objets .NET","JSON"],c:2,e:"Objets .NET."},{q:"CPU > 10 ?",o:["-cpu 10","grep","Where-Object","filter"],c:2,e:"Where-Object."}],lab:[{i:"Liste services",x:["Get-Service"],o:"Running WinRM\nStopped Spooler",h:"Get-Service"},{i:"Liste processus",x:["Get-Process"],o:"svchost 2.34\nchrome 45.12",h:"Get-Process"},{i:"Aide Get-Service",x:["Get-Help Get-Service"],o:"NAME: Get-Service",h:"Get-Help"},{i:"Contenu C:\\",x:["Get-ChildItem C:\\","ls C:\\","dir C:\\"],o:"Program Files\nUsers\nWindows",h:"Get-ChildItem C:\\"},{i:"Top 5 CPU",x:["Get-Process | Sort-Object CPU -Descending | Select-Object -First 5"],o:"chrome 45\ncode 23\nsvchost 12",h:"Sort CPU -Desc | Select -First 5"}]},
{id:11,slug:"server-roles",title:"Windows Server : Rôles",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:{type:"server-manager"},course:'<h2>Rôles Windows Server</h2><p>Windows Server fonctionne avec des <strong>rôles</strong> (AD DS, DNS, DHCP, IIS, Hyper-V) et <strong>fonctionnalités</strong>.</p><h3>Server Manager</h3><p>Dashboard central : état des rôles, alertes, ajout/suppression.</p><pre><code>Get-WindowsFeature\nInstall-WindowsFeature -Name Web-Server -IncludeManagementTools\nGet-WindowsFeature | Where-Object Installed\nRemove-WindowsFeature -Name Web-Server</code></pre><h3>Rôles principaux</h3><ul><li><strong>AD DS</strong> — Active Directory</li><li><strong>DNS / DHCP</strong></li><li><strong>IIS</strong> — serveur web</li><li><strong>Hyper-V</strong></li><li><strong>File Services</strong></li><li><strong>AD CS</strong> — certificats</li></ul>',quiz:[{q:"Outil central rôles ?",o:["Panneau config","Server Manager","Task Manager","PS seul"],c:1,e:"Server Manager."},{q:"Installer rôle ?",o:["Add-Role","Install-WindowsFeature","Setup","New-Role"],c:1,e:"Install-WindowsFeature."},{q:"AD DS ?",o:["Web","Active Directory","DHCP","DNS"],c:1,e:"AD Domain Services."},{q:"Rôle web ?",o:["IIS","Web-Server","Apache","HTTP"],c:1,e:"Web-Server (IIS)."},{q:"Rôles installés ?",o:["Get-Roles","Where Installed","Show","List"],c:1,e:"Where-Object Installed."}],lab:[{i:"Liste rôles",x:["Get-WindowsFeature"],o:"[ ] AD-Certificate\n[X] DNS\n[ ] Web-Server",h:"Get-WindowsFeature"},{i:"Installe IIS",x:["Install-WindowsFeature -Name Web-Server -IncludeManagementTools","Install-WindowsFeature -Name Web-Server"],o:"[X] Web-Server installed",h:"Install-WindowsFeature -Name Web-Server"},{i:"Rôles installés",x:["Get-WindowsFeature | Where-Object Installed",'Get-WindowsFeature | Where-Object {$_.Installed -eq $true}'],o:"[X] DNS\n[X] Web-Server",h:"Where Installed"},{i:"Supprime IIS",x:["Remove-WindowsFeature -Name Web-Server","Uninstall-WindowsFeature -Name Web-Server"],o:"Removed. Res const m=M[st.cm],p=st.p[st.cm],s=m.lab[p.ls],h=document.getElementById('th'),ph=pr(st.cm);

if(ok){if(s.o)h.innerHTML+=`<div class="tl"><span class="ou">${esc(s.o).replace(/\n/g,'<br>')}</span></div>`;
h.innerHTML+=`<div class="tl"><span class="ok">✓ Correct !</span></div><br>`;p.ls++;

function buildTree(n,d){const hasK=n.children&&n.children.length>0;
let h=`<div class="wt-item${guiState.selNode===n.name?' sel':''}" style="padding-left:${8+d*16}px" onclick="selNode('${n.name}')" oncontextmenu="treeCtx(event,'${n.name}','${n.type||''}')"><span style="width:12px;font-size:8px;color:#999;display:inline-block;text-align:center">${hasK?'▶':''}</span><span style="margin:0 4px">${n.ico}</span><span>${n.name}</span></div>`;
if(hasK){n.children.forEach(c=>{h+=buildTree(c,d+1)})}return h}

function ouPath(name){const map={Utilisateurs:"Paris/Utilisateurs",Postes:"Paris/Postes",Serveurs:"Paris/Serveurs",Paris:"Paris",Lyon:"Lyon",Groupes:"Groupes","Service Accounts":"Service Accounts",Builtin:"Builtin",Computers:"Computers","Domain Controllers":"Domain Controllers"};

  // check if it's actually under Lyon
  const lyonUsers=AD_TREE.children.find(c=>c.name==='Lyon')?.children.find(c=>c.name==='Utilisateurs');
  if(lyonUsers){}
}
return map[name]||name}

function renderADDetail(ou){const d=document.getElementById('winDetail');if(!d)return;

comps.forEach(c=>{h+=`<div class="wl-row"><div class="wl-cell"><span style="color:var(--win-success)">🖥️</span></div><div class="wl-cell" style="flex:2">${c.name}</div><div class="wl-cell" style="flex:2;font-size:10px">${c.os}</div><div class="wl-cell" style="font-size:10px">${c.lastLogon}</div></div>`});
if(!users.length&&!groups.length&&!comps.length)h+=`<div style="padding:20px;color:var(--win-text-dim);font-family:'Segoe UI',sans-serif;font-size:12px">Sélectionnez une OU dans l'arborescence.</div>`;
d.innerHTML=h;const s=document.getElementById('winStatus');if(s)s.textContent=`${users.length} user(s), ${groups.length} groupe(s), ${comps.length} PC(s)`}

// Context menus
function treeCtx(e,name,type){e.preventDefault();e.stopPropagation();const items=[];
if(type==='ou'){items.push({label:'👤 Nouvel utilisateur...',fn:()=>guiNewUser(ouPath(name))});items.push({label:'👥 Nouveau groupe...',fn:()=>guiNewGroup(ouPath(name))});items.push({sep:1})}
items.push({label:'🔄 Actualiser',fn:()=>guiRefresh()});showCtx(e.clientX,e.clientY,items)}

function objCtx(e,type,id){e.preventDefault();e.stopPropagation();const items=[];
if(type==='user'){items.push({label:'📋 Propriétés...',fn:()=>showUserProps(id)});
const u=adUsers.find(x=>x.sam===id);
if(u?.enabled)items.push({label:'🚫 Désactiver',fn:()=>{u.enabled=false;checkTasks();guiRefresh()}});
else if(u)items.push({label:'✅ Activer',fn:()=>{u.enabled=true;guiRefresh()}});
items.push({label:'👥 Ajouter à un groupe...',fn:()=>showAddToGroup(id)});items.push({sep:1});
items.push({label:'❌ Supprimer',fn:()=>{if(confirm('Supprimer '+id+' ?')){adUsers=adUsers.filter(x=>x.sam!==id);adGroups.forEach(g=>g.members=g.members.filter(m=>m!==id));checkTasks();guiRefresh()}}})}
if(type==='group'){items.push({label:'📋 Propriétés...',fn:()=>showGroupProps(id)});items.push({label:'👤 Ajouter membre...',fn:()=>showAddMember(id)})}
showCtx(e.clientX,e.clientY,items)}

function showCtx(x,y,items){const m=document.getElementById('ctxMenu');
m.innerHTML=items.map((it,i)=>it.sep?'<div class="ctx-sep"></div>':`<div class="ctx-item" data-i="${i}">${it.label}</div>`).join('');
m.querySelectorAll('.ctx-item').forEach(el=>{const i=parseInt(el.dataset.i);const fn=items[i]?.fn;el.onclick=()=>{m.style.display='none';if(fn)fn()}});
m.style.display='block';m.style.left=Math.min(x,innerWidth-200)+'px';m.style.top=Math.min(y,innerHeight-200)+'px'}
function hideCtx(){document.getElementById('ctxMenu').style.display='none'}

// Dialogs
function showDialog(title,fields,onOk){const r=document.getElementById('dialogRoot');
r.innerHTML=`<div class="win-dialog-overlay" onclick="if(event.target===this)closeDialog()"><div class="win-dialog"><div class="wd-title">${title}<button class="wd-close" onclick="closeDialog()">✕</button></div>
<div class="wd-body">${fields.map(f=>`<div class="wd-row"><label>${f.label}</label>${f.type==='select'?`<select id="dlg_${f.id}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='info'?`<div class="val">${f.value}</div>`:`<input id="dlg_${f.id}" value="${f.value||''}" placeholder="${f.ph||''}">`}</div>`).join('')}</div>
<div class="wd-actions"><button class="wd-btn" onclick="closeDialog()">Annuler</button><button class="wd-btn primary" id="dlgOk">OK</button></div></div></div>`;
document.getElementById('dlgOk').onclick=()=>{const v={};fields.forEach(f=>{if(f.id){const el=document.getElementById('dlg_'+f.id);if(el)v[f.id]=el.value}});onOk(v);closeDialog()}}
function closeDialog(){document.getElementById('dialogRoot').innerHTML=''}

function guiNewUser(ou){showDialog('Nouvel utilisateur',[
{label:'Nom complet',id:'name',ph:'Jean Dupont'},{label:'Identifiant (SAM)',id:'sam',ph:'jdupont'},{label:'Fonction',id:'title',ph:'Technicien'},{label:'Email',id:'email',ph:'user@econocom.local'},
{label:'OU',id:'ou',type:'select',opts:["Paris/Utilisateurs","Lyon/Utilisateurs"]}
],v=>{if(!v.sam||!v.name)return;adUsers.push({sam:v.sam,name:v.name,ou:v.ou||ou||'Paris/Utilisateurs',enabled:true,groups:['Domain Users'],email:v.email||'',title:v.title||'',lastLogon:'Jamais'});
adGroups.find(g=>g.name==='Domain Users')?.members.push(v.sam);checkTasks();guiRefresh()})}

function guiNewGroup(ou){showDialog('Nouveau groupe',[
{label:'Nom',id:'name',ph:'DevOps'},{label:'Étendue',id:'scope',type:'select',opts:['Global','Domain Local','Universal']},{label:'Type',id:'type',type:'select',opts:['Security','Distribution']}
],v=>{if(!v.name)return;adGroups.push({name:v.name,ou:ou||'Groupes',members:[],scope:v.scope||'Global',type:v.type||'Security'});checkTasks();guiRefresh()})}

function showUserProps(sam){const u=adUsers.find(x=>x.sam===sam);if(!u)return;
showDialog('Propriétés — '+u.name,[
{label:'Nom',type:'info',value:u.name},{label:'SAM',type:'info',value:u.sam},{label:'Email',type:'info',value:u.email||'—'},
{label:'Fonction',type:'info',value:u.title||'—'},{label:'OU',type:'info',value:u.ou},{label:'Groupes',type:'info',value:u.groups.join(', ')},
{label:'Dernière connexion',type:'info',value:u.lastLogon},{label:'État',type:'info',value:u.enabled?'✅ Actif':'❌ Désactivé'}],()=>{})}

function showGroupProps(name){const g=adGroups.find(x=>x.name===name);if(!g)return;
showDialog('Propriétés — '+g.name,[{label:'Nom',type:'info',value:g.name},{label:'Étendue',type:'info',value:g.scope},{label:'Type',type:'info',value:g.type},{label:'Membres',type:'info',value:g.members.length?g.members.join(', '):'(aucun)'}],()=>{})}

function showAddToGroup(sam){const avail=adGroups.filter(g=>!g.members.includes(sam)).map(g=>g.name);
if(!avail.length){alert('Déjà dans tous les groupes.');return}
showDialog('Ajouter '+sam+' à un groupe',[{label:'Groupe',id:'grp',type:'select',opts:avail}],v=>{
const g=adGroups.find(x=>x.name===v.grp);if(g){g.members.push(sam);const u=adUsers.find(x=>x.sam===sam);if(u&&!u.groups.includes(v.grp))u.groups.push(v.grp);checkTasks();guiRefresh()}})}

function showAddMember(grp){const g=adGroups.find(x=>x.name===grp);if(!g)return;
const avail=adUsers.filter(u=>!g.members.includes(u.sam)).map(u=>u.sam);
if(!avail.length){alert('Tous déjà membres.');return}
showDialog('Ajouter à '+grp,[{label:'Utilisateur',id:'usr',type:'select',opts:avail}],v=>{
g.members.push(v.usr);const u=adUsers.find(x=>x.sam===v.usr);if(u&&!u.groups.includes(grp))u.groups.push(grp);checkTasks();guiRefresh()})}

function guiRefresh(){const ou=ouPath(guiState.selNode||'Paris');renderADTree();renderADDetail(ou==='econocom.local'?'Paris/Utilisateurs':ou)}

function checkTasks(){const m=M[st.cm];if(!m.gui)return;const tasks=guiTasks[m.gui.type]||[];
const prevCount=guiState.tasksDone.length;
tasks.forEach(tk=>{if(!guiState.tasksDone.includes(tk.id)&&tk.check())guiState.tasksDone.push(tk.id)});
if(guiState.tasksDone.length>prevCount)svGui();
document.querySelectorAll('.gui-task').forEach((el,i)=>{if(tasks[i]){const done=guiState.tasksDone.includes(tasks[i].id);
el.className='gui-task '+(done?'success':'pending');el.innerHTML=(done?'✅':'📋')+' '+tasks[i].text}})}

// ========= INIT =========
rS();sM(st.cm);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS://ADMIN — Formation v3</title>
<link rel="stylesheet" href="https://unpkg.com/xp.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--win-bg:#ECE9D8;--win-title:#0A246A;--win-border:#808080;--win-tree-bg:#fff;--win-tree-sel:#316AC5;
--win-text:#000;--win-text-dim:#555;--win-hover:#316AC5;--win-btn:#D4D0C8;--win-btn-hover:#B5B3A8;
--win-success:#107c10;--win-error:#d83b01;
}
html,body{height:100%;background:#3A6EA5;font-family:Tahoma,'MS Sans Serif',sans-serif;font-size:11px;overflow:hidden;color:#000}
.app{display:flex;height:100vh;padding:2px;gap:2px}

/* ─── SIDEBAR ─── */
.sidebar{width:300px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
.sidebar .title-bar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);padding:3px 4px;display:flex;align-items:center;gap:6px}
.sidebar .title-bar-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px #000;letter-spacing:0.5px}
.sidebar .window-body{background:var(--win-bg);flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0;margin:0}
.sidebar-stats{padding:4px 8px;background:#D4D0C8;border-bottom:1px solid #808080;font-size:10px;color:#555;display:flex;gap:12px;flex-wrap:wrap}
.sidebar-stats span{color:#0A246A;font-weight:700}
.module-list{flex:1;overflow-y:auto;padding:2px}
.module-list::-webkit-scrollbar{width:16px}
.module-list::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.module-list::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.module-list ul.tree-view{margin:0;font-size:11px}

/* Tree view module items */
.cat-header{padding:4px 6px 2px;font-size:10px;letter-spacing:1px;font-weight:700;color:#0A246A;margin-top:2px;display:flex;align-items:center;gap:6px}
.cat-header.linux{color:#0A246A}.cat-header.windows{color:#0A246A}
.cat-header::after{content:'';flex:1;height:1px;background:#808080}
.mi{padding:3px 6px;cursor:pointer;border:1px solid transparent;margin-bottom:0;display:flex;align-items:center;gap:6px;font-size:11px;color:#000}
.mi:hover{background:#316AC5;color:#fff}
.mi.active{background:#316AC5;color:#fff;border:1px dotted #D4D0C8}
.mi.win:hover{background:#316AC5;color:#fff}.mi.win.active{background:#316AC5;color:#fff}
.mi.done .mi-s{color:var(--win-success)}.mi.win.done .mi-s{color:var(--win-success)}
.mi-n{font-size:10px;color:inherit;min-width:18px;opacity:.6}
.mi-t{flex:1;color:inherit;line-height:1.3}
.mi-lv{font-size:9px;margin-left:4px;opacity:.7}.mi-lv.beginner{color:#008000}.mi-lv.intermediate{color:#808000}.mi-lv.advanced{color:#B45F06}.mi-lv.expert{color:#C00000}
.mi.active .mi-lv,.mi:hover .mi-lv{color:#fff;opacity:.8}
.mi-s{font-size:11px;color:#808080}
.mi.active .mi-n,.mi:hover .mi-n{opacity:1}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{background:#D4D0C8;padding:0;border-bottom:1px solid #808080;display:flex;flex-direction:column}
.main-header .path-bar{padding:4px 8px;font-size:11px;color:#000;background:#fff;border:2px inset #D4D0C8;margin:4px 8px 2px}
.main-header .path-bar span{color:#808080}
.main-header.wa .path-bar{color:#000}
.path{font-size:11px;color:#000} .path span{color:#808080}
.tabs-bar{padding:0 4px}
.tabs{display:flex;gap:0;padding:0}
.tab{padding:4px 16px;font-size:11px;cursor:pointer;color:#000;border:1px solid #808080;border-bottom:none;background:#D4D0C8;font-family:Tahoma,sans-serif;margin-right:-1px;position:relative}
.tab:hover{background:#ECE9D8}
.tab.active{background:#ECE9D8;font-weight:700;z-index:1;border-bottom:1px solid #ECE9D8;margin-bottom:-1px}
.wa .tab.active{background:#ECE9D8}
.content{flex:1;overflow-y:auto;padding:12px 16px;background:#ECE9D8;border-top:1px solid #808080}
.content::-webkit-scrollbar{width:16px}
.content::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.content::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

/* ─── COURSE ─── */
.course h2{color:#0A246A;font-size:14px;margin-bottom:10px;font-weight:700;text-shadow:none}
.course.w h2{color:#0A246A}
.course h3{color:#000;font-size:12px;margin:14px 0 6px;font-weight:700}
.course p{line-height:1.6;margin-bottom:8px;font-size:11px}
.course code{background:#F0F0F0;color:#000;padding:1px 4px;border:1px solid #C0C0C0;font-family:'Courier New',monospace;font-size:11px}
.course.w code{background:#F0F0F0;color:#000}
.course pre{background:#F0F0F0;border:2px inset #D4D0C8;padding:8px;margin:8px 0;overflow-x:auto;line-height:1.5;font-size:11px;font-family:'Courier New',monospace}
.course pre code{background:none;border:none;padding:0}
.course .tip{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#E8F4F8;font-size:11px}
.course .warn{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#FFFACD;font-size:11px}
.course ul{margin:6px 0 6px 18px;line-height:1.8;font-size:11px}
.course ul li::marker{color:#0A246A}.course.w ul li::marker{color:#0A246A}

.mark-read{margin-top:16px;padding:4px 16px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.mark-read:hover{background:#B5B3A8}.mark-read:active{border-style:inset}
.mark-read.done{color:#808080;cursor:default}
.mark-read.wb{background:#D4D0C8;border:2px outset #D4D0C8;color:#000}.mark-read.wb:hover{background:#B5B3A8}

/* ─── QUIZ ─── */
.qq{margin-bottom:14px;padding:10px;border:2px inset #D4D0C8;background:#fff}
.qq .qn{font-size:10px;color:#808080;margin-bottom:4px}
.qq .qt{color:#000;margin-bottom:10px;line-height:1.5;font-size:11px}
.qo{display:block;width:100%;text-align:left;padding:4px 10px;margin-bottom:2px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.qo:hover:not(:disabled){background:#B5B3A8}
.qo:active:not(:disabled){border-style:inset}
.qo.c{background:#DFF0D8;border:2px solid #5CB85C;color:#000}
.qo.x{background:#F2DEDE;border:2px solid #D9534F;color:#000}
.qo:disabled{cursor:default;color:#808080}
.qe{margin-top:4px;padding:4px 8px;font-size:10px;color:#555;border-left:3px solid #0A246A;display:none}.qe.s{display:block}
.qs{text-align:center;padding:20px;font-size:12px;color:#0A246A}
.qs .big{font-size:36px;font-weight:700;display:block;margin:6px 0;text-shadow:none}
.qs.wb{color:#0A246A}.qs.wb .big{text-shadow:none}
.qr{margin-top:10px;padding:4px 18px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;cursor:pointer;font-size:11px}
.qr:hover{background:#B5B3A8}.qr:active{border-style:inset}
.qr.wb{border:2px outset #D4D0C8;color:#000}.qr.wb:hover{background:#B5B3A8}

/* ─── TERMINAL ─── */
.terminal{border:2px inset #D4D0C8;overflow:hidden;height:100%;display:flex;flex-direction:column;background:#000}
.terminal.w{background:#012456}
.tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);padding:3px 8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#fff;font-weight:700;text-shadow:1px 1px #000}
.terminal.w .tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%)}
.td{display:flex;gap:2px;margin-right:4px}
.tdo{width:14px;height:14px;display:none}
.tby{flex:1;padding:8px;overflow-y:auto;font-size:11px;line-height:1.6;font-family:'Courier New',monospace;color:#C0C0C0;background:#000}
.terminal.w .tby{background:#012456;color:#EEEDF0}
.tby::-webkit-scrollbar{width:16px}.tby::-webkit-scrollbar-track{background:#000}.tby::-webkit-scrollbar-thumb{background:#808080}
.tl{margin-bottom:1px}.tl .pr{color:#C0C0C0;font-weight:700}
.terminal.w .tl .pr{color:#EEEDF0}
.tl .cm{color:#fff}.tl .ou{color:#C0C0C0}.tl .ok{color:#00ff00}.terminal.w .tl .ok{color:#00ff00}.tl .er{color:#ff0000}
.ti{padding:6px 8px;margin-bottom:6px;background:#ECE9D8;border:2px inset #D4D0C8;color:#000;font-size:11px;line-height:1.4;font-family:Tahoma,sans-serif}
.ti .sn{color:#0A246A;font-size:10px;display:block;margin-bottom:2px;font-weight:700}
.th{font-size:10px;color:#808080;margin-top:2px;cursor:pointer;font-family:Tahoma,sans-serif}.th:hover{color:#0A246A}
.til{display:flex;align-items:center;gap:0;padding:2px 8px 8px;background:#000;font-family:'Courier New',monospace}
.terminal.w .til{background:#012456}
.til .pr{color:#C0C0C0;white-space:nowrap;font-size:11px;font-weight:700}
.terminal.w .til .pr{color:#EEEDF0}
.tinp{flex:1;background:none;border:none;color:#fff;font-family:'Courier New',monospace;font-size:11px;outline:none;caret-color:#C0C0C0;padding-left:3px}
.terminal.w .tinp{caret-color:#EEEDF0}

.lc{text-align:center;padding:20px;color:#0A246A;font-family:Tahoma,sans-serif}
.lc .big{font-size:18px;font-weight:700;margin-bottom:6px;text-shadow:none}
.terminal.w .lc{color:#0A246A}.terminal.w .lc .big{text-shadow:none}

.lab-toggle{display:flex;gap:2px;margin-bottom:8px}
.lt-btn{padding:4px 14px;font-size:11px;cursor:pointer;color:#000;border:2px outset #D4D0C8;background:#D4D0C8;font-family:Tahoma,sans-serif}
.lt-btn:hover{background:#B5B3A8}
.lt-btn.active{border-style:inset;background:#ECE9D8;font-weight:700}

/* ─── WIN SIMULATION (GUI AD etc.) ─── */
.win-sim{height:100%;display:flex;flex-direction:column;font-family:Tahoma,sans-serif;font-size:11px;color:#000;overflow:hidden;border:2px outset #D4D0C8}
.win-titlebar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);color:#fff;padding:3px 6px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;user-select:none;flex-shrink:0;text-shadow:1px 1px #000}
.win-titlebar .ico{text-shadow:none}
.win-titlebar .spacer{flex:1}
.win-btns{display:flex;gap:2px}
.win-btn{width:21px;height:21px;display:flex;align-items:center;justify-content:center;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:10px;font-weight:400;text-shadow:none;padding:0}
.win-btn:active{border-style:inset}
.win-btn.close:hover{background:#D4D0C8}

.win-toolbar{background:#D4D0C8;border-bottom:1px solid #808080;padding:2px 4px;display:flex;gap:2px;flex-wrap:wrap;flex-shrink:0}
.win-tool{padding:2px 8px;font-size:10px;background:#D4D0C8;border:1px solid transparent;cursor:pointer;font-family:Tahoma,sans-serif;color:#000}
.win-tool:hover{border:1px outset #D4D0C8;background:#ECE9D8}
.win-tool.active{border:1px inset #808080;background:#ECE9D8}

.win-body{flex:1;display:flex;overflow:hidden;background:#fff}
.win-tree{width:220px;min-width:180px;background:#fff;border-right:1px solid #808080;overflow-y:auto;padding:2px 0}
.win-tree::-webkit-scrollbar{width:16px}
.win-tree::-webkit-scrollbar-track{background:#D4D0C8}
.win-tree::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.wt-item{padding:2px 6px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:11px;user-select:none;white-space:nowrap}
.wt-item:hover{background:#316AC5;color:#fff}
.wt-item.sel{background:#316AC5;color:#fff}

.win-detail{flex:1;overflow-y:auto;background:#fff}
.win-detail::-webkit-scrollbar{width:16px}
.win-detail::-webkit-scrollbar-track{background:#D4D0C8}
.win-detail::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

.wl-header{display:flex;background:#D4D0C8;border-bottom:1px solid #808080;position:sticky;top:0;z-index:2}
.wl-h{flex:1;padding:3px 6px;font-size:10px;font-weight:700;color:#000;border-right:1px solid #fff;border-left:1px solid #808080;text-transform:uppercase;background:#D4D0C8;border-top:1px solid #fff;border-bottom:1px solid #808080}
.wl-row{display:flex;border-bottom:1px solid #ECE9D8;cursor:pointer}
.wl-row:nth-child(even){background:#F5F5F5}
.wl-row:hover{background:#316AC5;color:#fff}
.wl-cell{flex:1;padding:2px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #ECE9D8}

.win-status{background:#D4D0C8;border-top:1px solid #fff;padding:2px 8px;font-size:10px;color:#000;display:flex;justify-content:space-between;flex-shrink:0;border:1px inset #D4D0C8}

/* ─── CONTEXT MENU ─── */
.ctx-menu{position:fixed;background:#fff;border:1px solid #808080;box-shadow:2px 2px 4px rgba(0,0,0,.3);padding:2px 0;z-index:100000;min-width:180px;font-family:Tahoma,sans-serif;font-size:11px}
.ctx-item{padding:4px 20px 4px 8px;cursor:pointer;color:#000}
.ctx-item:hover{background:#316AC5;color:#fff}
.ctx-sep{height:1px;background:#808080;margin:2px 0}

/* ─── DIALOGS ─── */
.win-dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100001;display:flex;align-items:center;justify-content:center}
.win-dialog{background:#ECE9D8;border:2px outset #D4D0C8;width:380px;font-family:Tahoma,sans-serif;box-shadow:4px 4px 8px rgba(0,0,0,.4)}
.wd-title{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);color:#fff;padding:3px 8px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px #000}
.wd-close{background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:11px;width:21px;height:21px;display:flex;align-items:center;justify-content:center;text-shadow:none}
.wd-close:active{border-style:inset}
.wd-body{padding:12px}
.wd-row{margin-bottom:8px}
.wd-row label{display:block;font-size:10px;color:#000;margin-bottom:2px;font-weight:700}
.wd-row input,.wd-row select{width:100%;padding:3px 4px;border:2px inset #D4D0C8;font-family:Tahoma,sans-serif;font-size:11px;background:#fff}
.wd-row input:focus,.wd-row select:focus{outline:1px dotted #000}
.wd-row .val{font-size:11px;padding:2px 0}
.wd-actions{padding:8px 12px;background:#ECE9D8;border-top:1px solid #808080;display:flex;justify-content:flex-end;gap:6px}
.wd-btn{padding:3px 16px;border:2px outset #D4D0C8;background:#D4D0C8;cursor:pointer;font-family:Tahoma,sans-serif;font-size:11px}
.wd-btn:hover{background:#B5B3A8}.wd-btn:active{border-style:inset}
.wd-btn.primary{background:#D4D0C8;color:#000;border:2px outset #D4D0C8;font-weight:700}
.wd-btn.primary:hover{background:#B5B3A8}

/* ─── GUI TASKS ─── */
.gui-task{padding:4px 8px;margin:2px 4px;font-size:10px;display:flex;align-items:center;gap:4px;font-family:Tahoma,sans-serif}
.gui-task.pending{background:#FFFACD;border:1px solid #808080;color:#000}
.gui-task.success{background:#DFF0D8;border:1px solid #808080;color:#000}

/* ─── INCIDENT CARD ─── */
.incident-card{border:2px inset #D4D0C8;padding:10px 12px;margin-bottom:12px;font-family:Tahoma,sans-serif}
.incident-card[data-priority="BASSE"]{background:#F0F7F0}
.incident-card[data-priority="NORMALE"]{background:#F0F0F7}
.incident-card[data-priority="HAUTE"]{background:#FFF7E6}
.incident-card[data-priority="CRITIQUE"]{background:#FFF0F0}
.incident-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.incident-type{font-size:9px;font-weight:700;text-transform:uppercase;color:#0A246A;background:#D4D0C8;padding:1px 6px;border:1px outset #D4D0C8}
.incident-priority{font-size:9px;font-weight:700}
.incident-priority.BASSE{color:#107c10}.incident-priority.NORMALE{color:#0A246A}
.incident-priority.HAUTE{color:#B45F06}.incident-priority.CRITIQUE{color:#C0392B}
.incident-from{font-size:9px;color:#666;margin:4px 0}
.incident-msg{font-size:11px;font-style:italic;color:#333;line-height:1.5}

/* ─── OBJECTIVES PANEL ─── */
.objectives-panel{border:2px inset #D4D0C8;background:#F5F5F5;padding:8px;margin-bottom:8px;font-family:Tahoma,sans-serif}
.obj-title{font-size:10px;font-weight:700;color:#0A246A;margin-bottom:6px}
.obj-item{padding:3px 6px;font-size:10px;display:flex;align-items:center;gap:4px}
.obj-item.pending{color:#555}.obj-item.done{color:#107c10}

/* ─── LOCKED MODULE ─── */
.mi.locked{opacity:.5;cursor:default}
.mi.locked:hover{background:transparent;color:#000}

/* ─── XP PANEL ─── */
.xp-panel{padding:8px 12px;border-top:1px solid #C0C0C0;font-family:Tahoma,sans-serif}
.xp-header{display:flex;justify-content:space-between;font-size:10px;font-weight:700}
.xp-level{color:#666}
.xp-bar-track{height:12px;background:#C0C0C0;border:1px inset #808080;margin:4px 0}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#316AC5,#5B9BD5);transition:width .5s ease;max-width:100%}
.xp-sub{font-size:9px;color:#666;text-align:right}

/* ─── LEVEL UP MODAL ─── */
.levelup-window{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-20px);z-index:200000;width:360px;font-family:Tahoma,sans-serif;animation:levelUpIn .3s ease forwards}
@keyframes levelUpIn{from{transform:translate(-50%,-50%) translateY(-20px);opacity:0}to{transform:translate(-50%,-50%) translateY(0);opacity:1}}
.levelup-body{padding:16px;text-align:center;background:#ECE9D8}
.levelup-title{font-size:18px;font-weight:700;margin:8px 0}
.levelup-sub{font-size:11px;color:#666;margin-bottom:12px}
.levelup-rewards{text-align:left;font-size:10px;background:#fff;border:1px inset #808080;padding:8px;margin:8px 0;max-height:120px;overflow-y:auto}
.levelup-rewards div{padding:2px 0}

/* ─── QUEST TAB ─── */
.quest-panel{padding:12px}
.quest-item{border:2px inset #D4D0C8;padding:8px;margin-bottom:6px;background:#fff;font-family:Tahoma,sans-serif}
.quest-item.completed{background:#DFF0D8;opacity:.7}
.quest-item .quest-title{font-size:11px;font-weight:700;color:#0A246A}
.quest-item .quest-desc{font-size:10px;color:#333;margin:4px 0}
.quest-item .quest-reward{font-size:9px;color:#666}
.badge-chip{display:inline-block;padding:2px 8px;border:1px inset #D4D0C8;background:#ECE9D8;font-size:9px;font-family:Tahoma,sans-serif;margin:2px}

/* ─── LOCKED CMD ─── */
.cmd-panel{border:2px inset #D4D0C8;background:#F5F5F5;padding:6px 8px;margin-top:6px;font-family:Tahoma,sans-serif}
.cmd-panel-header{font-size:10px;font-weight:700;color:#0A246A;cursor:pointer}
.cmd-badge{display:inline-block;padding:1px 6px;border:1px solid #C0C0C0;background:#ECE9D8;font-size:9px;font-family:'Courier New',monospace;margin:2px}

/* ─── ADMIN PANEL ─── */
.admin-panel{width:280px;border-left:2px inset #D4D0C8;background:#ECE9D8;padding:8px;overflow-y:auto;font-family:Tahoma,sans-serif;font-size:10px}
.admin-panel h4{font-size:11px;color:#0A246A;margin:0 0 6px}
.admin-stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #D4D0C8}
.action-log{font-size:9px;color:#333;margin-top:8px;max-height:120px;overflow-y:auto}
.action-log div{padding:2px 0;border-bottom:1px dotted #D4D0C8}

/* ─── UNLOCK TOAST ─── */
.unlock-toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;background:#FFFACD;border:1px solid #CCC;font-family:Tahoma,sans-serif;font-size:11px;color:#333;z-index:10000;box-shadow:2px 2px 6px rgba(0,0,0,.2)}

.fade-up{animation:none}
@media(max-width:800px){.sidebar{width:250px;min-width:250px}}
@media(max-width:600px){.app{flex-direction:column}.sidebar{width:100%;min-width:auto;max-height:45vh}.content{padding:8px}}
</style>
</head>

{id:0,slug:"prise-de-poste",title:"Prise de poste",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"RH - Christine Morel",message:"Bienvenue ! Votre accès admin vient d\'être créé. Explorez le domaine ECONOCOM.LOCAL et familiarisez-vous avec l\'arborescence avant votre réunion de demain.",priority:"BASSE"},course:'<h2>Structure Active Directory</h2><p><strong>Active Directory</strong> (AD) est l\'annuaire centralisé de Microsoft. Il stocke les objets du réseau : utilisateurs, groupes, ordinateurs, GPO.</p><h3>Concepts clés</h3><ul><li><strong>Domaine</strong> — econocom.local : périmètre de sécurité</li><li><strong>DC</strong> (Domain Controller) — serveur hébergeant l\'AD</li><li><strong>OU</strong> (Organizational Unit) — conteneur pour organiser les objets</li><li><strong>Objets</strong> — Users, Groups, Computers, GPO</li></ul><h3>Arborescence type</h3><pre><code>econocom.local\n├── Paris\n│   ├── Utilisateurs\n│   ├── Postes\n│   └── Serveurs\n├── Lyon\n│   ├── Utilisateurs\n│   └── Postes\n├── Groupes\n└── Service Accounts</code></pre><h3>PowerShell AD</h3><pre><code>Import-Module ActiveDirectory\nGet-ADDomain\nGet-ADOrganizationalUnit -Filter *\nGet-ADUser -Filter * | Select Name,SamAccountName</code></pre><div class="tip">💡 Toujours importer le module ActiveDirectory avant d\'utiliser les cmdlets AD.</div>',objectives:[{id:"obj0a",text:"Explorer l\'arborescence AD",check:()=>guiState.selNode!==null},{id:"obj0b",text:"Cliquer sur l\'OU Utilisateurs",check:()=>guiState.selNode==='Utilisateurs'||guiState.tasksDone.includes('obj0b')},{id:"obj0c",text:"Consulter les propriétés d\'un utilisateur (double-clic)",check:()=>guiState.tasksDone.includes('obj0c')}],quiz:[{q:"Que signifie OU ?",o:["Operating Unit","Organizational Unit","Object User","Outer Unit"],c:1,e:"Organizational Unit — conteneur d\'organisation."},{q:"Quel protocole utilise AD ?",o:["HTTP","FTP","LDAP","SMTP"],c:2,e:"LDAP (Lightweight Directory Access Protocol)."},{q:"Qu\'est-ce qu\'un DC ?",o:["Un firewall","Un serveur hébergeant l\'AD","Un switch","Un serveur DHCP"],c:1,e:"Domain Controller = serveur AD."},{q:"Quel cmdlet liste les OUs ?",o:["Get-OU","Get-ADOrganizationalUnit -Filter *","List-OU","Get-ADObject"],c:1,e:"Get-ADOrganizationalUnit -Filter *"},{q:"Que contient un domaine AD ?",o:["Uniquement des PCs","Users, Groups, Computers, GPO","Seulement des fichiers","Des VMs"],c:1,e:"Tous les objets de l\'annuaire."}],lab:[{i:"Importe le module Active Directory",x:["Import-Module ActiveDirectory"],o:"Module ActiveDirectory chargé.",h:"Import-Module"},{i:"Affiche les infos du domaine",x:["Get-ADDomain"],o:"Forest: econocom.local\nDomainMode: Windows2016Domain\nPDCEmulator: SRV-DC01",h:"Get-ADDomain"},{i:"Liste toutes les OUs",x:["Get-ADOrganizationalUnit -Filter *"],o:"OU=Paris,DC=econocom,DC=local\nOU=Lyon,DC=econocom,DC=local\nOU=Groupes,DC=econocom,DC=local",h:"Get-ADOrganizationalUnit -Filter *"},{i:"Liste tous les utilisateurs",x:["Get-ADUser -Filter *"],o:"administrator True\njdupont True\nmmartin True\npdurand True\ntest.user False",h:"Get-ADUser -Filter *"},{i:"Liste tous les groupes",x:["Get-ADGroup -Filter *"],o:"IT-Support Global Security\nRH Global Security\nDomain Users Global Security\nDomain Admins Global Security",h:"Get-ADGroup -Filter *"}]},
{id:1,slug:"premier-utilisateur",title:"Premier utilisateur",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:{type:"ad"},incident:{type:"TICKET",from:"Manager - Julien Faure",message:"Nouvelle recrue lundi : Sophie Lambert, Comptable, rattachée à Paris/Utilisateurs. Merci de créer son compte et son accès réseau.",priority:"NORMALE"},course:'<h2>Créer un utilisateur AD</h2><p>La création d\'un compte AD suit des conventions de nommage strictes.</p><h3>Convention de nommage</h3><ul><li><strong>SamAccountName</strong> : prenom.nom (ex: sophie.lambert)</li><li><strong>UPN</strong> : sophie.lambert@econocom.local</li><li><strong>DisplayName</strong> : Sophie Lambert</li></ul><h3>New-ADUser</h3><pre><code>New-ADUser -Name "Sophie Lambert" `\n  -SamAccountName sophie.lambert `\n  -UserPrincipalName sophie.lambert@econocom.local `\n  -Path "OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" `\n  -AccountPassword (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force) `\n  -Enabled $true</code></pre><h3>Activer un compte</h3><pre><code>Enable-ADAccount -Identity sophie.lambert</code></pre><h3>Modifier les propriétés</h3><pre><code>Set-ADUser sophie.lambert -Title "Comptable" -Department "Finance"</code></pre><div class="warn">⚠️ Un compte créé sans -Enabled $true est désactivé par défaut !</div>',objectives:[{id:"obj1a",text:"Créer sophie.lambert dans Paris/Utilisateurs",check:()=>adUsers.some(u=>u.sam==='sophie.lambert')},{id:"obj1b",text:"Activer le compte sophie.lambert",check:()=>{const u=adUsers.find(x=>x.sam==='sophie.lambert');return u&&u.enabled}},{id:"obj1c",text:"Vérifier que sophie.lambert est dans Domain Users",check:()=>adGroups.find(g=>g.name==='Domain Users')?.members.includes('sophie.lambert')}],quiz:[{q:"Cmdlet pour créer un utilisateur ?",o:["Add-ADUser","New-ADUser","Create-ADUser","Set-ADUser"],c:1,e:"New-ADUser."},{q:"Compte désactivé par défaut si ?",o:["-Enabled manquant","Mot de passe faible","OU incorrecte","Groupe manquant"],c:0,e:"Sans -Enabled $true, le compte est disabled."},{q:"SamAccountName de Sophie Lambert ?",o:["slambert","sophie.lambert","Sophie.Lambert","s.lambert"],c:1,e:"Convention : prenom.nom en minuscules."},{q:"Activer un compte désactivé ?",o:["Set-ADUser -Active","Enable-ADAccount","Unlock-ADAccount","Start-ADAccount"],c:1,e:"Enable-ADAccount."},{q:"-Path dans New-ADUser ?",o:["Chemin fichier","OU de destination","Domaine","Mot de passe"],c:1,e:"L\'OU où placer l\'objet."}],lab:[{i:"Crée le compte sophie.lambert",x:['New-ADUser -Name "Sophie Lambert" -SamAccountName sophie.lambert -Path "OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" -AccountPassword (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force) -Enabled $true'],o:"Utilisateur sophie.lambert créé.",h:'New-ADUser -Name "Sophie Lambert" -SamAccountName sophie.lambert ...'},{i:"Vérifie que le compte existe",x:["Get-ADUser sophie.lambert"],o:"sophie.lambert True Sophie Lambert",h:"Get-ADUser sophie.lambert"},{i:"Ajoute le titre Comptable",x:['Set-ADUser sophie.lambert -Title "Comptable"'],o:"",h:'Set-ADUser sophie.lambert -Title "Comptable"'},{i:"Active le compte (si nécessaire)",x:["Enable-ADAccount sophie.lambert","Enable-ADAccount -Identity sophie.lambert"],o:"",h:"Enable-ADAccount"},{i:"Affiche toutes les propriétés",x:["Get-ADUser sophie.lambert -Properties *"],o:"Name: Sophie Lambert\nSAM: sophie.lambert\nEnabled: True\nTitle: Comptable",h:"Get-ADUser ... -Properties *"}]},
{id:2,slug:"comptes-oublies",title:"Comptes oubliés",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"AUDIT",from:"RSSI - Marc Petit",message:"Audit sécurité : des comptes inactifs depuis 90 jours ont été détectés. Identifiez-les et désactivez-les immédiatement.",priority:"HAUTE"},course:'<h2>Gestion des comptes inactifs</h2><p>Les comptes inactifs sont une faille de sécurité majeure. Un attaquant peut les exploiter sans alerter personne.</p><h3>Identifier les comptes inactifs</h3><pre><code>Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00\nGet-ADUser -Filter * -Properties LastLogonDate | \n  Where-Object {$_.LastLogonDate -eq $null}\nGet-ADUser -Filter * -Properties LastLogonDate | \n  Where-Object {$_.LastLogonDate -lt (Get-Date).AddDays(-90)}</code></pre><h3>Désactiver un compte</h3><pre><code>Disable-ADAccount -Identity test.user\nGet-ADUser test.user -Properties Enabled</code></pre><h3>Rechercher les comptes désactivés</h3><pre><code>Search-ADAccount -AccountDisabled</code></pre><div class="warn">⚠️ Ne jamais supprimer un compte sans validation RH — désactivez d\'abord, supprimez après le délai RGPD.</div>',objectives:[{id:"obj2a",text:"Désactiver le compte test.user",check:()=>{const u=adUsers.find(x=>x.sam==='test.user');return !u||!u.enabled}},{id:"obj2b",text:"Identifier les comptes avec LastLogon: Jamais",check:()=>guiState.tasksDone.includes('obj2b')}],quiz:[{q:"Cmdlet pour trouver les comptes inactifs ?",o:["Get-InactiveAccount","Search-ADAccount -AccountInactive","Find-ADUser","Get-ADUser -Inactive"],c:1,e:"Search-ADAccount -AccountInactive."},{q:"TimeSpan 90.00:00:00 = ?",o:["90 heures","90 minutes","90 jours","90 secondes"],c:2,e:"90 jours."},{q:"Désactiver vs supprimer ?",o:["Identique","Désactiver = réversible","Supprimer = réversible","Les deux réversibles"],c:1,e:"Désactiver est réversible, supprimer non."},{q:"LastLogonDate null signifie ?",o:["Connexion récente","Jamais connecté","Compte admin","Erreur"],c:1,e:"L\'utilisateur ne s\'est jamais connecté."},{q:"Pourquoi les comptes inactifs sont dangereux ?",o:["Ils ralentissent AD","Exploitables par un attaquant","Ils consomment des licences","Ils bloquent les GPO"],c:1,e:"Un attaquant peut les utiliser sans alerter."}],lab:[{i:"Recherche les comptes inactifs depuis 90 jours",x:["Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00"],o:"test.user Inactive LastLogon:Jamais",h:"Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00"},{i:"Liste les utilisateurs jamais connectés",x:["Get-ADUser -Filter * -Properties LastLogonDate | Where-Object {$_.LastLogonDate -eq $null}"],o:"test.user LastLogonDate:\nadmin.service LastLogonDate:",h:"Where LastLogonDate -eq $null"},{i:"Désactive test.user",x:["Disable-ADAccount test.user","Disable-ADAccount -Identity test.user"],o:"",h:"Disable-ADAccount"},{i:"Vérifie l\'état du compte",x:["Get-ADUser test.user -Properties Enabled"],o:"test.user Enabled:False",h:"Get-ADUser ... -Properties Enabled"},{i:"Liste tous les comptes désactivés",x:["Search-ADAccount -AccountDisabled"],o:"test.user Disabled",h:"Search-ADAccount -AccountDisabled"}]},
{id:3,slug:"groupes-acces",title:"Groupes et accès",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"INCIDENT",from:"DSI - Ahmed Benali",message:"L\'équipe DevOps ne peut pas accéder au partage \\\\SRV-FILE\\Projets. Il manque un groupe de sécurité. Créez GRP_DevOps et ajoutez les membres concernés.",priority:"HAUTE"},course:'<h2>Groupes Active Directory</h2><p>Les groupes permettent de gérer les accès aux ressources de manière centralisée.</p><h3>Types et portées</h3><ul><li><strong>Global</strong> — membres du même domaine, utilisable partout</li><li><strong>Domain Local</strong> — membres de n\'importe où, utilisable localement</li><li><strong>Universal</strong> — membres et utilisation inter-forêts</li></ul><h3>Principe AGDLP</h3><p><strong>A</strong>ccount → <strong>G</strong>lobal → <strong>D</strong>omain <strong>L</strong>ocal → <strong>P</strong>ermission</p><pre><code>New-ADGroup -Name "GRP_DevOps" `\n  -GroupScope Global `\n  -GroupCategory Security\nAdd-ADGroupMember -Identity GRP_DevOps -Members jdupont,pdurand\nGet-ADGroupMember GRP_DevOps</code></pre><div class="tip">💡 Principe du moindre privilège : n\'accordez que les droits strictement nécessaires.</div>',objectives:[{id:"obj3a",text:"Créer le groupe GRP_DevOps (Global, Security)",check:()=>adGroups.some(g=>g.name==='GRP_DevOps')},{id:"obj3b",text:"Ajouter jdupont à GRP_DevOps",check:()=>adGroups.find(g=>g.name==='GRP_DevOps')?.members.includes('jdupont')},{id:"obj3c",text:"Ajouter pdurand à GRP_DevOps",check:()=>adGroups.find(g=>g.name==='GRP_DevOps')?.members.includes('pdurand')}],quiz:[{q:"Portée Global signifie ?",o:["Utilisable partout","Membres locaux seulement","Membres du domaine, utilisable partout","Inter-forêts"],c:2,e:"Membres du domaine, utilisable dans toute la forêt."},{q:"AGDLP — que signifie le G ?",o:["General","Group Policy","Global Group","Gateway"],c:2,e:"Global Group."},{q:"Créer un groupe de sécurité ?",o:["New-ADGroup -GroupCategory Security","New-SecurityGroup","Add-ADGroup","Set-Group"],c:0,e:"New-ADGroup avec -GroupCategory Security."},{q:"Ajouter un membre à un groupe ?",o:["Set-ADGroupMember","Add-ADGroupMember","New-ADGroupMember","Join-ADGroup"],c:1,e:"Add-ADGroupMember."},{q:"Principe du moindre privilège ?",o:["Donner tous les droits","Droits minimum nécessaires","Pas de droits","Droits admin par défaut"],c:1,e:"Uniquement les droits strictement nécessaires."}],lab:[{i:"Crée le groupe GRP_DevOps",x:['New-ADGroup -Name "GRP_DevOps" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_DevOps créé.",h:'New-ADGroup -Name "GRP_DevOps" -GroupScope Global -GroupCategory Security'},{i:"Ajoute jdupont au groupe",x:["Add-ADGroupMember -Identity GRP_DevOps -Members jdupont"],o:"",h:"Add-ADGroupMember -Identity GRP_DevOps -Members jdupont"},{i:"Vérifie les membres",x:["Get-ADGroupMember GRP_DevOps"],o:"jdupont",h:"Get-ADGroupMember GRP_DevOps"},{i:"Ajoute pdurand au groupe",x:["Add-ADGroupMember -Identity GRP_DevOps -Members pdurand"],o:"",h:"Add-ADGroupMember -Identity GRP_DevOps -Members pdurand"},{i:"Liste tous les groupes",x:["Get-ADGroup -Filter *","Get-ADGroup -Filter * | Select Name,GroupScope"],o:"IT-Support Global Security\nRH Global Security\nGRP_DevOps Global Security\nDomain Users Global Security",h:"Get-ADGroup -Filter *"}]},
{id:4,slug:"reset-mdp",title:"Réinitialisation de mot de passe",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"INCIDENT",from:"Helpdesk - Laura Vidal",message:"URGENT : thomas.bernard (Directeur Commercial) est bloqué depuis ce matin. Compte verrouillé après 5 tentatives échouées + mot de passe expiré. Réunion client dans 10 minutes.",priority:"CRITIQUE"},course:'<h2>Réinitialisation et déverrouillage de compte</h2><p>Un compte AD peut être <strong>verrouillé</strong> après plusieurs tentatives de connexion échouées. La stratégie de verrouillage (<em>Account Lockout Policy</em>) définit le seuil, la durée et le compteur.</p><h3>Attributs clés</h3><ul><li><code>badPwdCount</code> — nombre de tentatives échouées</li><li><code>LockedOut</code> — True si le compte est verrouillé</li><li><code>lockoutThreshold</code> — seuil de verrouillage (ex: 5)</li><li><code>lockoutDuration</code> — durée du verrouillage automatique</li></ul><h3>Déverrouiller un compte</h3><pre><code>Unlock-ADAccount -Identity thomas.bernard</code></pre><p>Réinitialise le compteur badPwdCount à 0 et déverrouille immédiatement.</p><h3>Réinitialiser le mot de passe</h3><pre><code>Set-ADAccountPassword thomas.bernard -Reset `\n  -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)</code></pre><p>L\'option <code>-Reset</code> force la définition sans connaître l\'ancien mot de passe.</p><h3>Forcer le changement à la prochaine connexion</h3><pre><code>Set-ADUser thomas.bernard -ChangePasswordAtLogon $true</code></pre><div class="warn">⚠️ Ne communiquez jamais un mot de passe temporaire par email non chiffré. Privilégiez un appel téléphonique ou un canal sécurisé.</div><h3>Stratégie de mot de passe du domaine</h3><pre><code>Get-ADDefaultDomainPasswordPolicy</code></pre><p>Affiche : complexité, longueur minimale, durée de vie max, seuil de verrouillage, historique.</p><div class="tip">💡 L\'attribut <code>PasswordNeverExpires</code> contourne l\'expiration — à réserver aux comptes de service, jamais aux comptes nominatifs.</div>',objectives:[{id:"obj4a",text:"Déverrouiller/activer thomas.bernard",check:()=>{const u=adUsers.find(x=>x.sam==='thomas.bernard');return u&&u.enabled}},{id:"obj4b",text:"Vérifier que thomas.bernard est opérationnel",check:()=>guiState.tasksDone.includes('obj4b')}],quiz:[{q:"Quelle cmdlet déverrouille un compte AD sans réinitialiser le mot de passe ?",o:["Reset-ADAccount","Unlock-ADAccount","Enable-ADAccount","Set-ADAccountPassword"],c:1,e:"Unlock-ADAccount réinitialise badPwdCount et déverrouille immédiatement."},{q:"Quel attribut AD indique le nombre de tentatives échouées ?",o:["FailedLogonCount","badPwdCount","LockoutCount","WrongPasswordAttempts"],c:1,e:"badPwdCount est incrémenté à chaque échec de connexion."},{q:"Que fait -ChangePasswordAtLogon $true ?",o:["Désactive le compte après connexion","Force un nouveau mot de passe à la prochaine connexion","Active l\'expiration mensuelle","Empêche tout changement de mot de passe"],c:1,e:"L\'utilisateur DOIT changer son mot de passe dès sa prochaine connexion."},{q:"Quel est le risque de PasswordNeverExpires sur un compte nominatif ?",o:["Aucun risque","Le mot de passe peut rester compromis indéfiniment","Le compte se désactive automatiquement","Les GPO ne s\'appliquent plus"],c:1,e:"Un mot de passe qui n\'expire jamais peut être exploité sans limite de temps."},{q:"Quelle cmdlet affiche la stratégie de mot de passe du domaine ?",o:["Get-ADPasswordPolicy","Get-DomainPolicy","Get-ADDefaultDomainPasswordPolicy","Show-PasswordRules"],c:2,e:"Get-ADDefaultDomainPasswordPolicy retourne tous les paramètres de la politique de mots de passe."}],lab:[{i:"Déverrouillez le compte thomas.bernard",x:["Unlock-ADAccount thomas.bernard","Unlock-ADAccount -Identity thomas.bernard"],o:"Le compte thomas.bernard a été déverrouillé.",h:"Unlock-ADAccount -Identity thomas.bernard"},{i:"Réinitialisez le mot de passe avec TempP@ss1!",x:['Set-ADAccountPassword thomas.bernard -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)','Set-ADAccountPassword -Identity thomas.bernard -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)'],o:"Le mot de passe de thomas.bernard a été réinitialisé.",h:'Set-ADAccountPassword ... -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" ...)'},{i:"Forcez le changement de mot de passe à la prochaine connexion",x:["Set-ADUser thomas.bernard -ChangePasswordAtLogon $true","Set-ADUser -Identity thomas.bernard -ChangePasswordAtLogon $true"],o:"ChangePasswordAtLogon activé pour thomas.bernard.",h:"Set-ADUser thomas.bernard -ChangePasswordAtLogon $true"},{i:"Vérifiez les propriétés LockedOut et BadPwdCount",x:["Get-ADUser thomas.bernard -Properties LockedOut,BadPwdCount","Get-ADUser -Identity thomas.bernard -Properties LockedOut,BadPwdCount"],o:"Name: Thomas Bernard\nEnabled: True\nLockedOut: False\nBadPwdCount: 0",h:"Get-ADUser thomas.bernard -Properties LockedOut,BadPwdCount"},{i:"Affichez la stratégie de mot de passe du domaine",x:["Get-ADDefaultDomainPasswordPolicy"],o:"ComplexityEnabled: True\nLockoutThreshold: 5\nLockoutDuration: 00:30:00\nMaxPasswordAge: 90.00:00:00\nMinPasswordLength: 8\nPasswordHistoryCount: 24",h:"Get-ADDefaultDomainPasswordPolicy"}]},
{id:5,slug:"delegation-controle",title:"Délégation de contrôle",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"N+1 - Pierre Dupuis",message:"Les managers de Lyon doivent pouvoir réinitialiser les mots de passe des utilisateurs de leur OU sans disposer de droits admin complets. Mettez en place la délégation de contrôle.",priority:"NORMALE"},course:'<h2>Délégation de contrôle Active Directory</h2><p>La <strong>délégation de contrôle</strong> applique le principe du <em>moindre privilège</em> : accorder uniquement les droits nécessaires sur un périmètre défini, sans octroyer Domain Admin.</p><h3>Concept des ACL sur les OU</h3><p>Chaque objet AD possède un <strong>descripteur de sécurité</strong> contenant une liste de contrôle d\'accès (ACL). On y définit des permissions granulaires :</p><ul><li><code>ResetPassword</code> — réinitialiser le mot de passe</li><li><code>GenericRead</code> — lire les propriétés</li><li><code>GenericAll</code> — contrôle total (à éviter)</li><li><code>WriteProperty</code> — modifier des attributs spécifiques</li></ul><h3>Avec dsacls (ligne de commande)</h3><pre><code>dsacls "OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local" `\n  /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"</code></pre><p>Le flag <code>CA</code> = Control Access, <code>;user</code> limite la portée aux objets utilisateur.</p><h3>Vérifier les ACL avec PowerShell</h3><pre><code>Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"</code></pre><h3>Bonnes pratiques</h3><p>Créez un <strong>groupe de sécurité dédié</strong> (GRP_HelpDeskLyon), déléguez les droits à ce groupe, puis gérez les membres. Ainsi la gestion des habilitations se fait via le groupe, sans toucher aux ACL.</p><pre><code>New-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security\nAdd-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand</code></pre><div class="tip">💡 L\'assistant de délégation graphique (Delegation of Control Wizard) dans ADUC offre une interface guidée mais moins flexible que dsacls pour les cas avancés.</div>',objectives:[{id:"obj5a",text:"Créer le groupe GRP_HelpDeskLyon",check:()=>adGroups.some(g=>g.name==='GRP_HelpDeskLyon')},{id:"obj5b",text:"Ajouter pdurand à GRP_HelpDeskLyon",check:()=>adGroups.find(g=>g.name==='GRP_HelpDeskLyon')?.members.includes('pdurand')}],quiz:[{q:"Quel principe de sécurité justifie la délégation plutôt que Domain Admin ?",o:["Séparation des tâches","Moindre privilège","Défense en profondeur","Traçabilité"],c:1,e:"Le moindre privilège : accorder uniquement les droits strictement nécessaires."},{q:"Que signifie le flag CA dans dsacls ?",o:["Create Account","Control Access","Change Attribute","Custom ACL"],c:1,e:"CA = Control Access, permet d\'accorder un droit étendu (Extended Right)."},{q:"Quelle permission dsacls permet uniquement de réinitialiser les mots de passe ?",o:["GenericAll","GenericWrite","Reset Password","FullControl"],c:2,e:"Reset Password est le droit étendu spécifique à la réinitialisation."},{q:"Quelle cmdlet PowerShell affiche les ACL d\'une OU ?",o:["Get-ADPermission","Get-ACL","Show-ADAccess","Get-ADObjectAcl"],c:1,e:"Get-ACL avec le préfixe AD: et le DN de l\'OU."},{q:"Pourquoi déléguer à un groupe plutôt qu\'à un utilisateur ?",o:["C\'est obligatoire","On gère les membres sans modifier les ACL","Les ACL ne supportent pas les utilisateurs","Pour la performance"],c:1,e:"Gestion simplifiée : ajout/retrait de membres sans toucher aux ACL."}],lab:[{i:"Créez le groupe GRP_HelpDeskLyon",x:['New-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_HelpDeskLyon créé.",h:'New-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security'},{i:"Ajoutez pdurand au groupe GRP_HelpDeskLyon",x:["Add-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand"],o:"pdurand ajouté au groupe GRP_HelpDeskLyon.",h:"Add-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand"},{i:"Déléguez le droit Reset Password sur l\'OU Lyon/Utilisateurs",x:['dsacls "OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local" /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"'],o:"La délégation Reset Password a été appliquée sur OU=Utilisateurs,OU=Lyon.",h:'dsacls "OU=..." /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"'},{i:"Vérifiez les ACL de l\'OU Lyon/Utilisateurs",x:['Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"'],o:"Path: OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local\nOwner: BUILTIN\\Administrators\nAccess: ECONOCOM\\GRP_HelpDeskLyon Allow ResetPassword",h:'Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"'},{i:"Listez les membres du groupe GRP_HelpDeskLyon",x:["Get-ADGroupMember GRP_HelpDeskLyon","Get-ADGroupMember -Identity GRP_HelpDeskLyon"],o:"Name: Pierre Durand\nSamAccountName: pdurand\nobjectClass: user",h:"Get-ADGroupMember GRP_HelpDeskLyon"}]},
{id:6,slug:"gpo-securite",title:"GPO — Sécurité poste",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"gpo"},incident:{type:"ALERTE",from:"SOC - Equipe sécurité",message:"Incident de sécurité physique dans l\'open-space de Paris : plusieurs postes sans politique de verrouillage d\'écran ont été trouvés accessibles sans surveillance. Aucune GPO de sécurité n\'est déployée sur l\'OU Postes. Déployez immédiatement.",priority:"CRITIQUE"},course:'<h2>Stratégies de groupe (GPO)</h2><p>Les <strong>GPO</strong> (Group Policy Objects) appliquent des configurations centralisées aux ordinateurs et utilisateurs d\'une OU, d\'un site ou du domaine entier.</p><h3>Créer une GPO</h3><pre><code>New-GPO -Name "SEC_LockScreen"</code></pre><p>La GPO est créée mais <strong>non liée</strong> : aucun effet tant qu\'elle n\'est pas associée à un conteneur AD.</p><h3>Lier une GPO à une OU</h3><pre><code>New-GPLink -Name "SEC_LockScreen" `\n  -Target "OU=Postes,OU=Paris,DC=econocom,DC=local"</code></pre><h3>Configurer un paramètre via GPO</h3><pre><code>Set-GPRegistryValue -Name "SEC_LockScreen" `\n  -Key "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization" `\n  -ValueName "NoLockScreen" -Type DWord -Value 0</code></pre><h3>Paramètres de sécurité essentiels</h3><ul><li><strong>Verrouillage d\'écran</strong> — économiseur + mot de passe requis</li><li><strong>Stratégie de mot de passe</strong> — complexité, longueur, historique</li><li><strong>Restriction logicielle</strong> — AppLocker, SRP</li><li><strong>Mappage de lecteurs</strong> — H: Home, S: Commun</li></ul><h3>Héritage et priorité</h3><p>Ordre d\'application (du moins au plus prioritaire) : <strong>Local → Site → Domaine → OU</strong>. L\'option <em>Enforced</em> sur une GPO parente empêche les enfants de la remplacer. <em>Block Inheritance</em> sur une OU bloque l\'héritage (sauf Enforced).</p><h3>Forcer l\'application</h3><pre><code>gpupdate /force</code></pre><p>Sans cette commande, les GPO se rafraîchissent toutes les 90 min (±30 min aléatoires).</p><div class="warn">⚠️ Testez toujours une GPO sur un groupe pilote avant un déploiement large. Une mauvaise configuration peut verrouiller des milliers de postes.</div>',objectives:[{id:"gpo1",text:"Créer une GPO \'SEC_LockScreen\'",check:()=>gpoList.some(g=>g.n==='SEC_LockScreen')},{id:"gpo2",text:"Lier la GPO à OU=Postes",check:()=>gpoList.some(g=>g.n==='SEC_LockScreen'&&g.l.includes('Postes'))}],quiz:[{q:"Quelle cmdlet crée une nouvelle GPO ?",o:["Add-GPO","New-GroupPolicy","New-GPO","Create-GPO"],c:2,e:"New-GPO -Name \"NomGPO\" crée une GPO non liée."},{q:"Une GPO créée mais non liée a quel effet ?",o:["S\'applique à tous","S\'applique aux DCs","Aucun effet","S\'applique aux admins"],c:2,e:"Une GPO non liée n\'a aucun effet. Il faut la lier avec New-GPLink."},{q:"Ordre d\'application des GPO (moins → plus prioritaire) ?",o:["OU → Domaine → Site → Local","Local → Site → Domaine → OU","Domaine → Local → Site → OU","Site → OU → Local → Domaine"],c:1,e:"L-S-D-OU : Local, Site, Domaine, OU (LSDOU)."},{q:"Quelle commande force l\'application immédiate des GPO ?",o:["Update-GPO","Refresh-Policy","gpupdate /force","gprefresh /all"],c:2,e:"gpupdate /force rafraîchit immédiatement les GPO computer et user."},{q:"Quelle option sur une GPO parente empêche les GPO enfants de la remplacer ?",o:["Block Inheritance","Enforced","No Override","Locked"],c:1,e:"Enforced (anciennement No Override) force l\'application malgré les GPO enfants."}],lab:[{i:"Créez la GPO SEC_LockScreen",x:['New-GPO -Name "SEC_LockScreen"'],o:"DisplayName: SEC_LockScreen\nDomainName: econocom.local\nGpoStatus: AllSettingsEnabled",h:'New-GPO -Name "SEC_LockScreen"'},{i:"Liez la GPO à l\'OU Postes de Paris",x:['New-GPLink -Name "SEC_LockScreen" -Target "OU=Postes,OU=Paris,DC=econocom,DC=local"'],o:"GpoId: {a1b2c3d4}\nEnabled: True\nTarget: OU=Postes,OU=Paris",h:'New-GPLink -Name "SEC_LockScreen" -Target "OU=Postes,OU=Paris,..."'},{i:"Listez toutes les GPO du domaine",x:["Get-GPO -All"],o:"Default Domain Policy\nDefault Domain Controllers Policy\nSEC_LockScreen",h:"Get-GPO -All"},{i:"Configurez NoLockScreen=0 dans la GPO",x:['Set-GPRegistryValue -Name "SEC_LockScreen" -Key "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization" -ValueName "NoLockScreen" -Type DWord -Value 0'],o:"KeyPath: SOFTWARE\\Policies\\...\\Personalization\nValueName: NoLockScreen\nValue: 0",h:'Set-GPRegistryValue -Name "SEC_LockScreen" -Key "HKLM\\..." -ValueName "NoLockScreen" ...'},{i:"Forcez l\'application des GPO",x:["gpupdate /force"],o:"Mise à jour de la stratégie...\nStratégie ordinateur: OK\nStratégie utilisateur: OK",h:"gpupdate /force"}]},
{id:7,slug:"depart-employe",title:"Départ d'un employé",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"TICKET",from:"RH - Christine Morel",message:"Départ ce soir de nicolas.rousseau (Technicien IT). Procédure obligatoire : désactiver le compte, retirer de tous les groupes sauf Domain Users, déplacer vers OU=Archives. Conservation 30 jours minimum (RGPD).",priority:"HAUTE"},course:'<h2>Procédure de départ — Offboarding AD</h2><p>Le départ d\'un collaborateur nécessite une procédure rigoureuse pour sécuriser le SI tout en respectant les obligations légales (RGPD).</p><h3>1. Désactiver le compte</h3><pre><code>Disable-ADAccount -Identity nicolas.rousseau</code></pre><p><strong>Désactiver ≠ Supprimer</strong> : la désactivation conserve toutes les données (groupes, attributs, historique). La suppression est irréversible et détruit le SID unique du compte.</p><h3>2. Lister et retirer les groupes</h3><pre><code>Get-ADPrincipalGroupMembership nicolas.rousseau\nRemove-ADGroupMember -Identity "IT-Support" `\n  -Members nicolas.rousseau -Confirm:$false</code></pre><div class="warn">⚠️ Le groupe <em>Domain Users</em> est le groupe primaire : il ne peut pas être retiré via Remove-ADGroupMember.</div><h3>3. Déplacer vers OU Archives</h3><pre><code>Move-ADObject `\n  -Identity "CN=nicolas.rousseau,OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" `\n  -TargetPath "OU=Archives,DC=econocom,DC=local"</code></pre><p>Le déplacement garantit que les GPO de production ne s\'appliquent plus.</p><h3>4. Vérification finale</h3><pre><code>Get-ADUser nicolas.rousseau -Properties MemberOf,Enabled</code></pre><h3>RGPD et durée de conservation</h3><p>En France, les données RH sont conservées <strong>5 ans</strong> après la fin du contrat. Les comptes AD doivent rester consultables pendant cette période pour les auditeurs.</p><h3>Checklist offboarding</h3><ul><li>✅ Compte désactivé</li><li>✅ Groupes retirés (sauf Domain Users)</li><li>✅ Déplacé en OU Archives</li><li>✅ Boîte mail en délégation au manager</li><li>✅ Ticket RH fermé avec trace des actions</li></ul><div class="tip">💡 Automatisez ce processus avec un script PowerShell et un déclencheur sur les tickets RH pour éviter les oublis.</div>',objectives:[{id:"obj7a",text:"Désactiver nicolas.rousseau",check:()=>{const u=adUsers.find(x=>x.sam==='nicolas.rousseau');return u&&!u.enabled}},{id:"obj7b",text:"Retirer nicolas.rousseau de ses groupes (sauf Domain Users)",check:()=>{const gs=adGroups.filter(g=>g.members.includes('nicolas.rousseau'));return gs.length===0||gs.every(g=>g.name==='Domain Users')}}],quiz:[{q:"Pourquoi désactiver plutôt que supprimer immédiatement ?",o:["La suppression est trop lente","Pour respecter la rétention légale et conserver les données","AD interdit la suppression","Pour que l\'utilisateur puisse revenir"],c:1,e:"La désactivation est réversible et respecte les obligations RGPD de conservation."},{q:"Quel groupe AD ne peut PAS être retiré via Remove-ADGroupMember ?",o:["Domain Admins","IT-Support","Domain Users (groupe primaire)","Tous peuvent être retirés"],c:2,e:"Domain Users est le groupe primaire et ne peut pas être retiré avec cette cmdlet."},{q:"Quelle cmdlet liste tous les groupes d\'un utilisateur ?",o:["Get-ADUserGroups","Get-ADMemberOf","Get-ADPrincipalGroupMembership","Get-ADGroupMember"],c:2,e:"Get-ADPrincipalGroupMembership retourne tous les groupes dont l\'utilisateur est membre."},{q:"Quel avantage de déplacer le compte en OU Archives ?",o:["Suppression automatique après 30j","Les GPO de production ne s\'appliquent plus","Accélère les performances AD","Le compte devient invisible"],c:1,e:"Les GPO liées aux OUs de production ne s\'appliquent plus au compte archivé."},{q:"Durée minimale de conservation RH en France (RGPD) ?",o:["1 an","3 ans","5 ans","10 ans"],c:2,e:"5 ans après la fin du contrat pour les données RH en France."}],lab:[{i:"Désactivez le compte nicolas.rousseau",x:["Disable-ADAccount nicolas.rousseau","Disable-ADAccount -Identity nicolas.rousseau"],o:"Le compte nicolas.rousseau a été désactivé.",h:"Disable-ADAccount nicolas.rousseau"},{i:"Listez les groupes de nicolas.rousseau",x:["Get-ADPrincipalGroupMembership nicolas.rousseau","Get-ADPrincipalGroupMembership -Identity nicolas.rousseau"],o:"Domain Users\nIT-Support",h:"Get-ADPrincipalGroupMembership nicolas.rousseau"},{i:"Retirez nicolas.rousseau du groupe IT-Support",x:['Remove-ADGroupMember -Identity "IT-Support" -Members nicolas.rousseau -Confirm:$false'],o:"nicolas.rousseau retiré du groupe IT-Support.",h:'Remove-ADGroupMember -Identity "IT-Support" -Members nicolas.rousseau -Confirm:$false'},{i:"Déplacez nicolas.rousseau vers OU=Archives",x:['Move-ADObject -Identity "CN=nicolas.rousseau,OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" -TargetPath "OU=Archives,DC=econocom,DC=local"'],o:"nicolas.rousseau déplacé vers OU=Archives.",h:'Move-ADObject -Identity "CN=nicolas.rousseau,..." -TargetPath "OU=Archives,..."'},{i:"Vérifiez l\'état final du compte",x:["Get-ADUser nicolas.rousseau -Properties MemberOf,Enabled"],o:"Name: Nicolas Rousseau\nEnabled: False\nMemberOf: {CN=Domain Users,...}\nOU: Archives",h:"Get-ADUser nicolas.rousseau -Properties MemberOf,Enabled"}]},
{id:8,slug:"sites-replication",title:"Sites et réplication",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"ALERTE",from:"Infrastructure - Kevin Moreau",message:"Les utilisateurs de Lyon se connectent lentement : l'authentification passe par le DC de Paris via le WAN. Aucun site AD Lyon n'est configuré. Les temps de réponse dépassent 8 secondes. Corrigez avant lundi.",priority:"HAUTE"},course:'<h2>Sites AD et réplication</h2><p>Les <strong>sites Active Directory</strong> définissent la topologie physique du réseau. Ils permettent au KCC (Knowledge Consistency Checker) d\'optimiser la réplication et l\'authentification.</p><h3>Pourquoi les sites ?</h3><ul><li><strong>Authentification locale</strong> — les clients contactent le DC le plus proche</li><li><strong>Réplication optimisée</strong> — compression et planification inter-sites</li><li><strong>Services localisés</strong> — DFS, DFSR, Exchange utilisent les sites</li></ul><h3>Composants</h3><ul><li><strong>Site</strong> — représente un emplacement physique (Paris, Lyon)</li><li><strong>Site Link</strong> — connexion entre sites (coût, fréquence)</li><li><strong>Subnet</strong> — plage IP associée à un site</li><li><strong>KCC</strong> — génère automatiquement la topologie de réplication</li><li><strong>Bridgehead Server</strong> — DC désigné pour la réplication inter-sites</li></ul><h3>Commandes PowerShell</h3><pre><code>Get-ADReplicationSite -Filter *\nNew-ADReplicationSite -Name "Lyon"\nNew-ADReplicationSiteLink -Name "Paris-Lyon" `\n  -SitesIncluded Paris,Lyon -Cost 100 -ReplicationFrequencyInMinutes 15\nNew-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"</code></pre><h3>Coût et fréquence</h3><p>Le <strong>coût</strong> détermine la route préférée (plus bas = préféré). La <strong>fréquence</strong> définit l\'intervalle de réplication (minimum 15 min). La réplication intra-site est instantanée (notification-based), la réplication inter-site est planifiée.</p><div class="tip">💡 Associez toujours un subnet à un site. Sans subnet, les clients ne peuvent pas déterminer leur site AD et contactent un DC aléatoire.</div><div class="warn">⚠️ Un site sans DC force les clients à s\'authentifier via le WAN — c\'est exactement le problème de Lyon ici.</div>',objectives:[{id:"obj8a",text:"Explorer la structure AD",check:()=>guiState.selNode!==null},{id:"obj8b",text:"Créer un groupe GRP_Lyon_IT",check:()=>adGroups.some(g=>g.name==='GRP_Lyon_IT')}],quiz:[{q:"Quel composant AD génère automatiquement la topologie de réplication ?",o:["DFSR","KCC","SYSVOL","PDC Emulator"],c:1,e:"Le KCC (Knowledge Consistency Checker) calcule et maintient la topologie de réplication."},{q:"Que représente le coût d\'un Site Link ?",o:["Le prix en euros","La priorité de la route (plus bas = préféré)","La bande passante","Le nombre de DCs"],c:1,e:"Plus le coût est bas, plus la route est préférée pour la réplication."},{q:"Quelle est la fréquence minimale de réplication inter-sites ?",o:["1 minute","5 minutes","15 minutes","60 minutes"],c:2,e:"La fréquence minimale est 15 minutes pour la réplication inter-sites."},{q:"Que se passe-t-il sans subnet associé à un site ?",o:["Erreur de réplication","Les clients contactent un DC aléatoire","Le site est supprimé","La réplication s\'arrête"],c:1,e:"Sans subnet, les clients ne peuvent pas déterminer leur site et contactent n\'importe quel DC."},{q:"La réplication intra-site est de quel type ?",o:["Planifiée toutes les 15 min","Par notification (quasi-instantanée)","Manuelle","Quotidienne"],c:1,e:"La réplication intra-site utilise le mécanisme de notification : quasi-instantanée (< 1 sec par défaut)."}],lab:[{i:"Listez les sites AD existants",x:["Get-ADReplicationSite -Filter *"],o:"Name: Default-First-Site-Name\nName: Paris",h:"Get-ADReplicationSite -Filter *"},{i:"Créez le site AD Lyon",x:['New-ADReplicationSite -Name "Lyon"',"New-ADReplicationSite -Name Lyon"],o:"Site Lyon créé.",h:'New-ADReplicationSite -Name "Lyon"'},{i:"Créez le lien de site Paris-Lyon avec un coût de 100",x:['New-ADReplicationSiteLink -Name "Paris-Lyon" -SitesIncluded Paris,Lyon -Cost 100'],o:"SiteLink Paris-Lyon créé. Cost: 100, Frequency: 180min",h:'New-ADReplicationSiteLink -Name "Paris-Lyon" -SitesIncluded Paris,Lyon -Cost 100'},{i:"Listez les liens de site",x:["Get-ADReplicationSiteLink -Filter *"],o:"Name: DEFAULTIPSITELINK\nName: Paris-Lyon (Cost: 100)",h:"Get-ADReplicationSiteLink -Filter *"},{i:"Associez le subnet 10.1.0.0/16 au site Lyon",x:['New-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"'],o:"Subnet 10.1.0.0/16 associé au site Lyon.",h:'New-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"'}]},
{id:9,slug:"fgpp",title:"Fine-Grained Password Policy",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"RSSI - Marc Petit",message:"Les comptes de service et les administrateurs doivent avoir des politiques de mots de passe plus strictes que les utilisateurs standard. La Default Domain Policy ne suffit pas. Implémentez des PSO (Password Settings Objects).",priority:"NORMALE"},course:'<h2>Fine-Grained Password Policies (FGPP)</h2><p>Depuis Windows Server 2008, les <strong>PSO</strong> (Password Settings Objects) permettent d\'appliquer des stratégies de mot de passe différentes selon les groupes, sans modifier la Default Domain Policy.</p><h3>Pourquoi les FGPP ?</h3><p>La Default Domain Policy s\'applique à <strong>tous</strong> les utilisateurs. Mais les admins et comptes de service nécessitent des règles plus strictes :</p><ul><li>Admins : 16 caractères, complexité, rotation 30 jours</li><li>Service accounts : 24 caractères, pas d\'expiration</li><li>Users standard : 8 caractères, rotation 90 jours</li></ul><h3>Créer un PSO</h3><pre><code>New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" `\n  -Precedence 10 `\n  -MinPasswordLength 16 `\n  -ComplexityEnabled $true `\n  -PasswordHistoryCount 24 `\n  -MaxPasswordAge 30.00:00:00 `\n  -LockoutThreshold 3</code></pre><h3>Associer un PSO à un groupe</h3><pre><code>Add-ADFineGrainedPasswordPolicySubject `\n  -Identity "PSO_Admins" -Subjects "GRP_Admins"</code></pre><h3>Precedence</h3><p>Si un utilisateur est soumis à plusieurs PSO, celui avec la <strong>precedence la plus basse</strong> (nombre le plus petit) gagne. Exemple : PSO_Admins (10) > PSO_Standard (20).</p><h3>Vérifier les PSO</h3><pre><code>Get-ADFineGrainedPasswordPolicy -Filter *\nGet-ADFineGrainedPasswordPolicySubject "PSO_Admins"\nGet-ADUserResultantPasswordPolicy -Identity jdupont</code></pre><div class="tip">💡 Les PSO ne s\'appliquent qu\'aux groupes Global ou directement aux utilisateurs, jamais aux OUs.</div><div class="warn">⚠️ Le niveau fonctionnel du domaine doit être au minimum Windows Server 2008 pour utiliser les FGPP.</div>',objectives:[{id:"obj9a",text:"Créer le groupe GRP_Admins",check:()=>adGroups.some(g=>g.name==='GRP_Admins')},{id:"obj9b",text:"Ajouter jdupont à GRP_Admins",check:()=>adGroups.find(g=>g.name==='GRP_Admins')?.members.includes('jdupont')}],quiz:[{q:"Que signifie PSO ?",o:["Password Security Object","Password Settings Object","Policy Settings Override","Protected Security Option"],c:1,e:"PSO = Password Settings Object, objet AD contenant une stratégie de mot de passe."},{q:"Comment fonctionne la precedence des PSO ?",o:["Plus haute = prioritaire","Plus basse = prioritaire","Alphabétique","Ordre de création"],c:1,e:"Le PSO avec la precedence la plus basse (nombre le plus petit) est appliqué en priorité."},{q:"Les PSO peuvent être appliqués à quels objets ?",o:["OUs uniquement","Groupes Global et utilisateurs","Tous les types d\'objets","Sites AD"],c:1,e:"Les PSO s\'appliquent aux groupes Global ou directement aux utilisateurs, jamais aux OUs."},{q:"Quel niveau fonctionnel minimum pour les FGPP ?",o:["Windows 2003","Windows 2008","Windows 2012","Windows 2016"],c:1,e:"Le niveau fonctionnel Windows Server 2008 minimum est requis pour les FGPP."},{q:"Quelle cmdlet montre la politique effective d\'un utilisateur ?",o:["Get-ADPasswordPolicy","Get-ADUserResultantPasswordPolicy","Get-EffectivePolicy","Show-ADUserPassword"],c:1,e:"Get-ADUserResultantPasswordPolicy montre le PSO effectivement appliqué à un utilisateur."}],lab:[{i:"Créez le groupe GRP_Admins",x:['New-ADGroup -Name "GRP_Admins" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_Admins créé.",h:'New-ADGroup -Name "GRP_Admins" -GroupScope Global -GroupCategory Security'},{i:"Créez le PSO PSO_Admins (16 chars, precedence 10)",x:['New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" -Precedence 10 -MinPasswordLength 16 -ComplexityEnabled $true -PasswordHistoryCount 24'],o:"PSO PSO_Admins créé. MinLength: 16, Precedence: 10",h:'New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" -Precedence 10 -MinPasswordLength 16 ...'},{i:"Associez PSO_Admins au groupe GRP_Admins",x:['Add-ADFineGrainedPasswordPolicySubject -Identity "PSO_Admins" -Subjects "GRP_Admins"'],o:"PSO_Admins appliqué au groupe GRP_Admins.",h:'Add-ADFineGrainedPasswordPolicySubject -Identity "PSO_Admins" -Subjects "GRP_Admins"'},{i:"Listez tous les PSO du domaine",x:["Get-ADFineGrainedPasswordPolicy -Filter *"],o:"Name: PSO_Admins\nPrecedence: 10\nMinPasswordLength: 16\nComplexityEnabled: True\nPasswordHistoryCount: 24",h:"Get-ADFineGrainedPasswordPolicy -Filter *"},{i:"Ajoutez jdupont au groupe GRP_Admins",x:["Add-ADGroupMember -Identity GRP_Admins -Members jdupont"],o:"jdupont ajouté à GRP_Admins.",h:"Add-ADGroupMember -Identity GRP_Admins -Members jdupont"}]},
{id:10,slug:"audit-journalisation",title:"Audit et journalisation",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"event-viewer"},incident:{type:"AUDIT",from:"Commissaires aux comptes",message:"Audit ISO 27001 dans 2 semaines. Vous devez prouver que toutes les modifications AD sont tracées et que les logs sont consultables. Préparez les Event IDs clés et démontrez l'exploitation des journaux.",priority:"HAUTE"},course:'<h2>Audit Active Directory</h2><p>L\'audit AD est essentiel pour la conformité (ISO 27001, SOC2, RGPD) et la détection d\'incidents. Windows enregistre les événements de sécurité dans le journal <strong>Security</strong>.</p><h3>Event IDs critiques</h3><ul><li><strong>4720</strong> — Compte utilisateur créé</li><li><strong>4722</strong> — Compte activé</li><li><strong>4723</strong> — Tentative de changement de mot de passe</li><li><strong>4724</strong> — Réinitialisation de mot de passe</li><li><strong>4725</strong> — Compte désactivé</li><li><strong>4726</strong> — Compte supprimé</li><li><strong>4728</strong> — Membre ajouté à un groupe de sécurité</li><li><strong>4740</strong> — Compte verrouillé</li><li><strong>4625</strong> — Échec de connexion</li><li><strong>4624</strong> — Connexion réussie</li></ul><h3>Get-WinEvent</h3><pre><code># 10 dernières créations de compte\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4720} -MaxEvents 10\n\n# Échecs de connexion\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4625} -MaxEvents 5\n\n# Erreurs système\nGet-WinEvent -LogName System -MaxEvents 20 | \n  Where-Object {$_.LevelDisplayName -eq \'Error\'}</code></pre><h3>Advanced Audit Policy</h3><pre><code>AuditPol /get /category:*\nAuditPol /set /subcategory:"Directory Service Changes" /success:enable /failure:enable</code></pre><h3>Export CSV pour les auditeurs</h3><pre><code>Get-WinEvent -FilterHashtable @{LogName=\'Security\'} | \n  Export-Csv C:\\audit.csv -NoTypeInformation</code></pre><div class="tip">💡 Activez l\'audit avancé (Advanced Audit Policy) plutôt que la stratégie basique pour un contrôle granulaire.</div><div class="warn">⚠️ Les journaux ont une taille limitée. Configurez la rétention et le transfert vers un SIEM (Splunk, ELK) pour ne pas perdre d\'événements.</div>',objectives:[{id:"ev1",text:"Filtrer pour afficher uniquement les erreurs (System)",check:()=>evFilter.level==='Error'&&evActiveTab==='System'},{id:"ev2",text:"Consulter le journal Security",check:()=>evActiveTab==='Security'},{id:"ev3",text:"Rechercher \'login\' dans les événements",check:()=>evFilter.search.toLowerCase().includes('login')}],quiz:[{q:"Quel Event ID correspond à la création d\'un compte ?",o:["4624","4625","4720","4740"],c:2,e:"4720 = User Account Created. 4624 = logon success, 4625 = logon failure."},{q:"Quel Event ID signale un échec de connexion ?",o:["4624","4625","4720","4726"],c:1,e:"4625 = An account failed to log on."},{q:"Quelle cmdlet PowerShell remplace Get-EventLog pour les journaux modernes ?",o:["Read-EventLog","Get-WinEvent","Search-EventLog","Find-Event"],c:1,e:"Get-WinEvent est la cmdlet moderne qui supporte les journaux ETW et le filtrage XPath."},{q:"Que fait AuditPol /get /category:* ?",o:["Crée une politique d\'audit","Affiche toutes les catégories d\'audit actives","Supprime les logs","Active tout l\'audit"],c:1,e:"AuditPol /get affiche l\'état actuel de toutes les catégories et sous-catégories d\'audit."},{q:"Pourquoi transférer les logs vers un SIEM ?",o:["Pour la performance","Pour la rétention longue durée et la corrélation","Par obligation légale uniquement","Pour les supprimer du serveur"],c:1,e:"Un SIEM assure la rétention, la corrélation d\'événements et l\'alerting en temps réel."}],lab:[{i:"Affichez les 10 dernières créations de compte (Event ID 4720)",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4720} -MaxEvents 10"],o:"TimeCreated: 27/03/2026 14:30\nId: 4720\nMessage: A user account was created. sophie.lambert",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4720} -MaxEvents 10"},{i:"Listez les catégories d\'audit actives",x:["AuditPol /get /category:*"],o:"Account Logon: Success and Failure\nAccount Management: Success\nDirectory Service Access: No Auditing\nLogon/Logoff: Success and Failure",h:"AuditPol /get /category:*"},{i:"Recherchez les 5 derniers échecs de connexion",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 5"],o:"TimeCreated: 27/03/2026 03:42\nId: 4625\nMessage: An account failed to log on. admin.service\nIP: 10.0.0.55",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 5"},{i:"Affichez les erreurs système",x:["Get-WinEvent -LogName System -MaxEvents 20 | Where-Object {$_.LevelDisplayName -eq 'Error'}","Get-WinEvent -LogName System -MaxEvents 20 | Where {$_.LevelDisplayName -eq 'Error'}"],o:"DCOM Error 10016\nNTFS Error 137\nKernel-Power Error 41",h:"Get-WinEvent -LogName System ... | Where LevelDisplayName -eq 'Error'"},{i:"Exportez le journal Security en CSV",x:["Get-WinEvent -FilterHashtable @{LogName='Security'} | Export-Csv C:\\audit.csv"],o:"Export terminé: C:\\audit.csv (847 événements)",h:"... | Export-Csv C:\\audit.csv"}]},
{id:11,slug:"incident-securite",title:"Incident de sécurité — compte compromis",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"ALERTE",from:"SOC - CRITIQUE",message:"COMPROMISSION DÉTECTÉE : le compte admin.service a généré 847 tentatives d'authentification en 3 minutes depuis l'IP 10.0.0.55 (inconnue). Suspicion de mouvement latéral. Containment immédiat requis.",priority:"CRITIQUE"},course:'<h2>Réponse à incident — Compte compromis</h2><p>Un compte compromis dans AD peut permettre à un attaquant de se déplacer latéralement, d\'escalader ses privilèges et d\'accéder à des données sensibles. La réponse doit être <strong>immédiate et méthodique</strong>.</p><h3>Phase 1 : Containment</h3><pre><code># Désactiver le compte immédiatement\nDisable-ADAccount admin.service\n\n# Réinitialiser le mot de passe\nSet-ADAccountPassword admin.service -Reset `\n  -NewPassword (ConvertTo-SecureString "EmergencyP@ss!" -AsPlainText -Force)</code></pre><h3>Phase 2 : Investigation</h3><pre><code># Dernière connexion et attributs\nGet-ADUser admin.service -Properties *\n\n# Tentatives de connexion échouées (Event ID 4625)\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4625} -MaxEvents 20\n\n# Connexions réussies récentes (Event ID 4624)\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4624} -MaxEvents 20</code></pre><h3>Phase 3 : Éradication</h3><ul><li>Purger les tickets Kerberos : <code>klist purge</code></li><li>Si Golden Ticket suspecté : <strong>double reset du compte krbtgt</strong></li><li>Vérifier les comptes de service avec SPN</li></ul><pre><code># Comptes avec SPN (cibles de Kerberoasting)\nGet-ADUser -Filter {ServicePrincipalName -like "*"} `\n  -Properties ServicePrincipalName</code></pre><h3>Indicateurs de compromission (IOC)</h3><ul><li>Connexions depuis des IPs inhabituelles</li><li>Activité hors heures de bureau</li><li>Nombre anormal de tentatives en peu de temps</li><li>Accès à des ressources inhabituelles</li></ul><h3>Golden Ticket et krbtgt</h3><p>Le compte <code>krbtgt</code> signe tous les tickets Kerberos TGT. Si compromis, l\'attaquant peut forger des tickets illimités (Golden Ticket). Le seul remède est un <strong>double reset</strong> du mot de passe krbtgt (2 resets espacés de 12h minimum).</p><div class="warn">⚠️ Le reset de krbtgt invalide TOUS les tickets Kerberos existants. Planifiez-le en heures creuses et prévenez les équipes.</div><div class="tip">💡 Documentez chaque action horodatée dans un rapport d\'incident. C\'est indispensable pour les assurances cyber et la conformité.</div>',objectives:[{id:"obj11a",text:"Désactiver admin.service",check:()=>{const u=adUsers.find(x=>x.sam==='admin.service');return !u||!u.enabled}},{id:"obj11b",text:"Vérifier les dernières connexions (consulter propriétés)",check:()=>guiState.tasksDone.includes('obj11b')}],quiz:[{q:"Quelle est la première action lors d\'une compromission de compte ?",o:["Analyser les logs","Désactiver le compte immédiatement","Appeler la police","Réinstaller le serveur"],c:1,e:"Le containment (désactivation) est la priorité absolue pour stopper l\'attaquant."},{q:"Que permet un Golden Ticket Kerberos ?",o:["Accéder à un seul service","Forger des tickets d\'accès illimités","Réinitialiser tous les mots de passe","Supprimer l\'AD"],c:1,e:"Un Golden Ticket forge des TGT valides pour n\'importe quel service, avec n\'importe quel privilège."},{q:"Comment remédier à un Golden Ticket ?",o:["Supprimer le compte compromis","Double reset du mot de passe krbtgt","Redémarrer tous les DCs","Recréer le domaine"],c:1,e:"Le double reset de krbtgt (espacé de 12h) invalide tous les tickets Kerberos existants."},{q:"Quel Event ID indique un échec de connexion ?",o:["4624","4625","4720","4771"],c:1,e:"4625 = An account failed to log on. 4771 = Kerberos pre-authentication failed."},{q:"Qu\'est-ce que le Kerberoasting ?",o:["Un type de phishing","L\'extraction de hash SPN pour cracker les mots de passe offline","Une attaque DDoS","Un outil de monitoring"],c:1,e:"Le Kerberoasting demande des tickets de service (TGS) pour des comptes avec SPN, puis les cracke offline."}],lab:[{i:"Désactivez immédiatement le compte admin.service",x:["Disable-ADAccount admin.service","Disable-ADAccount -Identity admin.service"],o:"[URGENT] Compte admin.service désactivé. Containment effectué.",h:"Disable-ADAccount admin.service"},{i:"Consultez les propriétés complètes de admin.service",x:["Get-ADUser admin.service -Properties *","Get-ADUser -Identity admin.service -Properties LastLogon,LastLogonDate,LockedOut,BadPwdCount"],o:"Name: Admin Service\nEnabled: False\nLastLogonDate: 27/03/2026 03:42\nBadPwdCount: 847\nLockedOut: True\nMemberOf: Domain Admins",h:"Get-ADUser admin.service -Properties *"},{i:"Recherchez les échecs de connexion récents (4625)",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 20"],o:"27/03 03:42 - admin.service - IP:10.0.0.55 - Status:0xC000006D\n27/03 03:42 - admin.service - IP:10.0.0.55 - Status:0xC000006D\n(847 événements similaires...)",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 20"},{i:"Purgez les tickets Kerberos en cache",x:["klist purge"],o:"Current LogonId: 0:0x3e7\nTickets purged: 4 tickets supprimés.",h:"klist purge"},{i:"Recherchez les comptes avec SPN (cibles Kerberoasting)",x:["Get-ADUser -Filter {ServicePrincipalName -like \"*\"} -Properties ServicePrincipalName"],o:"Name: Admin Service\nSPN: MSSQLSvc/SRV-DB01.econocom.local:1433\n\nName: SVC-Backup\nSPN: backup/SRV-DC01.econocom.local",h:'Get-ADUser -Filter {ServicePrincipalName -like "*"} -Properties ServicePrincipalName'}]}

{id:12,slug:"intro-terminal",title:"Le Terminal : Premiers Pas",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Le Terminal : Premiers Pas</h2><p>Le terminal est l\'interface texte pour communiquer avec le système.</p><h3>Le prompt</h3><pre><code>user@machine:~$</code></pre><p><code>$</code> = utilisateur normal, <code>#</code> = root.</p><h3>Premières commandes</h3><ul><li><code>pwd</code> — répertoire courant</li><li><code>whoami</code> — nom utilisateur</li><li><code>date</code> — date/heure</li><li><code>echo "texte"</code> — affiche texte</li><li><code>clear</code> — efface écran</li><li><code>history</code> — historique</li></ul><div class="tip">💡 ↑ = dernière commande, Tab = auto-complétion.</div><h3>Structure</h3><pre><code>commande -option argument\nls -la /home</code></pre>',quiz:[{q:"$ dans le prompt ?",o:["Root","User normal","Erreur","Déconnecté"],c:1,e:"$ = standard, # = root."},{q:"Répertoire courant ?",o:["cd","ls","pwd","whoami"],c:2,e:"pwd."},{q:"whoami ?",o:["Change user","Affiche nom user","Liste users","Déconnecte"],c:1,e:"Nom de l'utilisateur."},{q:"Dernière commande ?",o:["Ctrl+Z","↑","Tab","Ctrl+R"],c:1,e:"↑ parcourt l'historique."},{q:"'/home' dans 'ls -la /home' ?",o:["Option","Flag","Argument","Pipe"],c:2,e:"Argument."}],lab:[{i:"Affiche ton nom d'utilisateur",x:["whoami"],o:"admin",h:"who..."},{i:"Répertoire courant",x:["pwd"],o:"/home/admin",h:"pwd"},{i:"Affiche la date",x:["date"],o:"Fri Mar 27 14:23:01 CET 2026",h:"4 lettres"},{i:"Affiche 'Hello World'",x:['echo "Hello World"','echo Hello World',"echo 'Hello World'"],o:"Hello World",h:"echo texte"},{i:"Efface l'écran",x:["clear"],o:"[effacé]",h:"cl..."}]},
{id:13,slug:"filesystem",title:"Système de Fichiers",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Système de Fichiers Linux</h2><p>Tout part de <code>/</code>.</p><h3>Dossiers principaux</h3><ul><li><code>/home</code> — personnels</li><li><code>/etc</code> — config</li><li><code>/var</code> — logs</li><li><code>/tmp</code> — temporaire</li></ul><h3>Navigation</h3><pre><code>ls -la   cd /etc   cd ..   cd ~</code></pre><h3>Manipulation</h3><pre><code>mkdir dossier   touch fichier\ncp src dst   mv src dst   rm fichier</code></pre><div class="warn">⚠️ rm -rf / = destruction totale.</div>',quiz:[{q:"Racine ?",o:["/home","C:\\","/","/root"],c:2,e:"/"},{q:"Config ?",o:["/home","/etc","/bin","/tmp"],c:1,e:"/etc"},{q:"cd .. ?",o:["Home","Racine","Remonte","Liste"],c:2,e:"Parent."},{q:"Fichier vide ?",o:["mkdir","touch","create","new"],c:1,e:"touch."},{q:"Fichiers cachés ?",o:["-l","-h","-a","-r"],c:2,e:"-a."}],lab:[{i:"Liste détaillée",x:["ls -l","ls -la","ls -al"],o:"drwxr-xr-x config\n-rw-r--r-- .bashrc",h:"ls -l"},{i:"Va dans /etc",x:["cd /etc"],o:"",h:"cd"},{i:"Crée 'projets'",x:["mkdir projets"],o:"",h:"mkdir"},{i:"Crée 'readme.txt'",x:["touch readme.txt"],o:"",h:"touch"},{i:"10 lignes de /etc/passwd",x:["head /etc/passwd","head -n 10 /etc/passwd"],o:"root:x:0:0:root\ndaemon:x:1:1",h:"head"}]},
{id:14,slug:"permissions",title:"Permissions et Propriétés",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Permissions</h2><pre><code>-rwxr-xr-- 1 admin devs script.sh</code></pre><ul><li>rwx=proprio, r-x=groupe, r--=autres</li></ul><h3>chmod</h3><pre><code>chmod u+x script.sh\nchmod 755 script.sh\nchmod 600 secret</code></pre><div class="tip">💡 4=r, 2=w, 1=x → 7=rwx</div><h3>chown</h3><pre><code>chown user:groupe fichier</code></pre>',quiz:[{q:"Premier - dans -rwx... ?",o:["Pas perm","Fichier","Lien","Dossier"],c:1,e:"- = fichier."},{q:"Octal rwx ?",o:["4","5","6","7"],c:3,e:"4+2+1=7."},{q:"chmod 600 ?",o:["Tous lisent","rw proprio","Exec tous","Rien"],c:1,e:"6=rw, 0=rien."},{q:"Changer proprio ?",o:["chmod","chown","chgrp","usermod"],c:1,e:"chown."},{q:"r-x ?",o:["Read+exec","Read+write","Write+exec","Read"],c:0,e:"r-x."}],lab:[{i:"script.sh exécutable",x:["chmod u+x script.sh","chmod +x script.sh"],o:"",h:"chmod u+x"},{i:"755 sur app.sh",x:["chmod 755 app.sh"],o:"",h:"chmod 755"},{i:"Retire écriture autres config.txt",x:["chmod o-w config.txt"],o:"",h:"chmod o-w"},{i:"Proprio data.db → www-data",x:["chown www-data data.db","sudo chown www-data data.db"],o:"",h:"chown"},{i:"600 sur id_rsa",x:["chmod 600 id_rsa"],o:"",h:"600"}]},
{id:15,slug:"users",title:"Utilisateurs et Groupes",level:"intermediate",lv:"INTERMÉDIAIRE",os:"linux",course:'<h2>Utilisateurs et Groupes</h2><ul><li><code>/etc/passwd</code> — users</li><li><code>/etc/shadow</code> — hash mdp</li><li><code>/etc/group</code> — groupes</li></ul><pre><code>sudo useradd -m -s /bin/bash alice\nsudo usermod -aG sudo alice\nid alice</code></pre><div class="warn">⚠️ -a avec -G : ajoute vs remplace !</div>',quiz:[{q:"Hash mdp ?",o:["/etc/passwd","/etc/shadow","/etc/group","/etc/secrets"],c:1,e:"shadow."},{q:"-m useradd ?",o:["Muet","Crée home","Mdp","Mail"],c:1,e:"Home."},{q:"-a avec -G ?",o:["Active","Ajoute vs remplace","Crée","Force"],c:1,e:"Ajoute."},{q:"UID root ?",o:["1","100","0","999"],c:2,e:"0."},{q:"Groupes d'un user ?",o:["usermod","groups","cat passwd","ls home"],c:1,e:"groups."}],lab:[{i:"Crée webmaster",x:["sudo useradd -m -s /bin/bash webmaster","useradd -m -s /bin/bash webmaster"],o:"",h:"useradd -m -s"},{i:"Ajoute à www-data",x:["sudo usermod -aG www-data webmaster","usermod -aG www-data webmaster"],o:"",h:"usermod -aG"},{i:"Infos webmaster",x:["id webmaster"],o:"uid=1001 gid=1001 groups=33(www-data)",h:"id"},{i:"Crée groupe devops",x:["sudo groupadd devops","groupadd devops"],o:"",h:"groupadd"},{i:"Supprime webmaster",x:["sudo userdel -r webmaster","userdel -r webmaster"],o:"",h:"userdel -r"}]},

function getCurrentLevel(xp){let cur=LEVELS[0];for(const l of LEVELS){if(xp>=l.xpRequired)cur=l}return cur}
function getNextLevel(xp){return LEVELS.find(l=>l.xpRequired>xp)||null}
function getXpPercent(xp){const cur=getCurrentLevel(xp);const next=getNextLevel(xp);if(!next)return 100;const range=next.xpRequired-cur.xpRequired;return Math.round(((xp-cur.xpRequired)/range)*100)}

function unlockRewardsForLevel(level){
const r=LEVEL_REWARDS[level];if(!r)return;
if(!st.unlockedTools)st.unlockedTools=[];
if(!st.unlockedCmds)st.unlockedCmds=[];
if(!st.quests)st.quests={};
r.tools.forEach(t=>{if(!st.unlockedTools.includes(t))st.unlockedTools.push(t)});
r.cmds.forEach(c=>{if(!st.unlockedCmds.includes(c))st.unlockedCmds.push(c)});
r.quests.forEach(q=>{if(!st.quests[q])st.quests[q]='active'});
}

function gainXP(amount,reason){
if(!amount||amount<=0)return;
st.xp=(st.xp||0)+amount;
const newLvl=getCurrentLevel(st.xp);
if(newLvl.level>(st.level||1)){
st.level=newLvl.level;
unlockRewardsForLevel(newLvl.level);
sv();
showLevelUpModal(newLvl);
}else{sv()}
updateXPBar();
showToast('+'+amount+' XP — '+reason);
}

function updateXPBar(){
const xp=st.xp||0;const cur=getCurrentLevel(xp);const next=getNextLevel(xp);const pct=getXpPercent(xp);
const el=document.getElementById('xpPanel');if(!el)return;
if(!next){el.innerHTML=`<div class="xp-header"><span class="xp-title" style="color:${cur.color}">${cur.title}</span><span class="xp-level">Nv. ${cur.level}</span></div><div class="xp-bar-track"><div class="xp-bar-fill" style="width:100%"></div></div><div class="xp-sub" style="color:#2E7D32">* Niveau maximum atteint</div>`;return}
el.innerHTML=`<div class="xp-header"><span class="xp-title" style="color:${cur.color}">${cur.title}</span><span class="xp-level">Nv. ${cur.level}</span></div><div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div><div class="xp-sub">${xp} / ${next.xpRequired} XP</div>`;
}

function showLevelUpModal(lvl){
const r=LEVEL_REWARDS[lvl.level];
let rewardsHtml='';
if(r){
if(r.cmds.length)rewardsHtml+=`<div><b>Commandes :</b> ${r.cmds.join(', ')}</div>`;
if(r.tools.length)rewardsHtml+=`<div><b>Outils :</b> ${r.tools.join(', ')}</div>`;
if(r.quests.length)rewardsHtml+=`<div><b>Quetes :</b> ${r.quests.length} nouvelle(s)</div>`;
if(r.message)rewardsHtml+=`<div style="margin-top:6px;font-style:italic">${r.message}</div>`;
}
const el=document.getElementById('dialogRoot');
el.innerHTML=`<div class="levelup-window window"><div class="title-bar"><div class="title-bar-text">Promotion — Nouveau grade</div><div class="title-bar-controls"><button aria-label="Close" onclick="closeDialog()"></button></div></div><div class="levelup-body"><div class="levelup-title" style="color:${lvl.color}">${lvl.title}</div><div class="levelup-sub">Niveau ${lvl.level} atteint — ${st.xp} XP</div>${rewardsHtml?`<div class="levelup-rewards">${rewardsHtml}</div>`:''}<button class="wd-btn primary" onclick="closeDialog()" style="margin-top:8px">OK</button></div></div>`;
}

function isCmdUnlocked(cmd){
if(!cmd)return true;
const base=cmd.trim().split(/\s+/)[0].replace(/^["']/,'');
if(FREE_CMDS.some(fc=>base.toLowerCase()===fc.toLowerCase()))return true;
if(!st.unlockedCmds)return false;
return st.unlockedCmds.some(uc=>base.toLowerCase()===uc.toLowerCase());
}

function getRequiredLevelForCmd(cmd){
const base=cmd.trim().split(/\s+/)[0].replace(/^["']/,'');
for(const[lv,r]of Object.entries(LEVEL_REWARDS)){
if(r.cmds.some(c=>c.toLowerCase()===base.toLowerCase()))return{level:parseInt(lv),info:LEVELS.find(l=>l.level===parseInt(lv))};
}return null;
}

function checkAllQuests(){
if(!st.quests)return;
for(const[id,q]of Object.entries(QUESTS)){
if(st.quests[id]==='active'&&q.check()){
st.quests[id]='completed';
if(!st.badges)st.badges=[];
if(!st.badges.includes(q.badge))st.badges.push(q.badge);
gainXP(q.reward,'Quete: '+q.title);
}}sv();
}

function renderQuests(c){
const active=[];const completed=[];
if(st.quests){for(const[id,status]of Object.entries(st.quests)){const q=QUESTS[id];if(!q)continue;if(status==='active')active.push({id,...q});if(status==='completed')completed.push({id,...q})}}
let h='<div class="quest-panel"><h2 style="font-size:14px;color:#0A246A;margin-bottom:12px">Quetes bonus</h2>';
if((st.level||1)<2){h+='<p style="font-size:11px;color:#666">Atteignez le niveau 2 pour debloquer les quetes.</p>';}
else{
if(!active.length&&!completed.length)h+='<p style="font-size:11px;color:#666">Aucune quete disponible pour le moment.</p>';
active.forEach(q=>{h+=`<div class="quest-item"><div class="quest-title">${q.title}</div><div class="quest-desc">${q.description}</div><div class="quest-reward">${q.rewardDesc}</div></div>`});
if(completed.length){h+='<h3 style="font-size:11px;color:#666;margin:12px 0 6px">Completees</h3>';
completed.forEach(q=>{h+=`<div class="quest-item completed"><div class="quest-title">${q.title}</div><div class="quest-desc">${q.description}</div></div>`})}
if(st.badges&&st.badges.length){h+='<h3 style="font-size:11px;color:#666;margin:12px 0 6px">Badges</h3>';
st.badges.forEach(b=>{h+=`<span class="badge-chip">${b}</span>`})}}
h+='</div>';c.innerHTML=h;
}

function renderADTree(){const t=document.getElementById('winTree');if(!t)return;t.innerHTML=buildTree(AD_TREE,0)}
function buildTree(n,d){const hasK=n.children&&n.children.length>0;
let h=`<div class="wt-item${guiState.selNode===n.name?' sel':''}" style="padding-left:${8+d*16}px" onclick="selNode('${n.name}')" oncontextmenu="treeCtx(event,'${n.name}','${n.type||''}')"><span style="width:12px;font-size:8px;color:#999;display:inline-block;text-align:center">${hasK?'▶':''}</span><span style="margin:0 4px">${n.ico}</span><span>${n.name}</span></div>`;
if(hasK){n.children.forEach(c=>{h+=buildTree(c,d+1)})}return h}

function ouPath(name){const map={Utilisateurs:"Paris/Utilisateurs",Postes:"Paris/Postes",Serveurs:"Paris/Serveurs",Paris:"Paris",Lyon:"Lyon",Groupes:"Groupes","Service Accounts":"Service Accounts",Builtin:"Builtin",Computers:"Computers","Domain Controllers":"Domain Controllers"};
// check for Lyon children by looking at tree context
if(name==='Utilisateurs'&&guiState.selNode==='Utilisateurs'){
  // check if it's actually under Lyon
  const lyonUsers=AD_TREE.children.find(c=>c.name==='Lyon')?.children.find(c=>c.name==='Utilisateurs');

comps.forEach(c=>{h+=`<div class="wl-row"><div class="wl-cell"><span style="color:var(--win-success)">🖥️</span></div><div class="wl-cell" style="flex:2">${c.name}</div><div class="wl-cell" style="flex:2;font-size:10px">${c.os}</div><div class="wl-cell" style="font-size:10px">${c.lastLogon}</div></div>`});

// Context menus
function treeCtx(e,name,type){e.preventDefault();e.stopPropagation();const items=[];
if(type==='ou'){items.push({label:'👤 Nouvel utilisateur...',fn:()=>guiNewUser(ouPath(name))});items.push({label:'👥 Nouveau groupe...',fn:()=>guiNewGroup(ouPath(name))});items.push({sep:1})}
items.push({label:'🔄 Actualiser',fn:()=>guiRefresh()});showCtx(e.clientX,e.clientY,items)}

function objCtx(e,type,id){e.preventDefault();e.stopPropagation();const items=[];
if(type==='user'){items.push({label:'📋 Propriétés...',fn:()=>showUserProps(id)});
const u=adUsers.find(x=>x.sam===id);
if(u?.enabled)items.push({label:'🚫 Désactiver',fn:()=>{u.enabled=false;checkTasks();guiRefresh()}});
else if(u)items.push({label:'✅ Activer',fn:()=>{u.enabled=true;guiRefresh()}});
items.push({label:'👥 Ajouter à un groupe...',fn:()=>showAddToGroup(id)});items.push({sep:1});
items.push({label:'❌ Supprimer',fn:()=>{if(confirm('Supprimer '+id+' ?')){adUsers=adUsers.filter(x=>x.sam!==id);adGroups.forEach(g=>g.members=g.members.filter(m=>m!==id));checkTasks();guiRefresh()}}})}
if(type==='group'){items.push({label:'📋 Propriétés...',fn:()=>showGroupProps(id)});items.push({label:'👤 Ajouter membre...',fn:()=>showAddMember(id)})}
showCtx(e.clientX,e.clientY,items)}

function showCtx(x,y,items){const m=document.getElementById('ctxMenu');
m.innerHTML=items.map((it,i)=>it.sep?'<div class="ctx-sep"></div>':`<div class="ctx-item" data-i="${i}">${it.label}</div>`).join('');
m.querySelectorAll('.ctx-item').forEach(el=>{const i=parseInt(el.dataset.i);const fn=items[i]?.fn;el.onclick=()=>{m.style.display='none';if(fn)fn()}});
m.style.display='block';m.style.left=Math.min(x,innerWidth-200)+'px';m.style.top=Math.min(y,innerHeight-200)+'px'}
function hideCtx(){document.getElementById('ctxMenu').style.display='none'}

function checkTasks(){const m=M[st.cm];if(!m.gui)return;const tasks=m.objectives||guiTasks[m.gui.type]||[];
const prevCount=guiState.tasksDone.length;
tasks.forEach(tk=>{if(!guiState.tasksDone.includes(tk.id)&&tk.check()){guiState.tasksDone.push(tk.id);gainXP(40,'Objectif mission')}});
if(guiState.tasksDone.length>prevCount)svGui();

{id:9,slug:"fgpp",title:"Fine-Grained Password Policy",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"RSSI - Marc Petit",message:"Les comptes de service et les administrateurs doivent avoir des politiques de mots de passe plus strictes que les utilisateurs standard. La Default Domain Policy ne suffit pas. Implémentez des PSO (Password Settings Objects).",priority:"NORMALE"},course:'<h2>FGPP — Des règles de mot de passe sur mesure</h2><p>On a vu que la <strong>Default Domain Policy</strong> définit les règles de mot de passe pour tout le monde. Mais imaginez : vous avez des admins système qui gèrent des serveurs critiques, et des stagiaires qui utilisent juste Outlook. Est-ce logique d\'imposer les <strong>mêmes règles</strong> aux deux ?</p><p>C\'est comme un bâtiment : le code d\'accès de la porte d\'entrée a 4 chiffres, mais la salle des coffres a un code à 8 chiffres + empreinte digitale. <strong>Différents niveaux de risque = différentes exigences.</strong></p><h3>🎯 Le problème avant les FGPP</h3><p>Avant Windows Server 2008, il n\'y avait qu\'<strong>une seule politique de mot de passe pour tout le domaine</strong>. Si les admins voulaient des mots de passe de 16 caractères, tout le monde devait avoir des mots de passe de 16 caractères. Résultat : des post-its avec le mot de passe collés sur l\'écran.</p><p>Les FGPP (Fine-Grained Password Policies) résolvent ça : on peut définir des <strong>règles différentes par groupe</strong>.</p><h3>📊 Exemple de stratégie à 3 niveaux</h3><ul><li><strong>Admins (GRP_Admins)</strong> — 16 caractères minimum, complexité obligatoire, rotation tous les 30 jours, verrouillage après 3 tentatives</li><li><strong>Comptes de service</strong> — 24 caractères (générés automatiquement), pas d\'expiration (un service ne peut pas changer son mot de passe seul)</li><li><strong>Utilisateurs standard</strong> — 8-12 caractères, rotation tous les 90 jours, verrouillage après 5 tentatives</li></ul><h3>⌨️ Créer un PSO (Password Settings Object)</h3><p>Un PSO, c\'est l\'objet AD qui contient les règles de mot de passe personnalisées :</p><pre><code># Créer une politique stricte pour les admins\nNew-ADFineGrainedPasswordPolicy -Name "PSO_Admins" `\n  -Precedence 10 `\n  -MinPasswordLength 16 `\n  -ComplexityEnabled $true `\n  -PasswordHistoryCount 24 `\n  -MaxPasswordAge 30.00:00:00 `\n  -LockoutThreshold 3</code></pre><p>Détaillons les paramètres :</p><ul><li><strong>-Precedence 10</strong> — La priorité. Plus le nombre est bas, plus la politique est prioritaire (on y revient après).</li><li><strong>-MinPasswordLength 16</strong> — Au minimum 16 caractères.</li><li><strong>-ComplexityEnabled $true</strong> — Exige majuscule + minuscule + chiffre + caractère spécial.</li><li><strong>-PasswordHistoryCount 24</strong> — Mémorise les 24 derniers mots de passe. Empêche de réutiliser un ancien.</li><li><strong>-MaxPasswordAge 30.00:00:00</strong> — Le mot de passe expire après 30 jours.</li><li><strong>-LockoutThreshold 3</strong> — Verrouillage après 3 mauvais mots de passe (au lieu de 5).</li></ul><h3>🔗 Associer le PSO à un groupe</h3><p>Le PSO ne fait rien tant qu\'il n\'est pas lié à un groupe :</p><pre><code># Appliquer PSO_Admins au groupe GRP_Admins\nAdd-ADFineGrainedPasswordPolicySubject `\n  -Identity "PSO_Admins" -Subjects "GRP_Admins"</code></pre><h3>⚖️ La Precedence — Qui gagne en cas de conflit ?</h3><p>Si un utilisateur est dans deux groupes avec des PSO différents, lequel s\'applique ? Celui avec le <strong>numéro de precedence le plus bas</strong>.</p><p>Ex: jdupont est dans GRP_Admins (PSO Precedence 10) et GRP_IT (PSO Precedence 20) → PSO_Admins (10) s\'applique car 10 < 20.</p><h3>🔍 Vérifier les PSO en place</h3><pre><code># Lister tous les PSO du domaine\nGet-ADFineGrainedPasswordPolicy -Filter *\n\n# Voir à qui s\'applique un PSO\nGet-ADFineGrainedPasswordPolicySubject "PSO_Admins"\n\n# Voir quelle politique s\'applique réellement à un utilisateur\nGet-ADUserResultantPasswordPolicy -Identity jdupont</code></pre><p>La dernière commande est la plus utile : elle vous dit exactement quelle politique s\'applique à un utilisateur donné, en tenant compte de toutes les precedences.</p><div class="warn">⚠️ <strong>Limitation importante :</strong> Les PSO ne s\'appliquent qu\'aux <strong>groupes Global</strong> ou directement aux utilisateurs. Pas aux OUs ! Si vous voulez cibler tous les utilisateurs d\'une OU, créez un groupe, mettez-y les utilisateurs, puis liez le PSO au groupe.</div><div class="tip">💡 <strong>Prérequis :</strong> Le niveau fonctionnel du domaine doit être au minimum Windows Server 2008. Si votre domaine est en 2003... il est temps de mettre à jour.</div>',objectives:[{id:"obj9a",text:"Créer le groupe GRP_Admins",check:()=>adGroups.some(g=>g.name==='GRP_Admins')},{id:"obj9b",text:"Ajouter jdupont à GRP_Admins",check:()=>adGroups.find(g=>g.name==='GRP_Admins')?.members.includes('jdupont')}],quiz:[{q:"Que signifie PSO ?",o:["Password Security Object","Password Settings Object","Policy Settings Override","Protected Security Option"],c:1,e:"PSO = Password Settings Object, objet AD contenant une stratégie de mot de passe."},{q:"Comment fonctionne la precedence des PSO ?",o:["Plus haute = prioritaire","Plus basse = prioritaire","Alphabétique","Ordre de création"],c:1,e:"Le PSO avec la precedence la plus basse (nombre le plus petit) est appliqué en priorité."},{q:"Les PSO peuvent être appliqués à quels objets ?",o:["OUs uniquement","Groupes Global et utilisateurs","Tous les types d\'objets","Sites AD"],c:1,e:"Les PSO s\'appliquent aux groupes Global ou directement aux utilisateurs, jamais aux OUs."},{q:"Quel niveau fonctionnel minimum pour les FGPP ?",o:["Windows 2003","Windows 2008","Windows 2012","Windows 2016"],c:1,e:"Le niveau fonctionnel Windows Server 2008 minimum est requis pour les FGPP."},{q:"Quelle cmdlet montre la politique effective d\'un utilisateur ?",o:["Get-ADPasswordPolicy","Get-ADUserResultantPasswordPolicy","Get-EffectivePolicy","Show-ADUserPassword"],c:1,e:"Get-ADUserResultantPasswordPolicy montre le PSO effectivement appliqué à un utilisateur."}],lab:[{i:"Créez le groupe GRP_Admins",x:['New-ADGroup -Name "GRP_Admins" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_Admins créé.",h:'New-ADGroup -Name "GRP_Admins" -GroupScope Global -GroupCategory Security'},{i:"Créez le PSO PSO_Admins (16 chars, precedence 10)",x:['New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" -Precedence 10 -MinPasswordLength 16 -ComplexityEnabled $true -PasswordHistoryCount 24'],o:"PSO PSO_Admins créé. MinLength: 16, Precedence: 10",h:'New-ADFineGrainedPasswordPolicy -Name "PSO_Admins" -Precedence 10 -MinPasswordLength 16 ...'},{i:"Associez PSO_Admins au groupe GRP_Admins",x:['Add-ADFineGrainedPasswordPolicySubject -Identity "PSO_Admins" -Subjects "GRP_Admins"'],o:"PSO_Admins appliqué au groupe GRP_Admins.",h:'Add-ADFineGrainedPasswordPolicySubject -Identity "PSO_Admins" -Subjects "GRP_Admins"'},{i:"Listez tous les PSO du domaine",x:["Get-ADFineGrainedPasswordPolicy -Filter *"],o:"Name: PSO_Admins\nPrecedence: 10\nMinPasswordLength: 16\nComplexityEnabled: True\nPasswordHistoryCount: 24",h:"Get-ADFineGrainedPasswordPolicy -Filter *"},{i:"Ajoutez jdupont au groupe GRP_Admins",x:["Add-ADGroupMember -Identity GRP_Admins -Members jdupont"],o:"jdupont ajouté à GRP_Admins.",h:"Add-ADGroupMember -Identity GRP_Admins -Members jdupont"}]},
{id:10,slug:"audit-journalisation",title:"Audit et journalisation",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"event-viewer"},incident:{type:"AUDIT",from:"Commissaires aux comptes",message:"Audit ISO 27001 dans 2 semaines. Vous devez prouver que toutes les modifications AD sont tracées et que les logs sont consultables. Préparez les Event IDs clés et démontrez l'exploitation des journaux.",priority:"HAUTE"},course:'<h2>Audit AD — Les caméras de surveillance de votre SI</h2><p>Imaginez un bâtiment sans caméras de surveillance. Quelqu\'un entre, vole des documents, et repart. Personne ne sait quand, comment, ni qui c\'était. L\'<strong>audit Active Directory</strong>, c\'est votre système de caméras numériques : il enregistre tout ce qui se passe dans votre annuaire.</p><p>C\'est indispensable pour :</p><ul><li><strong>La conformité</strong> — ISO 27001, SOC2, RGPD exigent tous une traçabilité des accès</li><li><strong>La détection d\'incidents</strong> — Repérer une activité suspecte avant qu\'il ne soit trop tard</li><li><strong>Le forensics</strong> — Après un incident, reconstituer ce qui s\'est passé</li></ul><h3>📋 Les Event IDs à connaître par cœur</h3><p>Windows attribue un numéro (Event ID) à chaque type d\'événement. Voici les plus importants — gardez cette liste sous la main :</p><ul><li><strong>4624</strong> — Connexion réussie. Normal, mais utile pour vérifier qui s\'est connecté et d\'où.</li><li><strong>4625</strong> — Échec de connexion. <strong>Le plus surveillé.</strong> 50 échecs en 5 minutes = probable attaque brute-force.</li><li><strong>4720</strong> — Compte créé. Quelqu\'un a créé un nouvel utilisateur. Était-ce prévu ?</li><li><strong>4722</strong> — Compte activé.</li><li><strong>4723</strong> — Tentative de changement de mot de passe (par l\'utilisateur lui-même).</li><li><strong>4724</strong> — Réinitialisation de mot de passe (par un admin). Si personne de l\'IT n\'a fait ça, c\'est un drapeau rouge.</li><li><strong>4725</strong> — Compte désactivé.</li><li><strong>4726</strong> — Compte supprimé. <strong>Alerte !</strong> Qui supprime des comptes ?</li><li><strong>4728</strong> — Membre ajouté à un groupe de sécurité. Surtout surveiller les ajouts à Domain Admins.</li><li><strong>4740</strong> — Compte verrouillé (trop de tentatives échouées).</li></ul><h3>⌨️ Interroger les journaux avec Get-WinEvent</h3><p><code>Get-WinEvent</code> est votre outil principal pour lire les journaux Windows :</p><pre><code># Les 10 dernières créations de compte\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4720} -MaxEvents 10\n\n# Les échecs de connexion récents\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4625} -MaxEvents 5\n\n# Les erreurs système (pas sécurité, mais utile)\nGet-WinEvent -LogName System -MaxEvents 20 | \n  Where-Object {$_.LevelDisplayName -eq \'Error\'}</code></pre><p>Le <code>-FilterHashtable</code> permet de filtrer par journal (LogName) et par ID d\'événement. C\'est beaucoup plus rapide que de tout charger puis filtrer.</p><h3>🔧 Activer l\'audit avancé</h3><p>Par défaut, Windows n\'enregistre pas tout. Il faut activer l\'audit :</p><pre><code># Voir la configuration actuelle\nAuditPol /get /category:*\n\n# Activer l\'audit des modifications AD (créations, suppressions...)\nAuditPol /set /subcategory:"Directory Service Changes" /success:enable /failure:enable</code></pre><p>L\'<strong>Advanced Audit Policy</strong> (politique d\'audit avancée) offre un contrôle beaucoup plus fin que la politique basique. Vous pouvez choisir exactement ce que vous voulez auditer.</p><h3>📊 Exporter pour les auditeurs</h3><p>Quand un auditeur ISO 27001 débarque et demande \"Montrez-moi les logs des 6 derniers mois\", vous devez pouvoir les fournir :</p><pre><code># Exporter tous les événements de sécurité en CSV\nGet-WinEvent -FilterHashtable @{LogName=\'Security\'} | \n  Export-Csv C:\\audit.csv -NoTypeInformation</code></pre><div class="warn">⚠️ <strong>Les journaux ont une taille limitée !</strong> Par défaut, quand le journal est plein, les anciens événements sont écrasés. En production, configurez le transfert vers un <strong>SIEM</strong> (Splunk, ELK Stack, Wazuh) qui centralise et archive tous les logs. Sans ça, vous perdez l\'historique.</div><div class="tip">💡 <strong>Astuce de détection :</strong> Un nombre anormal d\'événements 4625 (échecs) suivis d\'un 4624 (succès) depuis la même IP = probable attaque brute-force qui a réussi. Configurez des alertes automatiques sur ce pattern.</div>',objectives:[{id:"ev1",text:"Filtrer pour afficher uniquement les erreurs (System)",check:()=>evFilter.level==='Error'&&evActiveTab==='System'},{id:"ev2",text:"Consulter le journal Security",check:()=>evActiveTab==='Security'},{id:"ev3",text:"Rechercher \'login\' dans les événements",check:()=>evFilter.search.toLowerCase().includes('login')}],quiz:[{q:"Quel Event ID correspond à la création d\'un compte ?",o:["4624","4625","4720","4740"],c:2,e:"4720 = User Account Created. 4624 = logon success, 4625 = logon failure."},{q:"Quel Event ID signale un échec de connexion ?",o:["4624","4625","4720","4726"],c:1,e:"4625 = An account failed to log on."},{q:"Quelle cmdlet PowerShell remplace Get-EventLog pour les journaux modernes ?",o:["Read-EventLog","Get-WinEvent","Search-EventLog","Find-Event"],c:1,e:"Get-WinEvent est la cmdlet moderne qui supporte les journaux ETW et le filtrage XPath."},{q:"Que fait AuditPol /get /category:* ?",o:["Crée une politique d\'audit","Affiche toutes les catégories d\'audit actives","Supprime les logs","Active tout l\'audit"],c:1,e:"AuditPol /get affiche l\'état actuel de toutes les catégories et sous-catégories d\'audit."},{q:"Pourquoi transférer les logs vers un SIEM ?",o:["Pour la performance","Pour la rétention longue durée et la corrélation","Par obligation légale uniquement","Pour les supprimer du serveur"],c:1,e:"Un SIEM assure la rétention, la corrélation d\'événements et l\'alerting en temps réel."}],lab:[{i:"Affichez les 10 dernières créations de compte (Event ID 4720)",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4720} -MaxEvents 10"],o:"TimeCreated: 27/03/2026 14:30\nId: 4720\nMessage: A user account was created. sophie.lambert",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4720} -MaxEvents 10"},{i:"Listez les catégories d\'audit actives",x:["AuditPol /get /category:*"],o:"Account Logon: Success and Failure\nAccount Management: Success\nDirectory Service Access: No Auditing\nLogon/Logoff: Success and Failure",h:"AuditPol /get /category:*"},{i:"Recherchez les 5 derniers échecs de connexion",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 5"],o:"TimeCreated: 27/03/2026 03:42\nId: 4625\nMessage: An account failed to log on. admin.service\nIP: 10.0.0.55",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 5"},{i:"Affichez les erreurs système",x:["Get-WinEvent -LogName System -MaxEvents 20 | Where-Object {$_.LevelDisplayName -eq 'Error'}","Get-WinEvent -LogName System -MaxEvents 20 | Where {$_.LevelDisplayName -eq 'Error'}"],o:"DCOM Error 10016\nNTFS Error 137\nKernel-Power Error 41",h:"Get-WinEvent -LogName System ... | Where LevelDisplayName -eq 'Error'"},{i:"Exportez le journal Security en CSV",x:["Get-WinEvent -FilterHashtable @{LogName='Security'} | Export-Csv C:\\audit.csv"],o:"Export terminé: C:\\audit.csv (847 événements)",h:"... | Export-Csv C:\\audit.csv"}]},
{id:11,slug:"incident-securite",title:"Incident de sécurité — compte compromis",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"ALERTE",from:"SOC - CRITIQUE",message:"COMPROMISSION DÉTECTÉE : le compte admin.service a généré 847 tentatives d'authentification en 3 minutes depuis l'IP 10.0.0.55 (inconnue). Suspicion de mouvement latéral. Containment immédiat requis.",priority:"CRITIQUE"},course:'<h2>Incident de sécurité — Un compte a été compromis</h2><p>C\'est le cauchemar de tout admin sys. Vous recevez une alerte : un compte de service fait des choses bizarres à 3h du matin. Des connexions depuis une IP inconnue. Des tentatives d\'accès à des serveurs qu\'il n\'a jamais touchés. <strong>Le compte est compromis.</strong></p><p>C\'est le moment de garder son calme et de suivre une procédure précise. Comme un pompier qui arrive sur un incendie : on ne fonce pas tête baissée, on suit le protocole.</p><h3>🚒 Phase 1 : Confinement (Containment)</h3><p>Objectif : <strong>stopper la progression de l\'attaquant IMMÉDIATEMENT</strong>. Chaque minute compte.</p><pre><code># 1. Désactiver le compte compromis\nDisable-ADAccount admin.service\n\n# 2. Réinitialiser son mot de passe (même si le compte est désactivé !)\nSet-ADAccountPassword admin.service -Reset `\n  -NewPassword (ConvertTo-SecureString "EmergencyP@ss!" -AsPlainText -Force)</code></pre><p>Pourquoi réinitialiser le mot de passe en plus de désactiver ? Parce que si l\'attaquant a le mot de passe et qu\'on réactive le compte plus tard (par erreur ou oubli), il pourrait revenir.</p><h3>🔍 Phase 2 : Investigation</h3><p>Maintenant qu\'on a limité les dégâts, on cherche à comprendre <strong>ce qui s\'est passé</strong> :</p><pre><code># Quand le compte s\'est connecté pour la dernière fois ? D\'où ?\nGet-ADUser admin.service -Properties *\n\n# Qui a essayé de se connecter avec ce compte et a échoué ?\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4625} -MaxEvents 20\n\n# Qui s\'est connecté avec succès récemment ?\nGet-WinEvent -FilterHashtable @{LogName=\'Security\';ID=4624} -MaxEvents 20</code></pre><p>On cherche des <strong>indicateurs de compromission (IOC)</strong> — des signes que quelque chose ne va pas :</p><ul><li><strong>Connexions depuis des IPs inhabituelles</strong> — Le compte de service se connecte habituellement depuis 10.0.1.5. Là il se connecte depuis 185.234.xx.xx (IP étrangère).</li><li><strong>Activité hors heures de bureau</strong> — Des actions à 3h du matin un dimanche.</li><li><strong>Pics de tentatives</strong> — 500 tentatives de connexion en 10 minutes = brute-force.</li><li><strong>Accès inhabituels</strong> — Le compte accède à des partages ou des serveurs qu\'il ne touche jamais normalement.</li></ul><h3>🧹 Phase 3 : Éradication</h3><p>On s\'assure que l\'attaquant n\'a pas laissé de portes dérobées :</p><pre><code># Purger les tickets Kerberos en mémoire\nklist purge</code></pre><p>Ensuite, vérifier si l\'attaque est plus profonde :</p><pre><code># Lister les comptes avec SPN (cibles de Kerberoasting)\n# Le Kerberoasting est une technique d\'attaque qui extrait les\n# hashes des mots de passe de comptes de service\nGet-ADUser -Filter {ServicePrincipalName -like "*"} `\n  -Properties ServicePrincipalName</code></pre><h3>☠️ Le Golden Ticket — L\'attaque ultime</h3><p>C\'est l\'attaque la plus redoutée dans AD. Pour la comprendre, une analogie :</p><p>Imaginez que dans votre bâtiment, il y a une <strong>machine à badges</strong> qui fabrique tous les badges d\'accès. Cette machine utilise un tampon secret pour valider les badges. Si quelqu\'un vole ce tampon, il peut <strong>fabriquer des faux badges illimités</strong> qui ouvrent toutes les portes, pour toujours.</p><p>Dans AD, ce \"tampon secret\" c\'est le compte <code>krbtgt</code>. Il signe tous les tickets Kerberos (TGT). Si un attaquant récupère son hash, il peut forger des tickets d\'accès pour <strong>n\'importe quel utilisateur, n\'importe quelle ressource, sans limite de temps</strong>.</p><p>Le seul remède : changer le tampon. C\'est le <strong>double reset de krbtgt</strong> :</p><ul><li>Premier reset → invalide la clé actuelle</li><li>Attendre 12h minimum (le temps que l\'ancienne clé expire partout)</li><li>Deuxième reset → invalide l\'ancienne clé aussi</li></ul><div class="warn">⚠️ <strong>Le reset de krbtgt invalide TOUS les tickets Kerberos du domaine.</strong> Chaque utilisateur, chaque service devra se ré-authentifier. Faites-le en heures creuses et prévenez toutes les équipes. Des applications peuvent planter temporairement.</div><div class="tip">💡 <strong>Règle absolue :</strong> Documentez TOUT. Chaque action, chaque heure, chaque découverte, dans un rapport d\'incident horodaté. C\'est indispensable pour les assurances cyber, la conformité, et pour tirer des leçons après l\'incident.</div>',objectives:[{id:"obj11a",text:"Désactiver admin.service",check:()=>{const u=adUsers.find(x=>x.sam==='admin.service');return !u||!u.enabled}},{id:"obj11b",text:"Vérifier les dernières connexions (consulter propriétés)",check:()=>guiState.tasksDone.includes('obj11b')}],quiz:[{q:"Quelle est la première action lors d\'une compromission de compte ?",o:["Analyser les logs","Désactiver le compte immédiatement","Appeler la police","Réinstaller le serveur"],c:1,e:"Le containment (désactivation) est la priorité absolue pour stopper l\'attaquant."},{q:"Que permet un Golden Ticket Kerberos ?",o:["Accéder à un seul service","Forger des tickets d\'accès illimités","Réinitialiser tous les mots de passe","Supprimer l\'AD"],c:1,e:"Un Golden Ticket forge des TGT valides pour n\'importe quel service, avec n\'importe quel privilège."},{q:"Comment remédier à un Golden Ticket ?",o:["Supprimer le compte compromis","Double reset du mot de passe krbtgt","Redémarrer tous les DCs","Recréer le domaine"],c:1,e:"Le double reset de krbtgt (espacé de 12h) invalide tous les tickets Kerberos existants."},{q:"Quel Event ID indique un échec de connexion ?",o:["4624","4625","4720","4771"],c:1,e:"4625 = An account failed to log on. 4771 = Kerberos pre-authentication failed."},{q:"Qu\'est-ce que le Kerberoasting ?",o:["Un type de phishing","L\'extraction de hash SPN pour cracker les mots de passe offline","Une attaque DDoS","Un outil de monitoring"],c:1,e:"Le Kerberoasting demande des tickets de service (TGS) pour des comptes avec SPN, puis les cracke offline."}],lab:[{i:"Désactivez immédiatement le compte admin.service",x:["Disable-ADAccount admin.service","Disable-ADAccount -Identity admin.service"],o:"[URGENT] Compte admin.service désactivé. Containment effectué.",h:"Disable-ADAccount admin.service"},{i:"Consultez les propriétés complètes de admin.service",x:["Get-ADUser admin.service -Properties *","Get-ADUser -Identity admin.service -Properties LastLogon,LastLogonDate,LockedOut,BadPwdCount"],o:"Name: Admin Service\nEnabled: False\nLastLogonDate: 27/03/2026 03:42\nBadPwdCount: 847\nLockedOut: True\nMemberOf: Domain Admins",h:"Get-ADUser admin.service -Properties *"},{i:"Recherchez les échecs de connexion récents (4625)",x:["Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 20"],o:"27/03 03:42 - admin.service - IP:10.0.0.55 - Status:0xC000006D\n27/03 03:42 - admin.service - IP:10.0.0.55 - Status:0xC000006D\n(847 événements similaires...)",h:"Get-WinEvent -FilterHashtable @{LogName='Security';ID=4625} -MaxEvents 20"},{i:"Purgez les tickets Kerberos en cache",x:["klist purge"],o:"Current LogonId: 0:0x3e7\nTickets purged: 4 tickets supprimés.",h:"klist purge"},{i:"Recherchez les comptes avec SPN (cibles Kerberoasting)",x:["Get-ADUser -Filter {ServicePrincipalName -like \"*\"} -Properties ServicePrincipalName"],o:"Name: Admin Service\nSPN: MSSQLSvc/SRV-DB01.econocom.local:1433\n\nName: SVC-Backup\nSPN: backup/SRV-DC01.econocom.local",h:'Get-ADUser -Filter {ServicePrincipalName -like "*"} -Properties ServicePrincipalName'}]},

{id:12,slug:"intro-terminal",title:"Le Terminal : Premiers Pas",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Le Terminal — Votre premier contact avec Linux</h2><p>Oubliez les fenêtres, les icônes et la souris. Le <strong>terminal</strong>, c\'est une conversation écrite avec votre ordinateur. Vous tapez une commande, il répond. C\'est comme envoyer un SMS à votre machine.</p><p>Pourquoi utiliser un terminal quand on a des interfaces graphiques ? Parce que :</p><ul><li><strong>C\'est plus rapide</strong> — Renommer 500 fichiers en une commande vs un par un avec la souris</li><li><strong>C\'est automatisable</strong> — On peut écrire des scripts qui font le travail tout seuls</li><li><strong>Les serveurs n\'ont pas d\'interface graphique</strong> — 99% des serveurs Linux n\'ont qu\'un terminal</li></ul><h3>🖥️ Le prompt — Votre boussole</h3><p>Quand vous ouvrez un terminal, vous voyez quelque chose comme :</p><pre><code>user@machine:~$</code></pre><p>Chaque partie a un sens :</p><ul><li><strong>user</strong> — Votre nom d\'utilisateur (qui vous êtes)</li><li><strong>@machine</strong> — Le nom de l\'ordinateur (où vous êtes)</li><li><strong>~</strong> — Le dossier actuel (<code>~</code> = votre dossier personnel, /home/user)</li><li><strong>$</strong> — Vous êtes un utilisateur normal. Si vous voyez <code>#</code>, vous êtes <strong>root</strong> (l\'administrateur tout-puissant).</li></ul><h3>⌨️ Vos premières commandes</h3><p>Chaque commande suit le même format : <code>commande -options arguments</code>. C\'est comme une phrase : verbe + adverbe + complément.</p><pre><code># Où suis-je ? (quel dossier)\npwd\n\n# Qui suis-je ? (quel utilisateur)\nwhoami\n\n# Quelle heure est-il ?\ndate\n\n# Afficher un texte\necho "Bonjour le monde"\n\n# Effacer l\'écran (quand c\'est le bazar)\nclear\n\n# Voir l\'historique de mes commandes\nhistory</code></pre><p>Essayez-les une par une. Aucune de ces commandes ne peut casser quoi que ce soit — vous pouvez expérimenter sans risque.</p><h3>🚀 Les raccourcis qui changent la vie</h3><ul><li><strong>↑ (flèche haut)</strong> — Rappelle la dernière commande. Appuyez plusieurs fois pour remonter dans l\'historique.</li><li><strong>Tab</strong> — Auto-complétion. Tapez les 3 premières lettres d\'un nom de fichier et appuyez Tab : le terminal complète tout seul. C\'est <strong>le raccourci le plus utile</strong> — utilisez-le constamment.</li><li><strong>Ctrl+C</strong> — Annule la commande en cours. Si quelque chose tourne en boucle, c\'est votre bouton d\'urgence.</li><li><strong>Ctrl+L</strong> — Même chose que <code>clear</code>, efface l\'écran.</li></ul><h3>📐 La structure d\'une commande</h3><pre><code>commande -option argument\nls      -la     /home</code></pre><p>Ici : <code>ls</code> (\"liste les fichiers\") avec les options <code>-l</code> (format détaillé) et <code>-a</code> (montrer les fichiers cachés) dans le dossier <code>/home</code>.</p><div class="tip">💡 <strong>Pas de panique :</strong> vous ne pouvez pas \"casser\" Linux en tapant des commandes de base. Les commandes dangereuses nécessitent <code>sudo</code> (les droits admin), et on vous demandera votre mot de passe. Si vous n\'êtes pas sûr d\'une commande, ajoutez <code>--help</code> à la fin pour voir ce qu\'elle fait.</div>',quiz:[{q:"$ dans le prompt ?",o:["Root","User normal","Erreur","Déconnecté"],c:1,e:"$ = standard, # = root."},{q:"Répertoire courant ?",o:["cd","ls","pwd","whoami"],c:2,e:"pwd."},{q:"whoami ?",o:["Change user","Affiche nom user","Liste users","Déconnecte"],c:1,e:"Nom de l'utilisateur."},{q:"Dernière commande ?",o:["Ctrl+Z","↑","Tab","Ctrl+R"],c:1,e:"↑ parcourt l'historique."},{q:"'/home' dans 'ls -la /home' ?",o:["Option","Flag","Argument","Pipe"],c:2,e:"Argument."}],lab:[{i:"Affiche ton nom d'utilisateur",x:["whoami"],o:"admin",h:"who..."},{i:"Répertoire courant",x:["pwd"],o:"/home/admin",h:"pwd"},{i:"Affiche la date",x:["date"],o:"Fri Mar 27 14:23:01 CET 2026",h:"4 lettres"},{i:"Affiche 'Hello World'",x:['echo "Hello World"','echo Hello World',"echo 'Hello World'"],o:"Hello World",h:"echo texte"},{i:"Efface l'écran",x:["clear"],o:"[effacé]",h:"cl..."}]},
{id:13,slug:"filesystem",title:"Système de Fichiers",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Le système de fichiers — La carte de votre machine</h2><p>Sous Windows, vous avez C:\\, D:\\, etc. Sous Linux, tout part d\'un seul point : <code>/</code> (appelé \"la racine\" ou \"root\"). C\'est comme un arbre à l\'envers : le tronc est en haut (<code>/</code>), et les branches descendent.</p><h3>🗂️ Les dossiers importants</h3><p>Chaque dossier a un rôle précis. C\'est comme un bâtiment bien organisé :</p><ul><li><code>/home</code> — Les appartements privés. Chaque utilisateur a son dossier ici (/home/alice, /home/bob). Vos fichiers personnels sont là.</li><li><code>/etc</code> — Le bureau de l\'administration. Tous les fichiers de configuration du système sont ici. C\'est le dossier le plus important pour un admin sys.</li><li><code>/var</code> — Le local des archives. Les logs (journaux), les bases de données, les mails... tout ce qui \"varie\" dans le temps.</li><li><code>/tmp</code> — La poubelle temporaire. Les fichiers ici sont supprimés au redémarrage. Utile pour des fichiers éphémères.</li><li><code>/usr</code> — La bibliothèque. Les programmes installés et leurs fichiers sont ici.</li><li><code>/root</code> — L\'appartement du directeur (root). C\'est le /home de l\'admin root.</li><li><code>/dev</code> — Les branchements matériels. Chaque disque, clé USB, etc. apparaît ici comme un fichier.</li></ul><h3>🧭 Navigation — Se déplacer dans l\'arbre</h3><pre><code># Lister les fichiers du dossier actuel (version détaillée)\nls -la\n\n# Aller dans un dossier\ncd /etc\n\n# Remonter d\'un niveau (dossier parent)\ncd ..\n\n# Retourner dans son dossier personnel\ncd ~\n\n# Voir où on est\npwd</code></pre><p>Les raccourcis de chemins :</p><ul><li><code>.</code> — Le dossier actuel</li><li><code>..</code> — Le dossier parent (un niveau au-dessus)</li><li><code>~</code> — Votre dossier personnel (/home/votreuser)</li><li><code>/</code> — La racine absolue du système</li></ul><h3>📁 Créer, copier, déplacer, supprimer</h3><pre><code># Créer un dossier\nmkdir mon_dossier\n\n# Créer un fichier vide\ntouch mon_fichier.txt\n\n# Copier un fichier\ncp source.txt destination.txt\n\n# Déplacer (ou renommer) un fichier\nmv ancien_nom.txt nouveau_nom.txt\n\n# Supprimer un fichier\nrm fichier.txt\n\n# Supprimer un dossier et tout son contenu\nrm -r mon_dossier</code></pre><div class="warn">⚠️ <strong>rm ne met PAS à la corbeille.</strong> Le fichier est supprimé définitivement. Et <code>rm -rf /</code> supprime TOUT le système sans demander confirmation. Ne tapez jamais cette commande, même \"pour voir\".</div><div class="tip">💡 <strong>Chemin absolu vs relatif :</strong> <code>/etc/nginx/nginx.conf</code> est absolu (part de la racine). <code>./nginx.conf</code> est relatif (part du dossier actuel). En cas de doute, utilisez le chemin absolu.</div>',quiz:[{q:"Racine ?",o:["/home","C:\\","/","/root"],c:2,e:"/"},{q:"Config ?",o:["/home","/etc","/bin","/tmp"],c:1,e:"/etc"},{q:"cd .. ?",o:["Home","Racine","Remonte","Liste"],c:2,e:"Parent."},{q:"Fichier vide ?",o:["mkdir","touch","create","new"],c:1,e:"touch."},{q:"Fichiers cachés ?",o:["-l","-h","-a","-r"],c:2,e:"-a."}],lab:[{i:"Liste détaillée",x:["ls -l","ls -la","ls -al"],o:"drwxr-xr-x config\n-rw-r--r-- .bashrc",h:"ls -l"},{i:"Va dans /etc",x:["cd /etc"],o:"",h:"cd"},{i:"Crée 'projets'",x:["mkdir projets"],o:"",h:"mkdir"},{i:"Crée 'readme.txt'",x:["touch readme.txt"],o:"",h:"touch"},{i:"10 lignes de /etc/passwd",x:["head /etc/passwd","head -n 10 /etc/passwd"],o:"root:x:0:0:root\ndaemon:x:1:1",h:"head"}]},
{id:14,slug:"permissions",title:"Permissions et Propriétés",level:"beginner",lv:"DÉBUTANT",os:"linux",course:'<h2>Permissions — Qui a le droit de faire quoi ?</h2><p>Imaginez un document dans un bureau. Certaines personnes peuvent le <strong>lire</strong>, d\'autres peuvent le <strong>modifier</strong>, et d\'autres encore peuvent l\'<strong>exécuter</strong> (lancer un programme). Sous Linux, chaque fichier a ces 3 types de permissions, pour 3 catégories de personnes.</p><h3>📖 Lire une ligne de permissions</h3><pre><code>-rwxr-xr-- 1 admin devs script.sh</code></pre><p>Ça a l\'air cryptique, mais c\'est simple une fois décodé :</p><ul><li><code>-</code> — Type de fichier (<code>-</code> = fichier normal, <code>d</code> = dossier)</li><li><code>rwx</code> — Permissions du <strong>propriétaire</strong> (admin) : read + write + execute</li><li><code>r-x</code> — Permissions du <strong>groupe</strong> (devs) : read + execute (pas write)</li><li><code>r--</code> — Permissions des <strong>autres</strong> (tout le monde) : read seulement</li></ul><p>Les 3 permissions :</p><ul><li><strong>r (read)</strong> — Peut lire le contenu du fichier</li><li><strong>w (write)</strong> — Peut modifier ou supprimer le fichier</li><li><strong>x (execute)</strong> — Peut exécuter le fichier (si c\'est un script ou programme)</li></ul><h3>🔢 La notation octale (chiffres)</h3><p>Chaque permission a une valeur numérique :</p><ul><li><strong>r = 4</strong>, <strong>w = 2</strong>, <strong>x = 1</strong></li><li>On additionne : <strong>rwx = 4+2+1 = 7</strong>, <strong>r-x = 4+0+1 = 5</strong>, <strong>r-- = 4+0+0 = 4</strong></li></ul><p>Donc <code>-rwxr-xr--</code> = <strong>754</strong>. Les valeurs courantes :</p><ul><li><strong>755</strong> — rwxr-xr-x : scripts, exécutables (tout le monde peut lire/exécuter, seul le proprio modifie)</li><li><strong>644</strong> — rw-r--r-- : fichiers de config (tout le monde peut lire, seul le proprio modifie)</li><li><strong>600</strong> — rw------- : fichiers sensibles (seul le proprio peut lire/modifier)</li><li><strong>700</strong> — rwx------ : dossiers privés</li></ul><h3>⌨️ chmod — Changer les permissions</h3><pre><code># Notation symbolique (plus lisible)\nchmod u+x script.sh     # Ajouter execute au user (proprio)\nchmod g-w fichier.txt   # Retirer write au group\nchmod o=r document.txt  # Others = read seulement\n\n# Notation octale (plus rapide)\nchmod 755 script.sh      # rwxr-xr-x\nchmod 600 cle_privee     # rw------- (clé SSH par ex.)</code></pre><h3>👤 chown — Changer le propriétaire</h3><pre><code># Changer le propriétaire\nchown alice fichier.txt\n\n# Changer propriétaire ET groupe\nchown alice:devs fichier.txt\n\n# Changer récursivement (tout un dossier)\nchown -R alice:devs /var/www/monsite</code></pre><div class="warn">⚠️ <strong>Ne mettez jamais 777</strong> (rwxrwxrwx) sur un fichier en production. Ça veut dire \"tout le monde peut tout faire\", c\'est une faille de sécurité. Si un fichier ne marche pas, cherchez la bonne permission plutôt que de mettre 777.</div><div class="tip">💡 <strong>Astuce mnémotechnique :</strong> Pour les chiffres, pensez à un interrupteur à 3 boutons : Read(4) Write(2) Execute(1). Allumez ceux dont vous avez besoin et additionnez.</div>',quiz:[{q:"Premier - dans -rwx... ?",o:["Pas perm","Fichier","Lien","Dossier"],c:1,e:"- = fichier."},{q:"Octal rwx ?",o:["4","5","6","7"],c:3,e:"4+2+1=7."},{q:"chmod 600 ?",o:["Tous lisent","rw proprio","Exec tous","Rien"],c:1,e:"6=rw, 0=rien."},{q:"Changer proprio ?",o:["chmod","chown","chgrp","usermod"],c:1,e:"chown."},{q:"r-x ?",o:["Read+exec","Read+write","Write+exec","Read"],c:0,e:"r-x."}],lab:[{i:"script.sh exécutable",x:["chmod u+x script.sh","chmod +x script.sh"],o:"",h:"chmod u+x"},{i:"755 sur app.sh",x:["chmod 755 app.sh"],o:"",h:"chmod 755"},{i:"Retire écriture autres config.txt",x:["chmod o-w config.txt"],o:"",h:"chmod o-w"},{i:"Proprio data.db → www-data",x:["chown www-data data.db","sudo chown www-data data.db"],o:"",h:"chown"},{i:"600 sur id_rsa",x:["chmod 600 id_rsa"],o:"",h:"600"}]},
{id:15,slug:"users",title:"Utilisateurs et Groupes",level:"intermediate",lv:"INTERMÉDIAIRE",os:"linux",course:'<h2>Utilisateurs et groupes — Gérer les habitants de votre machine</h2><p>Chaque personne (ou service) qui utilise un système Linux a un <strong>compte utilisateur</strong>. C\'est son identité : son nom, son mot de passe, ses droits. Sans compte, impossible de se connecter.</p><h3>📁 Les 3 fichiers sacrés</h3><p>Linux stocke les informations des utilisateurs dans 3 fichiers texte :</p><ul><li><strong><code>/etc/passwd</code></strong> — La liste de tous les utilisateurs. Malgré son nom, il ne contient PAS les mots de passe (ça c\'était avant). Chaque ligne = un utilisateur.</li><li><strong><code>/etc/shadow</code></strong> — Les mots de passe hashés (chiffrés). Seul root peut le lire. C\'est ici que le système vérifie votre mot de passe quand vous vous connectez.</li><li><strong><code>/etc/group</code></strong> — La liste de tous les groupes et de leurs membres.</li></ul><p>Une ligne de <code>/etc/passwd</code> ressemble à :</p><pre><code>alice:x:1001:1001:Alice Martin:/home/alice:/bin/bash\n# nom:mdp:UID:GID:commentaire:home:shell</code></pre><ul><li><strong>alice</strong> — Le nom de connexion</li><li><strong>x</strong> — \"Le mot de passe est dans /etc/shadow\"</li><li><strong>1001</strong> — L\'UID (identifiant numérique unique). root = 0.</li><li><strong>1001</strong> — Le GID (groupe principal)</li><li><strong>/home/alice</strong> — Le dossier personnel</li><li><strong>/bin/bash</strong> — Le shell (le programme qui interprète les commandes)</li></ul><h3>👤 Créer un utilisateur</h3><pre><code># Créer alice avec un dossier personnel et bash comme shell\nsudo useradd -m -s /bin/bash alice\n\n# Définir son mot de passe\nsudo passwd alice</code></pre><p><code>-m</code> crée le dossier /home/alice. Sans cette option, l\'utilisateur existe mais n\'a pas de \"chez lui\". <code>-s /bin/bash</code> lui donne bash comme shell (sinon il pourrait avoir /bin/sh qui est plus basique).</p><h3>👥 Groupes et l\'option piégeuse -aG</h3><p>Les groupes servent à donner des droits à plusieurs personnes d\'un coup :</p><pre><code># Ajouter alice au groupe sudo (lui donner les droits admin)\nsudo usermod -aG sudo alice\n\n# Voir les groupes d\'alice\nid alice</code></pre><div class="warn">⚠️ <strong>Le piège le plus dangereux de Linux :</strong> <code>usermod -G sudo alice</code> (sans le <code>-a</code>) <strong>REMPLACE</strong> tous les groupes d\'alice par \"sudo\" uniquement. Elle perd tous ses autres groupes ! Avec <code>-aG</code> (a = append), on <strong>AJOUTE</strong> le groupe sans toucher aux autres. Oubliez le -a une seule fois et vous pouvez casser les accès de quelqu\'un.</div><h3>🗑️ Supprimer un utilisateur</h3><pre><code># Supprimer l\'utilisateur et son dossier personnel\nsudo userdel -r alice</code></pre><div class="tip">💡 <strong>Bonne pratique :</strong> Avant de supprimer un utilisateur, vérifiez s\'il possède des fichiers importants avec <code>find / -user alice</code>. Et comme pour AD : désactivez d\'abord (avec <code>usermod -L alice</code> pour verrouiller), supprimez plus tard.</div>',quiz:[{q:"Hash mdp ?",o:["/etc/passwd","/etc/shadow","/etc/group","/etc/secrets"],c:1,e:"shadow."},{q:"-m useradd ?",o:["Muet","Crée home","Mdp","Mail"],c:1,e:"Home."},{q:"-a avec -G ?",o:["Active","Ajoute vs remplace","Crée","Force"],c:1,e:"Ajoute."},{q:"UID root ?",o:["1","100","0","999"],c:2,e:"0."},{q:"Groupes d'un user ?",o:["usermod","groups","cat passwd","ls home"],c:1,e:"groups."}],lab:[{i:"Crée webmaster",x:["sudo useradd -m -s /bin/bash webmaster","useradd -m -s /bin/bash webmaster"],o:"",h:"useradd -m -s"},{i:"Ajoute à www-data",x:["sudo usermod -aG www-data webmaster","usermod -aG www-data webmaster"],o:"",h:"usermod -aG"},{i:"Infos webmaster",x:["id webmaster"],o:"uid=1001 gid=1001 groups=33(www-data)",h:"id"},{i:"Crée groupe devops",x:["sudo groupadd devops","groupadd devops"],o:"",h:"groupadd"},{i:"Supprime webmaster",x:["sudo userdel -r webmaster","userdel -r webmaster"],o:"",h:"userdel -r"}]},
{id:16,slug:"processes",title:"Gestion des Processus",level:"intermediate",lv:"INTERMÉDIAIRE",os:"linux",course:'<h2>Processus — Les programmes en vie</h2><p>Quand vous lancez un programme sous Linux, il devient un <strong>processus</strong>. C\'est comme un employé dans un bureau : il a un numéro (PID), un patron (le processus parent), il consomme des ressources (CPU, mémoire), et on peut lui donner des ordres.</p><h3>👀 Voir les processus en cours</h3><pre><code># Liste statique de TOUS les processus\nps aux\n\n# Vue en temps réel (rafraîchie toutes les secondes)\ntop\n\n# Version améliorée de top (plus lisible, avec couleurs)\nhtop</code></pre><p><code>ps aux</code> est la commande la plus utilisée. Chaque colonne a un sens :</p><ul><li><strong>USER</strong> — Qui a lancé le processus</li><li><strong>PID</strong> — L\'identifiant unique du processus (Process ID)</li><li><strong>%CPU</strong> — Pourcentage de CPU utilisé</li><li><strong>%MEM</strong> — Pourcentage de mémoire utilisée</li><li><strong>COMMAND</strong> — Le nom du programme</li></ul><h3>🔫 Les signaux — Parler aux processus</h3><p>On ne \"ferme\" pas un processus sous Linux, on lui envoie un <strong>signal</strong>. C\'est comme parler à quelqu\'un :</p><ul><li><strong>SIGTERM (15)</strong> — \"S\'il te plaît, arrête-toi proprement.\" Le processus a le temps de sauvegarder et de nettoyer. C\'est le signal par défaut.</li><li><strong>SIGKILL (9)</strong> — \"STOP. Maintenant.\" Le processus est tué immédiatement, sans possibilité de nettoyage. C\'est le bouton d\'urgence.</li><li><strong>SIGHUP (1)</strong> — \"Relis ta configuration.\" Utile pour recharger un service sans le redémarrer.</li></ul><pre><code># Demander poliment au processus 1234 de s\'arrêter\nkill 1234\n\n# Forcer l\'arrêt (si SIGTERM ne marche pas)\nkill -9 1234\n\n# Tuer par nom de programme\nkillall nginx</code></pre><div class="warn">⚠️ <strong>Toujours SIGTERM d\'abord, SIGKILL en dernier recours.</strong> Un SIGKILL ne laisse pas le programme sauvegarder ses données. Une base de données tuée avec kill -9 peut se retrouver avec des données corrompues.</div><h3>🔄 Arrière-plan et premier plan</h3><pre><code># Lancer en arrière-plan (le terminal reste libre)\ncommande &\n\n# Lancer en arrière-plan ET résistant à la déconnexion\nnohup commande &\n\n# Voir les jobs en arrière-plan\njobs\n\n# Remettre un job au premier plan\nfg %1</code></pre><div class="tip">💡 <strong>nohup</strong> est crucial pour les serveurs distants. Sans lui, si vous fermez votre session SSH, vos processus en arrière-plan meurent aussi. Avec nohup, ils continuent de tourner.</div>',quiz:[{q:"PID ?",o:["Info","Program ID","Process Identifier","Priority"],c:2,e:"Process Identifier."},{q:"TERM vs KILL ?",o:["Aucune","TERM rapide","TERM propre","KILL doux"],c:2,e:"TERM propre."},{q:"Background ?",o:["#","&","bg","--bg"],c:1,e:"&"},{q:"ps aux | grep nginx ?",o:["Installe","Liste nginx","Arrête","Config"],c:1,e:"Filtre."},{q:"Temps réel ?",o:["ps","ls","top","grep"],c:2,e:"top."}],lab:[{i:"Tous les processus",x:["ps aux"],o:"root 1 init\nroot 412 sshd\nwww 891 nginx",h:"ps aux"},{i:"Filtre sshd",x:["ps aux | grep sshd","pgrep -a sshd"],o:"root 412 sshd",h:"| grep"},{i:"Kill propre 891",x:["kill 891","kill -15 891"],o:"",h:"kill"},{i:"Kill forcé 891",x:["kill -9 891"],o:"",h:"kill -9"},{i:"python3 server.py en bg",x:["python3 server.py &"],o:"[1] 1234",h:"&"}]},
{id:17,slug:"networking",title:"Réseau Linux",level:"intermediate",lv:"INTERMÉDIAIRE",os:"linux",course:'<h2>Réseau — Comprendre comment votre machine communique</h2><p>Votre serveur Linux ne vit pas isolé. Il parle à d\'autres machines : des clients, des serveurs web, des bases de données. Comprendre le réseau, c\'est comprendre <strong>comment ces conversations se passent</strong>.</p><h3>🏠 Voir sa propre configuration</h3><pre><code># Quelle est mon adresse IP ? (remplace l\'ancien ifconfig)\nip addr show\n\n# Par quelle route passent mes paquets ?\nip route\n\n# Quels ports sont ouverts ? Quels programmes écoutent ?\nss -tulnp</code></pre><p>La commande <code>ss -tulnp</code> est indispensable. Chaque lettre est une option :</p><ul><li><strong>t</strong> = TCP (connexions fiables)</li><li><strong>u</strong> = UDP (connexions rapides)</li><li><strong>l</strong> = listen (ports en écoute — qui attend des connexions)</li><li><strong>n</strong> = numeric (affiche les numéros de port au lieu des noms)</li><li><strong>p</strong> = process (montre quel programme utilise ce port)</li></ul><h3>🔍 Diagnostic réseau — Quand ça ne marche pas</h3><p>Un site ne répond pas ? Un service est inaccessible ? Voici la démarche méthodique :</p><pre><code># 1. Est-ce que la machine distante répond ?\nping -c 4 google.com\n\n# 2. Le DNS fonctionne ? (résolution de nom)\ndig google.com\n\n# 3. Le service web répond ? (headers HTTP)\ncurl -I https://google.com</code></pre><p><code>ping</code> envoie des paquets ICMP et mesure le temps de réponse. Si ça ne passe pas, soit le réseau est coupé, soit la machine distante bloque les pings.</p><p><code>dig</code> interroge le DNS : est-ce que \"google.com\" se traduit bien en adresse IP ? Si dig échoue, le problème est DNS.</p><p><code>curl -I</code> envoie une requête HTTP et affiche les headers de réponse. Si ping marche mais curl échoue, le problème est applicatif (port fermé, service planté...).</p><h3>📡 Les ports à connaître</h3><ul><li><strong>22</strong> — SSH (connexion distante sécurisée)</li><li><strong>80</strong> — HTTP (web non chiffré)</li><li><strong>443</strong> — HTTPS (web chiffré)</li><li><strong>53</strong> — DNS (résolution de noms)</li><li><strong>25</strong> — SMTP (envoi de mails)</li><li><strong>3306</strong> — MySQL</li><li><strong>5432</strong> — PostgreSQL</li></ul><div class="tip">💡 <strong>Méthode de diagnostic :</strong> Toujours du plus bas au plus haut. 1) ping (réseau de base), 2) dig (DNS), 3) curl/telnet (application). Si le niveau 1 ne marche pas, inutile de tester le 2.</div><div class="warn">⚠️ <code>ss</code> remplace <code>netstat</code> qui est obsolète. Si vous lisez un vieux tuto avec <code>netstat -tulnp</code>, remplacez par <code>ss -tulnp</code>.</div>',quiz:[{q:"Remplace netstat ?",o:["ip","nmap","ss","dig"],c:2,e:"ss."},{q:"ping -c 4 ?",o:["Télécharge","4 ICMP","4 routes","4 ports"],c:1,e:"4 paquets."},{q:"DNS config ?",o:["hosts","resolv.conf","network","dns"],c:1,e:"resolv.conf."},{q:"Port 80 ?",o:["port 80","ss","lsof -i :80","grep"],c:2,e:"lsof."},{q:"dig ?",o:["Fouille","DNS détaillé","Scanne","Route"],c:1,e:"DNS."}],lab:[{i:"Interfaces réseau",x:["ip addr show","ip a","ip addr"],o:"lo: 127.0.0.1\neth0: 192.168.1.42",h:"ip addr"},{i:"3 pings google.com",x:["ping -c 3 google.com"],o:"3 packets, 0% loss",h:"ping -c 3"},{i:"Ports TCP",x:["ss -tlnp","ss -tulnp"],o:":22 sshd\n:80 nginx",h:"ss -tlnp"},{i:"DNS example.com",x:["dig example.com","nslookup example.com"],o:"example.com A 93.184.216.34",h:"dig"},{i:"Table routage",x:["ip route show","ip route","ip r"],o:"default via 192.168.1.1",h:"ip route"}]},
{id:18,slug:"systemd",title:"Services et systemd",level:"advanced",lv:"AVANCÉ",os:"linux",course:'<h2>systemd — Le chef d\'orchestre de vos services</h2><p>Quand votre serveur démarre, il doit lancer plein de choses : le serveur web, la base de données, le SSH, etc. Qui décide de l\'ordre ? Qui redémarre un service qui plante ? Qui gère les logs ? C\'est <strong>systemd</strong>, le gestionnaire de services de Linux.</p><p>Pensez à systemd comme un <strong>chef d\'orchestre</strong> : il dit aux musiciens (services) quand jouer, les surveille, et les remplace s\'ils s\'arrêtent.</p><h3>⌨️ Les commandes systemctl</h3><p><code>systemctl</code> est votre télécommande pour contrôler les services :</p><pre><code># Voir l\'état d\'un service (marche ? planté ? erreurs ?)\nsystemctl status nginx\n\n# Démarrer / Arrêter / Redémarrer\nsystemctl start nginx\nsystemctl stop nginx\nsystemctl restart nginx\n\n# Activer au démarrage (le service se lance automatiquement au boot)\nsystemctl enable nginx\n\n# Désactiver au démarrage\nsystemctl disable nginx</code></pre><p>La différence entre <code>start</code> et <code>enable</code> est cruciale :</p><ul><li><strong>start</strong> = \"Lance le service maintenant.\" Au prochain redémarrage, il faudra le relancer manuellement.</li><li><strong>enable</strong> = \"Lance ce service à chaque démarrage du serveur.\" Ne le lance pas immédiatement.</li><li>En pratique, on fait souvent les deux : <code>systemctl enable --now nginx</code></li></ul><h3>📋 Lire les logs avec journalctl</h3><p><code>journalctl</code> est le journal de bord de systemd. Quand un service plante, c\'est ici qu\'on trouve pourquoi :</p><pre><code># Logs d\'un service spécifique\njournalctl -u nginx\n\n# Logs d\'aujourd\'hui seulement\njournalctl -u nginx --since today\n\n# Suivre les logs en temps réel (comme tail -f)\njournalctl -f\n\n# Les 50 dernières lignes\njournalctl -u nginx -n 50</code></pre><h3>🔧 Créer son propre service</h3><p>Vous avez une application Python/Node/etc. que vous voulez lancer automatiquement ? Créez un fichier <code>.service</code> :</p><pre><code># /etc/systemd/system/mon-app.service\n[Unit]\nDescription=Mon Application Web\nAfter=network.target\n\n[Service]\nExecStart=/usr/bin/python3 /opt/app/app.py\nWorkingDirectory=/opt/app\nRestart=always\nUser=www-data\n\n[Install]\nWantedBy=multi-user.target</code></pre><p>Explication de chaque section :</p><ul><li><strong>[Unit]</strong> — Description et dépendances. <code>After=network.target</code> = \"Attends que le réseau soit prêt.\"</li><li><strong>[Service]</strong> — Que lancer et comment. <code>Restart=always</code> = \"Si ça plante, relance automatiquement.\"</li><li><strong>[Install]</strong> — Quand lancer. <code>multi-user.target</code> = au démarrage normal du serveur.</li></ul><pre><code># Après avoir créé le fichier, recharger systemd\nsystemctl daemon-reload\n\n# Puis activer et démarrer\nsystemctl enable --now mon-app</code></pre><div class="warn">⚠️ Après chaque modification d\'un fichier .service, il faut faire <code>systemctl daemon-reload</code> pour que systemd prenne en compte les changements.</div><div class="tip">💡 <strong>Restart=always</strong> est votre meilleur ami en production. Votre app plante à 3h du matin ? systemd la relance en quelques secondes, sans intervention humaine.</div>',quiz:[{q:"Boot ?",o:["start","enable","activate","boot"],c:1,e:"enable."},{q:"Logs live ?",o:["-u","-f","--live","-r"],c:1,e:"-f follow."},{q:"daemon-reload ?",o:["Restart all","Recharge .service","Reset","Del logs"],c:1,e:"Relit les units."},{q:"Restart=always ?",o:["Sys restart","Relance si crash","Hourly","Debug"],c:1,e:"Auto-relance."},{q:"Dépendances ?",o:["[Service]","[Install]","[Unit]","[Boot]"],c:2,e:"[Unit] After=."}],lab:[{i:"Statut nginx",x:["systemctl status nginx","sudo systemctl status nginx"],o:"● active (running)",h:"status"},{i:"Redémarre nginx",x:["sudo systemctl restart nginx","systemctl restart nginx"],o:"",h:"restart"},{i:"Active au boot",x:["sudo systemctl enable nginx","systemctl enable nginx"],o:"Symlink created",h:"enable"},{i:"Logs nginx today",x:["journalctl -u nginx --since today"],o:"nginx: OK",h:"--since today"},{i:"Recharge systemd",x:["sudo systemctl daemon-reload","systemctl daemon-reload"],o:"",h:"daemon-reload"}]},
{id:19,slug:"ssh",title:"SSH et Sécurité",level:"advanced",lv:"AVANCÉ",os:"linux",course:'<h2>SSH et sécurité — Se connecter à distance sans risque</h2><p><strong>SSH (Secure Shell)</strong> est LE moyen de se connecter à un serveur distant. Imaginez une conversation téléphonique chiffrée : même si quelqu\'un écoute la ligne, il n\'entend que du bruit. C\'est exactement ce que fait SSH.</p><h3>🔑 Les clés SSH — Mieux qu\'un mot de passe</h3><p>Au lieu de taper un mot de passe à chaque connexion (qui peut être intercepté ou deviné), on utilise des <strong>paires de clés cryptographiques</strong> :</p><ul><li><strong>Clé privée</strong> — Reste sur votre machine. Ne la partagez JAMAIS. C\'est votre carte d\'identité.</li><li><strong>Clé publique</strong> — Se copie sur le serveur distant. C\'est comme un cadenas : tout le monde peut le voir, mais seule votre clé privée peut l\'ouvrir.</li></ul><pre><code># Générer une paire de clés (ed25519 = le plus moderne et sûr)\nssh-keygen -t ed25519\n\n# Copier la clé publique sur le serveur\nssh-copy-id user@serveur\n\n# Se connecter (plus besoin de mot de passe !)\nssh user@serveur</code></pre><div class="tip">💡 <strong>ed25519</strong> est l\'algorithme recommandé en 2024. Vous verrez aussi RSA dans les vieux tutos — ça marche encore mais ed25519 est plus sûr et plus rapide.</div><h3>🔒 Sécuriser le serveur SSH</h3><p>Par défaut, SSH accepte les connexions par mot de passe et permet la connexion en root. C\'est dangereux. Modifiez <code>/etc/ssh/sshd_config</code> :</p><pre><code># Interdire la connexion root directe\nPermitRootLogin no\n\n# Interdire les mots de passe (que des clés !)\nPasswordAuthentication no\n\n# Changer le port (optionnel, réduit le bruit)\nPort 2222</code></pre><p>Pourquoi interdire root ? Parce que \"root\" est un nom connu de tous les attaquants. C\'est le premier login qu\'ils essaient. Si vous connectez en tant que \"alice\" puis faites <code>sudo</code>, l\'attaquant doit deviner à la fois le login ET le mot de passe.</p><h3>🛡️ UFW — Le pare-feu simplifié</h3><p>UFW (Uncomplicated Firewall) est la façade simple d\'iptables :</p><pre><code># Activer le pare-feu\nsudo ufw enable\n\n# Autoriser SSH (FAITES-LE AVANT d\'activer !)\nsudo ufw allow 22/tcp\n\n# Autoriser le web\nsudo ufw allow 80/tcp\nsudo ufw allow 443/tcp\n\n# Voir les règles\nsudo ufw status</code></pre><div class="warn">⚠️ <strong>DANGER :</strong> Si vous activez UFW sans autoriser le port 22, vous vous enfermez dehors ! Plus aucune connexion SSH possible. Autorisez TOUJOURS SSH en premier.</div><h3>🚨 Fail2Ban — Le videur automatique</h3><p>Fail2Ban surveille les logs et <strong>bloque automatiquement</strong> les IPs qui font trop de tentatives de connexion échouées :</p><pre><code># Configuration dans /etc/fail2ban/jail.local\n[sshd]\nenabled = true\nmaxretry = 3       # 3 tentatives max\nbantime = 3600     # Banni pendant 1h (en secondes)\nfindtime = 600     # Fenêtre de 10 minutes</code></pre><p>Concrètement : si une IP fait 3 tentatives de connexion échouées en 10 minutes, elle est bloquée pendant 1 heure. Sans Fail2Ban, un attaquant peut tester des millions de mots de passe (brute-force).</p><div class="tip">💡 <strong>La sécurité SSH en 3 règles :</strong> 1) Clés au lieu de mots de passe. 2) Pas de connexion root directe. 3) Fail2Ban activé. Avec ces 3 mesures, vous bloquez 99% des attaques automatisées.</div>',quiz:[{q:"Algo recommandé ?",o:["RSA","DSA","ed25519","ECDSA"],c:2,e:"ed25519."},{q:"Désactiver PasswordAuth ?",o:["Accélérer","Forcer clés","Bloquer","Logs"],c:1,e:"Clés > mdp."},{q:"Fail2Ban ?",o:["Chiffre","Bannit IP","Bloque ports","Génère clés"],c:1,e:"Bannit."},{q:"Copier clé ?",o:["keygen","copy-id","scp","add"],c:1,e:"ssh-copy-id."},{q:"ufw allow 443 ?",o:["Bloque","HTTPS","Redirige","Scanne"],c:1,e:"HTTPS."}],lab:[{i:"Clé ed25519",x:["ssh-keygen -t ed25519"],o:"Saved in ~/.ssh/id_ed25519",h:"ssh-keygen -t"},{i:"Copie vers 192.168.1.100",x:["ssh-copy-id admin@192.168.1.100"],o:"1 key added",h:"ssh-copy-id"},{i:"Active UFW",x:["sudo ufw enable","ufw enable"],o:"Firewall active",h:"ufw enable"},{i:"Autorise SSH",x:["sudo ufw allow 22/tcp","sudo ufw allow 22","sudo ufw allow ssh"],o:"Rule added",h:"ufw allow 22"},{i:"Règles UFW",x:["sudo ufw status","ufw status"],o:"22/tcp ALLOW\n80,443 ALLOW",h:"ufw status"}]},
{id:20,slug:"storage",title:"Stockage et LVM",level:"advanced",lv:"AVANCÉ",os:"linux",course:'<h2>Stockage — Gérer vos disques et l\'espace</h2><p>Un serveur sans espace disque, c\'est comme un bureau couvert de papiers : plus rien ne fonctionne. Les logs s\'arrêtent, les bases de données plantent, les mails ne s\'envoient plus. Gérer le stockage, c\'est une compétence <strong>critique</strong> pour un admin sys.</p><h3>👀 Voir l\'état du stockage</h3><pre><code># Lister tous les disques et partitions (vue arbre)\nlsblk\n\n# Espace disque utilisé par partition (h = human readable)\ndf -h\n\n# Taille d\'un dossier spécifique\ndu -sh /var/log</code></pre><p>Ces 3 commandes sont votre tableau de bord :</p><ul><li><code>lsblk</code> — \"Quels disques physiques j\'ai et comment sont-ils découpés ?\"</li><li><code>df -h</code> — \"Combien d\'espace reste-t-il sur chaque partition ?\" (<code>-h</code> = human readable, affiche en Go au lieu d\'octets)</li><li><code>du -sh</code> — \"Ce dossier fait combien ?\" Très utile pour trouver ce qui prend de la place.</li></ul><h3>🔌 Montage — Connecter un disque</h3><p>Sous Linux, un disque n\'est pas accessible automatiquement. Il faut le <strong>monter</strong> sur un dossier, comme brancher une clé USB :</p><pre><code># Monter temporairement (disparaît au redémarrage)\nmount /dev/sdb1 /mnt/data\n\n# Démonter\numount /mnt/data</code></pre><p>Pour un montage permanent (qui survit au redémarrage), on ajoute une ligne dans <code>/etc/fstab</code> :</p><pre><code># /etc/fstab\n/dev/sdb1  /mnt/data  ext4  defaults  0  2</code></pre><div class="warn">⚠️ <strong>Erreur dans fstab = serveur qui ne démarre plus.</strong> Testez toujours avec <code>mount -a</code> (monte tout ce qui est dans fstab) avant de redémarrer. Si ça échoue, corrigez avant de rebooter !</div><h3>📦 LVM — Des disques élastiques</h3><p>LVM (Logical Volume Manager) est une couche d\'abstraction entre vos disques physiques et vos partitions. L\'avantage ? Vous pouvez <strong>agrandir une partition sans redémarrer</strong>. C\'est comme un meuble modulaire qu\'on peut agrandir en ajoutant des éléments.</p><p>Les 3 niveaux de LVM :</p><ul><li><strong>PV (Physical Volume)</strong> — Le disque physique brut</li><li><strong>VG (Volume Group)</strong> — Un \"pool\" de stockage qui regroupe un ou plusieurs PV</li><li><strong>LV (Logical Volume)</strong> — La \"partition\" virtuelle qu\'on utilise, taillée dans le VG</li></ul><pre><code># 1. Préparer le disque physique\npvcreate /dev/sdb\n\n# 2. Créer un pool de stockage\nvgcreate mon_vg /dev/sdb\n\n# 3. Créer une partition virtuelle de 10 Go\nlvcreate -L 10G -n mon_lv mon_vg\n\n# Plus tard : agrandir de 5 Go (sans redémarrage !)\nlvextend -L +5G /dev/mon_vg/mon_lv\nresize2fs /dev/mon_vg/mon_lv</code></pre><div class="tip">💡 <strong>Pourquoi LVM est indispensable en production :</strong> Sans LVM, si votre partition /var est pleine à 100%, vous devez éteindre le serveur, repartitionner, et prier pour que rien ne casse. Avec LVM, vous ajoutez de l\'espace en une commande, serveur allumé. C\'est pour ça que tous les serveurs pro utilisent LVM.</div>',quiz:[{q:"Arbo disques ?",o:["df","du","lsblk","fdisk"],c:2,e:"lsblk."},{q:"df -h ?",o:["Détruit","Espace lisible","Défrag","Duplique"],c:1,e:"disk free."},{q:"Montage permanent ?",o:["mount","disk","fstab","vol"],c:2,e:"fstab."},{q:"VG ?",o:["Virtual","Gateway","Volume Group","Verified"],c:2,e:"Volume Group."},{q:"Étendre +5G ?",o:["lvresize","lvextend -L +5G","lvadd","vgextend"],c:1,e:"lvextend."}],lab:[{i:"Arbo disques",x:["lsblk"],o:"sda 50G\n├─sda1 49G /\nsdb 100G",h:"lsblk"},{i:"Espace disque",x:["df -h"],o:"/dev/sda1 49G 12G 35G 25%",h:"df -h"},{i:"Formate sdb1 ext4",x:["sudo mkfs.ext4 /dev/sdb1","mkfs.ext4 /dev/sdb1"],o:"done",h:"mkfs.ext4"},{i:"Monte sdb1 sur /mnt/data",x:["sudo mount /dev/sdb1 /mnt/data","mount /dev/sdb1 /mnt/data"],o:"",h:"mount"},{i:"Taille /var/log",x:["du -sh /var/log","sudo du -sh /var/log"],o:"245M",h:"du -sh"}]},
{id:21,slug:"automation",title:"Automation et Scripting",level:"expert",lv:"EXPERT",os:"linux",course:'<h2>Automation — Faire travailler la machine à votre place</h2><p>Un bon admin sys est un admin sys <strong>paresseux</strong> (dans le bon sens). Si vous faites la même tâche plus de 2 fois, il faut l\'automatiser. Pourquoi ? Parce qu\'un script ne se trompe pas à 3h du matin, ne part pas en vacances, et ne fait pas de fautes de frappe.</p><h3>📝 Scripts Bash — Les bases</h3><p>Un script Bash, c\'est juste un fichier texte avec des commandes dedans :</p><pre><code>#!/bin/bash\nset -euo pipefail\n\n# Script de backup quotidien\nBACKUP="/backup/$(date +%Y%m%d)"\nmkdir -p "$BACKUP"\n\n# Copier les fichiers importants\ncp -r /etc "$BACKUP/etc"\ncp -r /var/www "$BACKUP/www"\n\n# Supprimer les backups de plus de 30 jours\nfind /backup -mtime +30 -delete\n\necho "Backup terminé : $BACKUP"</code></pre><p>La première ligne est cruciale :</p><ul><li><code>#!/bin/bash</code> — Dit au système \"exécute ce fichier avec bash\"</li><li><code>set -euo pipefail</code> — Filet de sécurité : le script s\'arrête immédiatement si une commande échoue (<code>-e</code>), si une variable n\'est pas définie (<code>-u</code>), ou si un pipe échoue (<code>-o pipefail</code>). Sans ça, le script continue malgré les erreurs — dangereux !</li></ul><h3>⏰ Cron — Planifier des tâches</h3><p>Cron est l\'agenda de votre serveur. Il exécute des commandes à des heures précises :</p><pre><code># Éditer la crontab\ncrontab -e\n\n# Format : minute heure jour mois jour_semaine commande\n# Backup tous les jours à 2h du matin\n0 2 * * * /opt/backup.sh\n\n# Health check toutes les 5 minutes\n*/5 * * * * /opt/health.sh\n\n# Nettoyage des logs chaque lundi à 6h\n0 6 * * 1 /opt/clean-logs.sh</code></pre><p>Le format cron en 5 champs : <code>M H J MOIS JSEM</code></p><ul><li><code>*</code> = \"tous\" (chaque minute, chaque heure...)</li><li><code>*/5</code> = \"tous les 5\" (toutes les 5 minutes)</li><li><code>0 2 * * *</code> = \"à 2h00, tous les jours\"</li><li><code>0 6 * * 1</code> = \"à 6h00, chaque lundi\" (1 = lundi)</li></ul><h3>🐳 Docker — L\'aperçu</h3><p>Docker permet de faire tourner des applications dans des <strong>conteneurs</strong> isolés. Imaginez des boîtes séparées : chaque application a son propre environnement, ses propres dépendances, sans interférer avec les autres.</p><pre><code># Lancer un serveur web nginx en arrière-plan\ndocker run -d -p 80:80 nginx\n\n# Entrer dans un conteneur (pour débugger)\ndocker exec -it mon_conteneur bash\n\n# Voir les conteneurs en cours\ndocker ps</code></pre><div class="tip">💡 <strong>L\'objectif ultime : Infrastructure as Code.</strong> Tout ce qui est sur vos serveurs (config, applications, sécurité) doit être décrit dans des fichiers versionnés (Git). Si un serveur brûle, vous devez pouvoir le reconstruire à l\'identique en exécutant un script. C\'est la philosophie DevOps.</div><div class="warn">⚠️ <strong>Testez toujours vos scripts</strong> sur un environnement de test avant la production. Un script avec une erreur dans le chemin de backup peut effacer des données au lieu de les sauvegarder.</div>',quiz:[{q:"set -euo pipefail ?",o:["Debug","Strict","Désactive err","Silencieux"],c:1,e:"Strict."},{q:"*/5 * * * * ?",o:["5/mois","5 min","5 jours","5h"],c:1,e:"5 min."},{q:"become: yes ?",o:["User","Root/sudo","Verbose","Backup"],c:1,e:"sudo."},{q:"Shell conteneur ?",o:["run","shell","exec -it bash","attach"],c:2,e:"exec -it."},{q:"IaC ?",o:["Apps","Infra en code","Manuel","Cloud"],c:1,e:"Infrastructure as Code."}],lab:[{i:"Ouvre crontab",x:["crontab -e"],o:"[ouvert]",h:"crontab -e"},{i:"Nginx Docker port 80",x:["docker run -d -p 80:80 nginx"],o:"nginx started",h:"docker run -d -p 80:80"},{i:"Conteneurs actifs",x:["docker ps"],o:"nginx Up 2m :80",h:"docker ps"},{i:"Shell dans keen_tesla",x:["docker exec -it keen_tesla bash"],o:"root@a1b2c3:/#",h:"exec -it bash"},{i:"Fichiers >30j /backup",x:["find /backup -type f -mtime +30 -delete","find /backup -mtime +30 -delete"],o:"",h:"-mtime +30 -delete"}]},

function getCurrentLevel(xp){let cur=LEVELS[0];for(const l of LEVELS){if(xp>=l.xpRequired)cur=l}return cur}
function getNextLevel(xp){return LEVELS.find(l=>l.xpRequired>xp)||null}
function getXpPercent(xp){const cur=getCurrentLevel(xp);const next=getNextLevel(xp);if(!next)return 100;const range=next.xpRequired-cur.xpRequired;return Math.round(((xp-cur.xpRequired)/range)*100)}

function unlockRewardsForLevel(level){
const r=LEVEL_REWARDS[level];if(!r)return;
if(!st.unlockedTools)st.unlockedTools=[];
if(!st.unlockedCmds)st.unlockedCmds=[];
if(!st.quests)st.quests={};
r.tools.forEach(t=>{if(!st.unlockedTools.includes(t))st.unlockedTools.push(t)});
r.cmds.forEach(c=>{if(!st.unlockedCmds.includes(c))st.unlockedCmds.push(c)});
r.quests.forEach(q=>{if(!st.quests[q])st.quests[q]='active'});
}

function gainXP(amount,reason){
if(!amount||amount<=0)return;
st.xp=(st.xp||0)+amount;
const newLvl=getCurrentLevel(st.xp);
if(newLvl.level>(st.level||1)){
st.level=newLvl.level;
unlockRewardsForLevel(newLvl.level);
sv();
showLevelUpModal(newLvl);
}else{sv()}
updateXPBar();
showToast('+'+amount+' XP — '+reason);
}

function updateXPBar(){
const xp=st.xp||0;const cur=getCurrentLevel(xp);const next=getNextLevel(xp);const pct=getXpPercent(xp);
const el=document.getElementById('xpPanel');if(!el)return;
if(!next){el.innerHTML=`<div class="xp-header"><span class="xp-title" style="color:${cur.color}">${cur.title}</span><span class="xp-level">Nv. ${cur.level}</span></div><div class="xp-bar-track"><div class="xp-bar-fill" style="width:100%"></div></div><div class="xp-sub" style="color:#2E7D32">* Niveau maximum atteint</div>`;return}
el.innerHTML=`<div class="xp-header"><span class="xp-title" style="color:${cur.color}">${cur.title}</span><span class="xp-level">Nv. ${cur.level}</span></div><div class="xp-bar-track"><div class="xp-bar-fill" style="width:${pct}%"></div></div><div class="xp-sub">${xp} / ${next.xpRequired} XP</div>`;
}

function isCmdUnlocked(cmd){
if(!cmd)return true;
const base=cmd.trim().split(/\s+/)[0].replace(/^["']/,'');
if(FREE_CMDS.some(fc=>base.toLowerCase()===fc.toLowerCase()))return true;
if(st.unlockedCmds&&st.unlockedCmds.some(uc=>base.toLowerCase()===uc.toLowerCase()))return true;
// Only block commands that are explicitly in a higher level reward list
const req=getRequiredLevelForCmd(base);
if(!req)return true; // Not in any level list = always allowed (arguments, paths, etc.)
return false;
}

function getRequiredLevelForCmd(cmd){
const base=cmd.trim().split(/\s+/)[0].replace(/^["']/,'');
for(const[lv,r]of Object.entries(LEVEL_REWARDS)){
if(r.cmds.some(c=>c.toLowerCase()===base.toLowerCase()))return{level:parseInt(lv),info:LEVELS.find(l=>l.level===parseInt(lv))};
}return null;
}

function checkAllQuests(){

st.quests[id]='completed';
if(!st.badges)st.badges=[];
if(!st.badges.includes(q.badge))st.badges.push(q.badge);
gainXP(q.reward,'Quete: '+q.title);
}}sv();
}

function showToast(msg,type='success'){const t=document.createElement('div');t.style.cssText=`position:fixed;top:20px;right:20px;padding:10px 20px;border-radius:6px;font-family:'Segoe UI',sans-serif;font-size:12px;z-index:10000;color:#fff;animation:fadeIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.3);${type==='success'?'background:#27ae60':type==='error'?'background:#e74c3c':'background:#2980b9'}`;t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2500)}

// ========= SERVER MANAGER INTERACTIVITY =========
function smToggle(i){const r=smRoles[i];r.s=r.s==='Running'?'Stopped':'Running';showToast(`${r.n} → ${r.s==='Running'?'Démarré':'Arrêté'}`);checkTasks();rC()}
function smDetail(i){const r=smRoles[i];showDialog('Propriétés — '+r.n,[{label:'Rôle',type:'info',value:r.i+' '+r.n},{label:'État',type:'info',value:r.s==='Running'?'✅ En cours d\'exécution':'❌ Arrêté'},{label:'Serveur',type:'info',value:'SRV-DC01'},{label:'Type',type:'info',value:'Rôle Windows Server'}],()=>{})}
function smAddRole(){const existing=smRoles.map(r=>r.n);const avail=['WSUS','WDS','Print Services','ADCS','ADFS','NPS','Remote Desktop Services','Web Server (IIS)'].filter(n=>!existing.includes(n));
if(!avail.length){showToast('Tous les rôles sont déjà installés','error');return}
showDialog('Ajouter un rôle',[{label:'Rôle',id:'role',type:'select',opts:avail}],v=>{if(!v.role)return;const icons={'WSUS':'🔄','WDS':'💿','Print Services':'🖨️','ADCS':'🔐','ADFS':'🔑','NPS':'🛡️','Remote Desktop Services':'🖥️','Web Server (IIS)':'🌍'};smRoles.push({n:v.role,s:'Stopped',i:icons[v.role]||'⚙️'});showToast(`Rôle ${v.role} installé`);checkTasks();rC()})}
function smRefresh(){checkTasks();rC();showToast('Actualisé','info')}

function hvNewVM(){showDialog('Nouvelle machine virtuelle',[{label:'Nom',id:'name',ph:'SRV-BACKUP'},{label:'RAM (Mo)',id:'ram',ph:'4096'},{label:'CPU (vCPU)',id:'cpu',ph:'2'},{label:'Disque (Go)',id:'disk',ph:'60'}],v=>{if(!v.name)return;hvVMs.push({n:v.name,s:'Off',c:'-',m:v.ram||'2048',u:'-',snap:[]});showToast(`VM "${v.name}" créée`);checkTasks();rC()})}
function hvDetail(i){const v=hvVMs[i];showDialog('Propriétés — '+v.n,[{label:'Nom',type:'info',value:v.n},{label:'État',type:'info',value:v.s==='Running'?'✅ En cours':'❌ Arrêté'},{label:'CPU',type:'info',value:v.c},{label:'RAM',type:'info',value:v.m==='—'||v.m==='-'?'—':v.m+' Mo'},{label:'Uptime',type:'info',value:v.u},{label:'Snapshots',type:'info',value:v.snap.length?v.snap.join(', '):'(aucun)'}],()=>{})}

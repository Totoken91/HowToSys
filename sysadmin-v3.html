// ========= FILE SHARES INTERACTIVITY =========
function fsNew(){showDialog('Nouveau partage',[{label:'Nom',id:'name',ph:'Backup'},{label:'Chemin',id:'path',ph:'D:\\Backup'},{label:'Permissions SMB',id:'smb',ph:'Domain Users: Read'},{label:'Permissions NTFS',id:'ntfs',type:'select',opts:['Read','Read+Execute','Modify','Full']}],v=>{if(!v.name)return;sharesList.push({n:v.name,p:v.path||'C:\\Partages\\'+v.name,smb:v.smb||'Domain Users: Read',ntfs:v.ntfs||'Read'});showToast(`Partage "${v.name}" créé`);checkTasks();rC()})}
function fsEdit(i){const s=sharesList[i];showDialog('Éditer partage — '+s.n,[{label:'Nom',type:'info',value:s.n},{label:'Chemin',type:'info',value:s.p},{label:'Permissions SMB',id:'smb',value:s.smb},{label:'Permissions NTFS',id:'ntfs',type:'select',opts:['Read','Read+Execute','Modify','Full']}],v=>{if(v.smb)s.smb=v.smb;if(v.ntfs)s.ntfs=v.ntfs;showToast(`Partage "${s.n}" modifié`);checkTasks();rC()})}
function fsDelete(i){if(!confirm('Supprimer le partage "'+sharesList[i].n+'" ?'))return;const name=sharesList[i].n;sharesList.splice(i,1);showToast(`Partage "${name}" supprimé`);checkTasks();rC()}
function fsRefresh(){checkTasks();rC();showToast('Actualisé','info')}

// ========= PKI INTERACTIVITY =========
function pkiNew(){showDialog('Émettre un certificat',[{label:'Sujet (FQDN)',id:'subject',ph:'vpn.econocom.local'},{label:'Template',id:'template',type:'select',opts:['WebServer','DomainController','CodeSigning','SmartcardLogon']},{label:'Durée (années)',id:'years',type:'select',opts:['1','2','3']}],v=>{if(!v.subject)return;const now=new Date();const exp=new Date();exp.setFullYear(exp.getFullYear()+parseInt(v.years||1));certsList.push({s:v.subject,t:v.template||'WebServer',i:now.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}),e:exp.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}),v:'Valide'});showToast(`Certificat émis pour ${v.subject}`);checkTasks();rC()})}
function pkiRevoke(i){if(!confirm('Révoquer le certificat de "'+certsList[i].s+'" ?'))return;certsList[i].v='Révoqué';showToast(`Certificat de ${certsList[i].s} révoqué`);checkTasks();rC()}
function pkiRenew(i){const c=certsList[i];const now=new Date();const exp=new Date();exp.setFullYear(exp.getFullYear()+2);c.i=now.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});c.e=exp.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'});c.v='Valide';showToast(`Certificat de ${c.s} renouvelé`);checkTasks();rC()}
function pkiRefresh(){checkTasks();rC();showToast('Actualisé','info')}

// ========= GUI TOOLS (RPG UNLOCKABLE) =========
function logAction(msg){if(!guiState.actionsLog)guiState.actionsLog=[];const ts=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});guiState.actionsLog.unshift('['+ts+'] '+msg);if(guiState.actionsLog.length>20)guiState.actionsLog.pop();svGui()}

function toggleAdminPanel(){
const p=document.getElementById('adminPanelDiv');if(!p)return;
if(p.style.display==='none'){p.style.display='';guiState.adminPanelOpened=true;svGui();checkAllQuests();
const active=adUsers.filter(u=>u.enabled).length;const disabled=adUsers.filter(u=>!u.enabled).length;
p.innerHTML=`<h4>Panneau Admin</h4><div class="admin-stat"><span>Utilisateurs actifs</span><b>${active}</b></div><div class="admin-stat"><span>Comptes desactives</span><b>${disabled}</b></div><div class="admin-stat"><span>Groupes</span><b>${adGroups.length}</b></div><div class="admin-stat"><span>Ordinateurs</span><b>${adComputers.length}</b></div><div class="action-log"><b>Dernieres actions :</b>${(guiState.actionsLog||[]).map(a=>'<div>'+a+'</div>').join('')||'<div style="color:#999">Aucune action</div>'}</div>`;
}else{p.style.display='none'}}

function openGPOEditor(){
const gpos=gpoList.map((g,i)=>`<div class="wl-row" style="cursor:default"><div class="wl-cell" style="flex:2">${g.n}</div><div class="wl-cell">${g.l}</div><div class="wl-cell"><button class="win-tool" style="font-size:9px;padding:2px 4px" onclick="gpoEditorDelete(${i})">🗑️</button></div></div>`).join('');
showDialog('Editeur GPO — '+gpoList.length+' GPO',[{label:'',type:'info',value:'<div style="max-height:200px;overflow:auto"><div class="wl-header"><div class="wl-h" style="flex:2">Nom</div><div class="wl-h">Liaison</div><div class="wl-h">Actions</div></div>'+gpos+'</div>'}],()=>{});
}
function gpoEditorDelete(i){gpoList.splice(i,1);checkTasks();rC();closeDialog();openGPOEditor()}

function openSitesServices(){
if(!guiState.adSites)guiState.adSites=['Default-First-Site-Name'];
const sites=guiState.adSites.map(s=>'<li>'+s+'</li>').join('');
showDialog('Sites & Services AD',[{label:'Sites AD',type:'info',value:'<ul style="list-style:none;padding:4px">'+sites+'</ul>'},{label:'Nouveau site',id:'newsite',ph:'Lyon'}],v=>{
if(v.newsite&&!guiState.adSites.includes(v.newsite)){guiState.adSites.push(v.newsite);svGui();gainXP(40,'Site AD cree');checkAllQuests();showToast('Site '+v.newsite+' cree');closeDialog();openSitesServices()}});
}

function openSchemaEditor(){
guiState.schemaViewCount=(guiState.schemaViewCount||0)+1;svGui();checkAllQuests();
const attrs=[{n:'objectClass',s:'OID 2.5.4.0',desc:'Classe de l\'objet'},{n:'sAMAccountName',s:'Unicode String',desc:'Identifiant de connexion pre-2000'},{n:'userPrincipalName',s:'Unicode String',desc:'UPN (user@domain)'},{n:'member',s:'DN',desc:'Membres d\'un groupe'},{n:'memberOf',s:'DN',desc:'Groupes dont l\'objet est membre'},{n:'whenCreated',s:'Generalized Time',desc:'Date de creation'},{n:'pwdLastSet',s:'Large Integer',desc:'Dernier changement mot de passe'},{n:'servicePrincipalName',s:'Unicode String',desc:'SPN pour Kerberos'}];
showDialog('Editeur de Schema AD (Lecture seule)',[{label:'',type:'info',value:'<div style="color:#C00;font-size:10px;margin-bottom:8px;font-weight:700">Zone dangereuse — Lecture seule</div><div style="max-height:250px;overflow:auto">'+attrs.map(a=>`<div style="padding:4px 0;border-bottom:1px dotted #ccc"><b>${a.n}</b> <span style="color:#666;font-size:9px">(${a.s})</span><br><span style="font-size:9px;color:#333">${a.desc}</span></div>`).join('')+'</div>'}],()=>{});
}

// ========= AD INTERACTIVITY =========
function initGUI(m){if(!m.gui)return;const t=m.gui.type;if(t==='ad'){renderADTree();renderADDetail("Paris/Utilisateurs");document.addEventListener('click',hideCtx)}checkTasks()}
function renderADTree(){const t=document.getElementById('winTree');if(!t)return;t.innerHTML=buildTree(AD_TREE,0)}
function buildTree(n,d){const hasK=n.children&&n.children.length>0;
let h=`<div class="wt-item${guiState.selNode===n.name?' sel':''}" style="padding-left:${8+d*16}px" onclick="selNode('${n.name}')" oncontextmenu="treeCtx(event,'${n.name}','${n.type||''}')"><span style="width:12px;font-size:8px;color:#999;display:inline-block;text-align:center">${hasK?'▶':''}</span><span style="margin:0 4px">${n.ico}</span><span>${n.name}</span></div>`;
if(hasK){n.children.forEach(c=>{h+=buildTree(c,d+1)})}return h}

function ouPath(name){const map={Utilisateurs:"Paris/Utilisateurs",Postes:"Paris/Postes",Serveurs:"Paris/Serveurs",Paris:"Paris",Lyon:"Lyon",Groupes:"Groupes","Service Accounts":"Service Accounts",Builtin:"Builtin",Computers:"Computers","Domain Controllers":"Domain Controllers"};
// check for Lyon children by looking at tree context
if(name==='Utilisateurs'&&guiState.selNode==='Utilisateurs'){
  // check if it's actually under Lyon
  const lyonUsers=AD_TREE.children.find(c=>c.name==='Lyon')?.children.find(c=>c.name==='Utilisateurs');
  if(lyonUsers){}
}
return map[name]||name}

function selNode(name){guiState.selNode=name;renderADTree();renderADDetail(ouPath(name))}

function renderADDetail(ou){const d=document.getElementById('winDetail');if(!d)return;
let users=adUsers.filter(u=>u.ou===ou);let groups=adGroups.filter(g=>g.ou===ou);let comps=adComputers.filter(c=>c.ou===ou);
if(!users.length&&!groups.length&&!comps.length){users=adUsers.filter(u=>u.ou.startsWith(ou+'/'));comps=adComputers.filter(c=>c.ou.startsWith(ou+'/'));groups=adGroups.filter(g=>g.ou.startsWith(ou+'/'));}
let h=`<div class="wl-header"><div class="wl-h">Type</div><div class="wl-h" style="flex:2">Nom</div><div class="wl-h" style="flex:2">Détails</div><div class="wl-h">État</div></div>`;
users.forEach(u=>{h+=`<div class="wl-row" ondblclick="showUserProps('${u.sam}')" oncontextmenu="objCtx(event,'user','${u.sam}')"><div class="wl-cell"><span style="color:var(--win-title)">👤</span></div><div class="wl-cell" style="flex:2">${u.name} (${u.sam})</div><div class="wl-cell" style="flex:2;font-size:10px">${u.title||'—'}</div><div class="wl-cell" style="color:${u.enabled?'var(--win-success)':'var(--win-error)'}">${u.enabled?'✅ Actif':'❌ Désactivé'}</div></div>`});
groups.forEach(g=>{h+=`<div class="wl-row" ondblclick="showGroupProps('${g.name}')" oncontextmenu="objCtx(event,'group','${g.name}')"><div class="wl-cell"><span style="color:#5c2d91">👥</span></div><div class="wl-cell" style="flex:2">${g.name}</div><div class="wl-cell" style="flex:2;font-size:10px">${g.members.length} membres</div><div class="wl-cell">${g.scope}</div></div>`});
comps.forEach(c=>{h+=`<div class="wl-row"><div class="wl-cell"><span style="color:var(--win-success)">🖥️</span></div><div class="wl-cell" style="flex:2">${c.name}</div><div class="wl-cell" style="flex:2;font-size:10px">${c.os}</div><div class="wl-cell" style="font-size:10px">${c.lastLogon}</div></div>`});
if(!users.length&&!groups.length&&!comps.length)h+=`<div style="padding:20px;color:var(--win-text-dim);font-family:'Segoe UI',sans-serif;font-size:12px">Sélectionnez une OU dans l'arborescence.</div>`;
d.innerHTML=h;const s=document.getElementById('winStatus');if(s)s.textContent=`${users.length} user(s), ${groups.length} groupe(s), ${comps.length} PC(s)`}

// Context menus
function treeCtx(e,name,type){e.preventDefault();e.stopPropagation();const items=[];
if(type==='ou'){items.push({label:'👤 Nouvel utilisateur...',fn:()=>guiNewUser(ouPath(name))});items.push({label:'👥 Nouveau groupe...',fn:()=>guiNewGroup(ouPath(name))});items.push({sep:1})}
items.push({label:'🔄 Actualiser',fn:()=>guiRefresh()});showCtx(e.clientX,e.clientY,items)}

function objCtx(e,type,id){e.preventDefault();e.stopPropagation();const items=[];
if(type==='user'){items.push({label:'📋 Propriétés...',fn:()=>showUserProps(id)});
const u=adUsers.find(x=>x.sam===id);
if(u?.enabled)items.push({label:'🚫 Désactiver',fn:()=>{u.enabled=false;checkTasks();guiRefresh()}});
else if(u)items.push({label:'✅ Activer',fn:()=>{u.enabled=true;guiRefresh()}});
items.push({label:'👥 Ajouter à un groupe...',fn:()=>showAddToGroup(id)});items.push({sep:1});
items.push({label:'❌ Supprimer',fn:()=>{if(confirm('Supprimer '+id+' ?')){adUsers=adUsers.filter(x=>x.sam!==id);adGroups.forEach(g=>g.members=g.members.filter(m=>m!==id));checkTasks();guiRefresh()}}})}
if(type==='group'){items.push({label:'📋 Propriétés...',fn:()=>showGroupProps(id)});items.push({label:'👤 Ajouter membre...',fn:()=>showAddMember(id)})}
showCtx(e.clientX,e.clientY,items)}

function showCtx(x,y,items){const m=document.getElementById('ctxMenu');
m.innerHTML=items.map((it,i)=>it.sep?'<div class="ctx-sep"></div>':`<div class="ctx-item" data-i="${i}">${it.label}</div>`).join('');
m.querySelectorAll('.ctx-item').forEach(el=>{const i=parseInt(el.dataset.i);const fn=items[i]?.fn;el.onclick=()=>{m.style.display='none';if(fn)fn()}});
m.style.display='block';m.style.left=Math.min(x,innerWidth-200)+'px';m.style.top=Math.min(y,innerHeight-200)+'px'}
function hideCtx(){document.getElementById('ctxMenu').style.display='none'}

// Dialogs
function showDialog(title,fields,onOk){const r=document.getElementById('dialogRoot');
r.innerHTML=`<div class="win-dialog-overlay" onclick="if(event.target===this)closeDialog()"><div class="win-dialog"><div class="wd-title">${title}<button class="wd-close" onclick="closeDialog()">✕</button></div>
<div class="wd-body">${fields.map(f=>`<div class="wd-row"><label>${f.label}</label>${f.type==='select'?`<select id="dlg_${f.id}">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='info'?`<div class="val">${f.value}</div>`:`<input id="dlg_${f.id}" value="${f.value||''}" placeholder="${f.ph||''}">`}</div>`).join('')}</div>
<div class="wd-actions"><button class="wd-btn" onclick="closeDialog()">Annuler</button><button class="wd-btn primary" id="dlgOk">OK</button></div></div></div>`;
document.getElementById('dlgOk').onclick=()=>{const v={};fields.forEach(f=>{if(f.id){const el=document.getElementById('dlg_'+f.id);if(el)v[f.id]=el.value}});onOk(v);closeDialog()}}
function closeDialog(){document.getElementById('dialogRoot').innerHTML=''}

function guiNewUser(ou){showDialog('Nouvel utilisateur',[
{label:'Nom complet',id:'name',ph:'Jean Dupont'},{label:'Identifiant (SAM)',id:'sam',ph:'jdupont'},{label:'Fonction',id:'title',ph:'Technicien'},{label:'Email',id:'email',ph:'user@econocom.local'},
{label:'OU',id:'ou',type:'select',opts:["Paris/Utilisateurs","Lyon/Utilisateurs"]}
],v=>{if(!v.sam||!v.name)return;adUsers.push({sam:v.sam,name:v.name,ou:v.ou||ou||'Paris/Utilisateurs',enabled:true,groups:['Domain Users'],email:v.email||'',title:v.title||'',lastLogon:'Jamais'});
adGroups.find(g=>g.name==='Domain Users')?.members.push(v.sam);logAction('Compte '+v.sam+' cree dans '+(v.ou||ou||'Paris/Utilisateurs'));checkTasks();guiRefresh()})}

function guiNewGroup(ou){showDialog('Nouveau groupe',[
{label:'Nom',id:'name',ph:'DevOps'},{label:'Étendue',id:'scope',type:'select',opts:['Global','Domain Local','Universal']},{label:'Type',id:'type',type:'select',opts:['Security','Distribution']}
],v=>{if(!v.name)return;adGroups.push({name:v.name,ou:ou||'Groupes',members:[],scope:v.scope||'Global',type:v.type||'Security'});logAction('Groupe '+v.name+' cree');checkTasks();guiRefresh()})}

function showUserProps(sam){const u=adUsers.find(x=>x.sam===sam);if(!u)return;
showDialog('Propriétés — '+u.name,[
{label:'Nom',type:'info',value:u.name},{label:'SAM',type:'info',value:u.sam},{label:'Email',type:'info',value:u.email||'—'},
{label:'Fonction',type:'info',value:u.title||'—'},{label:'OU',type:'info',value:u.ou},{label:'Groupes',type:'info',value:u.groups.join(', ')},
{label:'Dernière connexion',type:'info',value:u.lastLogon},{label:'État',type:'info',value:u.enabled?'✅ Actif':'❌ Désactivé'}],()=>{})}

function showGroupProps(name){const g=adGroups.find(x=>x.name===name);if(!g)return;
showDialog('Propriétés — '+g.name,[{label:'Nom',type:'info',value:g.name},{label:'Étendue',type:'info',value:g.scope},{label:'Type',type:'info',value:g.type},{label:'Membres',type:'info',value:g.members.length?g.members.join(', '):'(aucun)'}],()=>{})}

function showAddToGroup(sam){const avail=adGroups.filter(g=>!g.members.includes(sam)).map(g=>g.name);
if(!avail.length){alert('Déjà dans tous les groupes.');return}
showDialog('Ajouter '+sam+' à un groupe',[{label:'Groupe',id:'grp',type:'select',opts:avail}],v=>{
const g=adGroups.find(x=>x.name===v.grp);if(g){g.members.push(sam);const u=adUsers.find(x=>x.sam===sam);if(u&&!u.groups.includes(v.grp))u.groups.push(v.grp);checkTasks();guiRefresh()}})}

function showAddMember(grp){const g=adGroups.find(x=>x.name===grp);if(!g)return;
const avail=adUsers.filter(u=>!g.members.includes(u.sam)).map(u=>u.sam);
if(!avail.length){alert('Tous déjà membres.');return}
showDialog('Ajouter à '+grp,[{label:'Utilisateur',id:'usr',type:'select',opts:avail}],v=>{
g.members.push(v.usr);const u=adUsers.find(x=>x.sam===v.usr);if(u&&!u.groups.includes(grp))u.groups.push(grp);checkTasks();guiRefresh()})}

function guiRefresh(){const ou=ouPath(guiState.selNode||'Paris');renderADTree();renderADDetail(ou==='econocom.local'?'Paris/Utilisateurs':ou)}

function checkTasks(){const m=M[st.cm];if(!m.gui)return;const tasks=m.objectives||guiTasks[m.gui.type]||[];
const prevCount=guiState.tasksDone.length;
tasks.forEach(tk=>{if(!guiState.tasksDone.includes(tk.id)&&tk.check()){guiState.tasksDone.push(tk.id);gainXP(40,'Objectif mission')}});
if(guiState.tasksDone.length>prevCount)svGui();
checkAllQuests();
document.querySelectorAll('.obj-item,.gui-task').forEach((el,i)=>{if(tasks[i]){const done=guiState.tasksDone.includes(tasks[i].id);
el.className=(el.classList.contains('obj-item')?'obj-item ':'gui-task ')+(done?'done success':'pending');el.innerHTML=(done?'✅':'📋')+' '+tasks[i].text}})}

// ========= INIT =========
updateXPBar();rS();sM(st.cm);
</script>

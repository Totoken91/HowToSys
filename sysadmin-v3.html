<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS://ADMIN — Formation v3</title>
<link rel="stylesheet" href="https://unpkg.com/xp.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--win-bg:#ECE9D8;--win-title:#0A246A;--win-border:#808080;--win-tree-bg:#fff;--win-tree-sel:#316AC5;
--win-text:#000;--win-text-dim:#555;--win-hover:#316AC5;--win-btn:#D4D0C8;--win-btn-hover:#B5B3A8;
--win-success:#107c10;--win-error:#d83b01;
}
html,body{height:100%;background:#3A6EA5;font-family:Tahoma,'MS Sans Serif',sans-serif;font-size:11px;overflow:hidden;color:#000}
.app{display:flex;height:100vh;padding:2px;gap:2px}

/* ─── SIDEBAR ─── */
.sidebar{width:300px;min-width:300px;display:flex;flex-direction:column;overflow:hidden}
.sidebar .title-bar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);padding:3px 4px;display:flex;align-items:center;gap:6px}
.sidebar .title-bar-text{font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px #000;letter-spacing:0.5px}
.sidebar .window-body{background:var(--win-bg);flex:1;display:flex;flex-direction:column;overflow:hidden;padding:0;margin:0}
.sidebar-stats{padding:4px 8px;background:#D4D0C8;border-bottom:1px solid #808080;font-size:10px;color:#555;display:flex;gap:12px;flex-wrap:wrap}
.sidebar-stats span{color:#0A246A;font-weight:700}
.module-list{flex:1;overflow-y:auto;padding:2px}
.module-list::-webkit-scrollbar{width:16px}
.module-list::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.module-list::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.module-list ul.tree-view{margin:0;font-size:11px}

/* Tree view module items */
.cat-header{padding:4px 6px 2px;font-size:10px;letter-spacing:1px;font-weight:700;color:#0A246A;margin-top:2px;display:flex;align-items:center;gap:6px}
.cat-header.linux{color:#0A246A}.cat-header.windows{color:#0A246A}
.cat-header::after{content:'';flex:1;height:1px;background:#808080}
.mi{padding:3px 6px;cursor:pointer;border:1px solid transparent;margin-bottom:0;display:flex;align-items:center;gap:6px;font-size:11px;color:#000}
.mi:hover{background:#316AC5;color:#fff}
.mi.active{background:#316AC5;color:#fff;border:1px dotted #D4D0C8}
.mi.win:hover{background:#316AC5;color:#fff}.mi.win.active{background:#316AC5;color:#fff}
.mi.done .mi-s{color:var(--win-success)}.mi.win.done .mi-s{color:var(--win-success)}
.mi-n{font-size:10px;color:inherit;min-width:18px;opacity:.6}
.mi-t{flex:1;color:inherit;line-height:1.3}
.mi-lv{font-size:9px;margin-left:4px;opacity:.7}.mi-lv.beginner{color:#008000}.mi-lv.intermediate{color:#808000}.mi-lv.advanced{color:#B45F06}.mi-lv.expert{color:#C00000}
.mi.active .mi-lv,.mi:hover .mi-lv{color:#fff;opacity:.8}
.mi-s{font-size:11px;color:#808080}
.mi.active .mi-n,.mi:hover .mi-n{opacity:1}

/* ─── MAIN ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-header{background:#D4D0C8;padding:0;border-bottom:1px solid #808080;display:flex;flex-direction:column}
.main-header .path-bar{padding:4px 8px;font-size:11px;color:#000;background:#fff;border:2px inset #D4D0C8;margin:4px 8px 2px}
.main-header .path-bar span{color:#808080}
.main-header.wa .path-bar{color:#000}
.path{font-size:11px;color:#000} .path span{color:#808080}
.tabs-bar{padding:0 4px}
.tabs{display:flex;gap:0;padding:0}
.tab{padding:4px 16px;font-size:11px;cursor:pointer;color:#000;border:1px solid #808080;border-bottom:none;background:#D4D0C8;font-family:Tahoma,sans-serif;margin-right:-1px;position:relative}
.tab:hover{background:#ECE9D8}
.tab.active{background:#ECE9D8;font-weight:700;z-index:1;border-bottom:1px solid #ECE9D8;margin-bottom:-1px}
.wa .tab.active{background:#ECE9D8}
.content{flex:1;overflow-y:auto;padding:12px 16px;background:#ECE9D8;border-top:1px solid #808080}
.content::-webkit-scrollbar{width:16px}
.content::-webkit-scrollbar-track{background:#D4D0C8;border-left:1px solid #fff;border-right:1px solid #808080}
.content::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

/* ─── COURSE ─── */
.course h2{color:#0A246A;font-size:14px;margin-bottom:10px;font-weight:700;text-shadow:none}
.course.w h2{color:#0A246A}
.course h3{color:#000;font-size:12px;margin:14px 0 6px;font-weight:700}
.course p{line-height:1.6;margin-bottom:8px;font-size:11px}
.course code{background:#F0F0F0;color:#000;padding:1px 4px;border:1px solid #C0C0C0;font-family:'Courier New',monospace;font-size:11px}
.course.w code{background:#F0F0F0;color:#000}
.course pre{background:#F0F0F0;border:2px inset #D4D0C8;padding:8px;margin:8px 0;overflow-x:auto;line-height:1.5;font-size:11px;font-family:'Courier New',monospace}
.course pre code{background:none;border:none;padding:0}
.course .tip{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#E8F4F8;font-size:11px}
.course .warn{border:2px inset #D4D0C8;padding:8px 10px;margin:10px 0;background:#FFFACD;font-size:11px}
.course ul{margin:6px 0 6px 18px;line-height:1.8;font-size:11px}
.course ul li::marker{color:#0A246A}.course.w ul li::marker{color:#0A246A}

.mark-read{margin-top:16px;padding:4px 16px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.mark-read:hover{background:#B5B3A8}.mark-read:active{border-style:inset}
.mark-read.done{color:#808080;cursor:default}
.mark-read.wb{background:#D4D0C8;border:2px outset #D4D0C8;color:#000}.mark-read.wb:hover{background:#B5B3A8}

/* ─── QUIZ ─── */
.qq{margin-bottom:14px;padding:10px;border:2px inset #D4D0C8;background:#fff}
.qq .qn{font-size:10px;color:#808080;margin-bottom:4px}
.qq .qt{color:#000;margin-bottom:10px;line-height:1.5;font-size:11px}
.qo{display:block;width:100%;text-align:left;padding:4px 10px;margin-bottom:2px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;font-size:11px;cursor:pointer}
.qo:hover:not(:disabled){background:#B5B3A8}
.qo:active:not(:disabled){border-style:inset}
.qo.c{background:#DFF0D8;border:2px solid #5CB85C;color:#000}
.qo.x{background:#F2DEDE;border:2px solid #D9534F;color:#000}
.qo:disabled{cursor:default;color:#808080}
.qe{margin-top:4px;padding:4px 8px;font-size:10px;color:#555;border-left:3px solid #0A246A;display:none}.qe.s{display:block}
.qs{text-align:center;padding:20px;font-size:12px;color:#0A246A}
.qs .big{font-size:36px;font-weight:700;display:block;margin:6px 0;text-shadow:none}
.qs.wb{color:#0A246A}.qs.wb .big{text-shadow:none}
.qr{margin-top:10px;padding:4px 18px;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;font-family:Tahoma,sans-serif;cursor:pointer;font-size:11px}
.qr:hover{background:#B5B3A8}.qr:active{border-style:inset}
.qr.wb{border:2px outset #D4D0C8;color:#000}.qr.wb:hover{background:#B5B3A8}

/* ─── TERMINAL ─── */
.terminal{border:2px inset #D4D0C8;overflow:hidden;height:100%;display:flex;flex-direction:column;background:#000}
.terminal.w{background:#012456}
.tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);padding:3px 8px;display:flex;align-items:center;gap:6px;font-size:11px;color:#fff;font-weight:700;text-shadow:1px 1px #000}
.terminal.w .tb{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%)}
.td{display:flex;gap:2px;margin-right:4px}
.tdo{width:14px;height:14px;display:none}
.tby{flex:1;padding:8px;overflow-y:auto;font-size:11px;line-height:1.6;font-family:'Courier New',monospace;color:#C0C0C0;background:#000}
.terminal.w .tby{background:#012456;color:#EEEDF0}
.tby::-webkit-scrollbar{width:16px}.tby::-webkit-scrollbar-track{background:#000}.tby::-webkit-scrollbar-thumb{background:#808080}
.tl{margin-bottom:1px}.tl .pr{color:#C0C0C0;font-weight:700}
.terminal.w .tl .pr{color:#EEEDF0}
.tl .cm{color:#fff}.tl .ou{color:#C0C0C0}.tl .ok{color:#00ff00}.terminal.w .tl .ok{color:#00ff00}.tl .er{color:#ff0000}
.ti{padding:6px 8px;margin-bottom:6px;background:#ECE9D8;border:2px inset #D4D0C8;color:#000;font-size:11px;line-height:1.4;font-family:Tahoma,sans-serif}
.ti .sn{color:#0A246A;font-size:10px;display:block;margin-bottom:2px;font-weight:700}
.th{font-size:10px;color:#808080;margin-top:2px;cursor:pointer;font-family:Tahoma,sans-serif}.th:hover{color:#0A246A}
.til{display:flex;align-items:center;gap:0;padding:2px 8px 8px;background:#000;font-family:'Courier New',monospace}
.terminal.w .til{background:#012456}
.til .pr{color:#C0C0C0;white-space:nowrap;font-size:11px;font-weight:700}
.terminal.w .til .pr{color:#EEEDF0}
.tinp{flex:1;background:none;border:none;color:#fff;font-family:'Courier New',monospace;font-size:11px;outline:none;caret-color:#C0C0C0;padding-left:3px}
.terminal.w .tinp{caret-color:#EEEDF0}

.lc{text-align:center;padding:20px;color:#0A246A;font-family:Tahoma,sans-serif}
.lc .big{font-size:18px;font-weight:700;margin-bottom:6px;text-shadow:none}
.terminal.w .lc{color:#0A246A}.terminal.w .lc .big{text-shadow:none}

.lab-toggle{display:flex;gap:2px;margin-bottom:8px}
.lt-btn{padding:4px 14px;font-size:11px;cursor:pointer;color:#000;border:2px outset #D4D0C8;background:#D4D0C8;font-family:Tahoma,sans-serif}
.lt-btn:hover{background:#B5B3A8}
.lt-btn.active{border-style:inset;background:#ECE9D8;font-weight:700}

/* ─── WIN SIMULATION (GUI AD etc.) ─── */
.win-sim{height:100%;display:flex;flex-direction:column;font-family:Tahoma,sans-serif;font-size:11px;color:#000;overflow:hidden;border:2px outset #D4D0C8}
.win-titlebar{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%,#0A246A 100%);color:#fff;padding:3px 6px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;user-select:none;flex-shrink:0;text-shadow:1px 1px #000}
.win-titlebar .ico{text-shadow:none}
.win-titlebar .spacer{flex:1}
.win-btns{display:flex;gap:2px}
.win-btn{width:21px;height:21px;display:flex;align-items:center;justify-content:center;background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:10px;font-weight:400;text-shadow:none;padding:0}
.win-btn:active{border-style:inset}
.win-btn.close:hover{background:#D4D0C8}

.win-toolbar{background:#D4D0C8;border-bottom:1px solid #808080;padding:2px 4px;display:flex;gap:2px;flex-wrap:wrap;flex-shrink:0}
.win-tool{padding:2px 8px;font-size:10px;background:#D4D0C8;border:1px solid transparent;cursor:pointer;font-family:Tahoma,sans-serif;color:#000}
.win-tool:hover{border:1px outset #D4D0C8;background:#ECE9D8}
.win-tool.active{border:1px inset #808080;background:#ECE9D8}

.win-body{flex:1;display:flex;overflow:hidden;background:#fff}
.win-tree{width:220px;min-width:180px;background:#fff;border-right:1px solid #808080;overflow-y:auto;padding:2px 0}
.win-tree::-webkit-scrollbar{width:16px}
.win-tree::-webkit-scrollbar-track{background:#D4D0C8}
.win-tree::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}
.wt-item{padding:2px 6px;cursor:pointer;display:flex;align-items:center;gap:3px;font-size:11px;user-select:none;white-space:nowrap}
.wt-item:hover{background:#316AC5;color:#fff}
.wt-item.sel{background:#316AC5;color:#fff}

.win-detail{flex:1;overflow-y:auto;background:#fff}
.win-detail::-webkit-scrollbar{width:16px}
.win-detail::-webkit-scrollbar-track{background:#D4D0C8}
.win-detail::-webkit-scrollbar-thumb{background:#D4D0C8;border:1px outset #D4D0C8}

.wl-header{display:flex;background:#D4D0C8;border-bottom:1px solid #808080;position:sticky;top:0;z-index:2}
.wl-h{flex:1;padding:3px 6px;font-size:10px;font-weight:700;color:#000;border-right:1px solid #fff;border-left:1px solid #808080;text-transform:uppercase;background:#D4D0C8;border-top:1px solid #fff;border-bottom:1px solid #808080}
.wl-row{display:flex;border-bottom:1px solid #ECE9D8;cursor:pointer}
.wl-row:nth-child(even){background:#F5F5F5}
.wl-row:hover{background:#316AC5;color:#fff}
.wl-cell{flex:1;padding:2px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid #ECE9D8}

.win-status{background:#D4D0C8;border-top:1px solid #fff;padding:2px 8px;font-size:10px;color:#000;display:flex;justify-content:space-between;flex-shrink:0;border:1px inset #D4D0C8}

/* ─── CONTEXT MENU ─── */
.ctx-menu{position:fixed;background:#fff;border:1px solid #808080;box-shadow:2px 2px 4px rgba(0,0,0,.3);padding:2px 0;z-index:100000;min-width:180px;font-family:Tahoma,sans-serif;font-size:11px}
.ctx-item{padding:4px 20px 4px 8px;cursor:pointer;color:#000}
.ctx-item:hover{background:#316AC5;color:#fff}
.ctx-sep{height:1px;background:#808080;margin:2px 0}

/* ─── DIALOGS ─── */
.win-dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100001;display:flex;align-items:center;justify-content:center}
.win-dialog{background:#ECE9D8;border:2px outset #D4D0C8;width:380px;font-family:Tahoma,sans-serif;box-shadow:4px 4px 8px rgba(0,0,0,.4)}
.wd-title{background:linear-gradient(180deg,#0A246A 0%,#3A6EA5 8%,#0A246A 90%);color:#fff;padding:3px 8px;font-size:11px;font-weight:700;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px #000}
.wd-close{background:#D4D0C8;border:2px outset #D4D0C8;color:#000;cursor:pointer;font-size:11px;width:21px;height:21px;display:flex;align-items:center;justify-content:center;text-shadow:none}
.wd-close:active{border-style:inset}
.wd-body{padding:12px}
.wd-row{margin-bottom:8px}
.wd-row label{display:block;font-size:10px;color:#000;margin-bottom:2px;font-weight:700}
.wd-row input,.wd-row select{width:100%;padding:3px 4px;border:2px inset #D4D0C8;font-family:Tahoma,sans-serif;font-size:11px;background:#fff}
.wd-row input:focus,.wd-row select:focus{outline:1px dotted #000}
.wd-row .val{font-size:11px;padding:2px 0}
.wd-actions{padding:8px 12px;background:#ECE9D8;border-top:1px solid #808080;display:flex;justify-content:flex-end;gap:6px}
.wd-btn{padding:3px 16px;border:2px outset #D4D0C8;background:#D4D0C8;cursor:pointer;font-family:Tahoma,sans-serif;font-size:11px}
.wd-btn:hover{background:#B5B3A8}.wd-btn:active{border-style:inset}
.wd-btn.primary{background:#D4D0C8;color:#000;border:2px outset #D4D0C8;font-weight:700}
.wd-btn.primary:hover{background:#B5B3A8}

/* ─── GUI TASKS ─── */
.gui-task{padding:4px 8px;margin:2px 4px;font-size:10px;display:flex;align-items:center;gap:4px;font-family:Tahoma,sans-serif}
.gui-task.pending{background:#FFFACD;border:1px solid #808080;color:#000}
.gui-task.success{background:#DFF0D8;border:1px solid #808080;color:#000}

/* ─── INCIDENT CARD ─── */
.incident-card{border:2px inset #D4D0C8;padding:10px 12px;margin-bottom:12px;font-family:Tahoma,sans-serif}
.incident-card[data-priority="BASSE"]{background:#F0F7F0}
.incident-card[data-priority="NORMALE"]{background:#F0F0F7}
.incident-card[data-priority="HAUTE"]{background:#FFF7E6}
.incident-card[data-priority="CRITIQUE"]{background:#FFF0F0}
.incident-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.incident-type{font-size:9px;font-weight:700;text-transform:uppercase;color:#0A246A;background:#D4D0C8;padding:1px 6px;border:1px outset #D4D0C8}
.incident-priority{font-size:9px;font-weight:700}
.incident-priority.BASSE{color:#107c10}.incident-priority.NORMALE{color:#0A246A}
.incident-priority.HAUTE{color:#B45F06}.incident-priority.CRITIQUE{color:#C0392B}
.incident-from{font-size:9px;color:#666;margin:4px 0}
.incident-msg{font-size:11px;font-style:italic;color:#333;line-height:1.5}

/* ─── OBJECTIVES PANEL ─── */
.objectives-panel{border:2px inset #D4D0C8;background:#F5F5F5;padding:8px;margin-bottom:8px;font-family:Tahoma,sans-serif}
.obj-title{font-size:10px;font-weight:700;color:#0A246A;margin-bottom:6px}
.obj-item{padding:3px 6px;font-size:10px;display:flex;align-items:center;gap:4px}
.obj-item.pending{color:#555}.obj-item.done{color:#107c10}

/* ─── LOCKED MODULE ─── */
.mi.locked{opacity:.5;cursor:default}
.mi.locked:hover{background:transparent;color:#000}

/* ─── XP PANEL ─── */
.xp-panel{padding:8px 12px;border-top:1px solid #C0C0C0;font-family:Tahoma,sans-serif}
.xp-header{display:flex;justify-content:space-between;font-size:10px;font-weight:700}
.xp-level{color:#666}
.xp-bar-track{height:12px;background:#C0C0C0;border:1px inset #808080;margin:4px 0}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,#316AC5,#5B9BD5);transition:width .5s ease;max-width:100%}
.xp-sub{font-size:9px;color:#666;text-align:right}

/* ─── LEVEL UP MODAL ─── */
.levelup-window{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-20px);z-index:200000;width:360px;font-family:Tahoma,sans-serif;animation:levelUpIn .3s ease forwards}
@keyframes levelUpIn{from{transform:translate(-50%,-50%) translateY(-20px);opacity:0}to{transform:translate(-50%,-50%) translateY(0);opacity:1}}
.levelup-body{padding:16px;text-align:center;background:#ECE9D8}
.levelup-title{font-size:18px;font-weight:700;margin:8px 0}
.levelup-sub{font-size:11px;color:#666;margin-bottom:12px}
.levelup-rewards{text-align:left;font-size:10px;background:#fff;border:1px inset #808080;padding:8px;margin:8px 0;max-height:120px;overflow-y:auto}
.levelup-rewards div{padding:2px 0}

/* ─── QUEST TAB ─── */
.quest-panel{padding:12px}
.quest-item{border:2px inset #D4D0C8;padding:8px;margin-bottom:6px;background:#fff;font-family:Tahoma,sans-serif}
.quest-item.completed{background:#DFF0D8;opacity:.7}
.quest-item .quest-title{font-size:11px;font-weight:700;color:#0A246A}
.quest-item .quest-desc{font-size:10px;color:#333;margin:4px 0}
.quest-item .quest-reward{font-size:9px;color:#666}
.badge-chip{display:inline-block;padding:2px 8px;border:1px inset #D4D0C8;background:#ECE9D8;font-size:9px;font-family:Tahoma,sans-serif;margin:2px}

/* ─── LOCKED CMD ─── */
.cmd-panel{border:2px inset #D4D0C8;background:#F5F5F5;padding:6px 8px;margin-top:6px;font-family:Tahoma,sans-serif}
.cmd-panel-header{font-size:10px;font-weight:700;color:#0A246A;cursor:pointer}
.cmd-badge{display:inline-block;padding:1px 6px;border:1px solid #C0C0C0;background:#ECE9D8;font-size:9px;font-family:'Courier New',monospace;margin:2px}

/* ─── ADMIN PANEL ─── */
.admin-panel{width:280px;border-left:2px inset #D4D0C8;background:#ECE9D8;padding:8px;overflow-y:auto;font-family:Tahoma,sans-serif;font-size:10px}
.admin-panel h4{font-size:11px;color:#0A246A;margin:0 0 6px}
.admin-stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #D4D0C8}
.action-log{font-size:9px;color:#333;margin-top:8px;max-height:120px;overflow-y:auto}
.action-log div{padding:2px 0;border-bottom:1px dotted #D4D0C8}

/* ─── UNLOCK TOAST ─── */
.unlock-toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;background:#FFFACD;border:1px solid #CCC;font-family:Tahoma,sans-serif;font-size:11px;color:#333;z-index:10000;box-shadow:2px 2px 6px rgba(0,0,0,.2)}

.fade-up{animation:none}
@media(max-width:800px){.sidebar{width:250px;min-width:250px}}
@media(max-width:600px){.app{flex-direction:column}.sidebar{width:100%;min-width:auto;max-height:45vh}.content{padding:8px}}
</style>
</head>

{id:0,slug:"prise-de-poste",title:"Prise de poste",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"RH - Christine Morel",message:"Bienvenue ! Votre accès admin vient d\'être créé. Explorez le domaine ECONOCOM.LOCAL et familiarisez-vous avec l\'arborescence avant votre réunion de demain.",priority:"BASSE"},course:'<h2>Structure Active Directory — Votre premier jour</h2><p>Imaginez une immense <strong>bibliothèque d\'entreprise</strong>. Chaque employé a une fiche, chaque ordinateur a une étiquette, chaque imprimante a un numéro. Cette bibliothèque, c\'est <strong>Active Directory</strong> (AD).</p><p>AD est l\'annuaire centralisé de Microsoft Windows Server. Son rôle ? <strong>Savoir qui a le droit de faire quoi, où, et quand.</strong> Chaque fois qu\'un employé se connecte à son PC le matin, c\'est AD qui vérifie son mot de passe, qui lui donne accès à ses fichiers, et qui applique les règles de sécurité.</p><h3>🏢 L\'analogie de l\'immeuble</h3><p>Pensez à AD comme un <strong>immeuble de bureaux</strong> :</p><ul><li><strong>Le domaine</strong> (econocom.local) = l\'immeuble entier. C\'est le périmètre de sécurité — tout ce qui est dedans est géré ensemble.</li><li><strong>Le Domain Controller (DC)</strong> = le gardien à l\'entrée. C\'est le serveur qui héberge la base AD et qui valide chaque connexion. Sans lui, personne n\'entre.</li><li><strong>Les OUs (Organizational Units)</strong> = les étages et les bureaux. Ce sont des dossiers pour organiser les objets. Ex: l\'OU \"Paris\" contient les employés parisiens.</li><li><strong>Les objets</strong> = les gens, les meubles, les équipements. Users (comptes), Groups (équipes), Computers (postes), GPO (règles).</li></ul><h3>🌳 L\'arborescence — comment c\'est organisé</h3><p>AD est structuré en arbre. Voici à quoi ressemble notre domaine :</p><pre><code>econocom.local              ← Le domaine (racine de l\'arbre)\n├── Paris                    ← OU géographique\n│   ├── Utilisateurs         ← Les comptes des employés parisiens\n│   ├── Postes               ← Les PCs de Paris\n│   └── Serveurs             ← Les serveurs hébergés à Paris\n├── Lyon                     ← OU géographique\n│   ├── Utilisateurs\n│   └── Postes\n├── Groupes                  ← Les groupes de sécurité\n└── Service Accounts         ← Comptes techniques (pas des humains)</code></pre><p>Pourquoi cette structure ? Parce qu\'elle permet d\'<strong>appliquer des règles différentes par site</strong>. Les employés de Paris peuvent avoir des imprimantes différentes de ceux de Lyon, par exemple.</p><h3>🔤 Le vocabulaire essentiel</h3><ul><li><strong>Forêt (Forest)</strong> — Le niveau le plus haut. Une forêt peut contenir plusieurs domaines. Ici, on a une forêt simple avec un seul domaine.</li><li><strong>LDAP</strong> — Le protocole utilisé par AD pour communiquer. C\'est le \"langage\" qu\'on parle pour interroger l\'annuaire. Retenez ce nom, il reviendra souvent.</li><li><strong>DN (Distinguished Name)</strong> — L\'adresse complète d\'un objet. Ex: <code>CN=Jean Dupont,OU=Utilisateurs,OU=Paris,DC=econocom,DC=local</code>. C\'est comme une adresse postale, du plus précis au plus large.</li><li><strong>SamAccountName</strong> — Le nom de connexion court (ex: jdupont). C\'est ce que l\'utilisateur tape pour se connecter.</li></ul><h3>⌨️ Vos premières commandes PowerShell</h3><p>Pour interagir avec AD, on utilise PowerShell avec le module ActiveDirectory. Voici les commandes de base :</p><pre><code># Étape 1 : Charger le module (obligatoire !)\nImport-Module ActiveDirectory\n\n# Voir les infos générales du domaine\nGet-ADDomain\n\n# Lister toutes les OUs (les \"dossiers\")\nGet-ADOrganizationalUnit -Filter *\n\n# Lister tous les utilisateurs avec leur login\nGet-ADUser -Filter * | Select Name,SamAccountName</code></pre><div class="tip">💡 <strong>Import-Module ActiveDirectory</strong> doit être lancé en premier à chaque session PowerShell. Sans ça, les commandes Get-AD* n\'existeront pas et vous aurez une erreur.</div><div class="warn">⚠️ <strong>Get-ADUser -Filter *</strong> ramène TOUS les utilisateurs du domaine. Sur un gros domaine (10 000+ comptes), ça peut être très lent. En production, on filtre toujours.</div>',objectives:[{id:"obj0a",text:"Explorer l\'arborescence AD",check:()=>guiState.selNode!==null},{id:"obj0b",text:"Cliquer sur l\'OU Utilisateurs",check:()=>guiState.selNode==='Utilisateurs'||guiState.tasksDone.includes('obj0b')},{id:"obj0c",text:"Consulter les propriétés d\'un utilisateur (double-clic)",check:()=>guiState.tasksDone.includes('obj0c')}],quiz:[{q:"Que signifie OU ?",o:["Operating Unit","Organizational Unit","Object User","Outer Unit"],c:1,e:"Organizational Unit — conteneur d\'organisation."},{q:"Quel protocole utilise AD ?",o:["HTTP","FTP","LDAP","SMTP"],c:2,e:"LDAP (Lightweight Directory Access Protocol)."},{q:"Qu\'est-ce qu\'un DC ?",o:["Un firewall","Un serveur hébergeant l\'AD","Un switch","Un serveur DHCP"],c:1,e:"Domain Controller = serveur AD."},{q:"Quel cmdlet liste les OUs ?",o:["Get-OU","Get-ADOrganizationalUnit -Filter *","List-OU","Get-ADObject"],c:1,e:"Get-ADOrganizationalUnit -Filter *"},{q:"Que contient un domaine AD ?",o:["Uniquement des PCs","Users, Groups, Computers, GPO","Seulement des fichiers","Des VMs"],c:1,e:"Tous les objets de l\'annuaire."}],lab:[{i:"Importe le module Active Directory",x:["Import-Module ActiveDirectory"],o:"Module ActiveDirectory chargé.",h:"Import-Module"},{i:"Affiche les infos du domaine",x:["Get-ADDomain"],o:"Forest: econocom.local\nDomainMode: Windows2016Domain\nPDCEmulator: SRV-DC01",h:"Get-ADDomain"},{i:"Liste toutes les OUs",x:["Get-ADOrganizationalUnit -Filter *"],o:"OU=Paris,DC=econocom,DC=local\nOU=Lyon,DC=econocom,DC=local\nOU=Groupes,DC=econocom,DC=local",h:"Get-ADOrganizationalUnit -Filter *"},{i:"Liste tous les utilisateurs",x:["Get-ADUser -Filter *"],o:"administrator True\njdupont True\nmmartin True\npdurand True\ntest.user False",h:"Get-ADUser -Filter *"},{i:"Liste tous les groupes",x:["Get-ADGroup -Filter *"],o:"IT-Support Global Security\nRH Global Security\nDomain Users Global Security\nDomain Admins Global Security",h:"Get-ADGroup -Filter *"}]},
{id:1,slug:"premier-utilisateur",title:"Premier utilisateur",level:"beginner",lv:"DÉBUTANT",os:"windows",gui:{type:"ad"},incident:{type:"TICKET",from:"Manager - Julien Faure",message:"Nouvelle recrue lundi : Sophie Lambert, Comptable, rattachée à Paris/Utilisateurs. Merci de créer son compte et son accès réseau.",priority:"NORMALE"},course:'<h2>Créer un utilisateur AD — Votre première mission</h2><p>Créer un compte utilisateur, c\'est comme <strong>donner un badge d\'accès à un nouvel employé</strong>. Sans ce badge, impossible d\'entrer dans le bâtiment, d\'ouvrir les portes, d\'utiliser l\'ascenseur. Dans le monde informatique, ce \"badge\" c\'est le <strong>compte Active Directory</strong>.</p><h3>🎯 Pourquoi c\'est important</h3><p>Quand quelqu\'un arrive dans l\'entreprise, il ne peut <strong>rien faire</strong> sans son compte AD :</p><ul><li>Pas de connexion au PC</li><li>Pas d\'accès aux fichiers partagés</li><li>Pas d\'email</li><li>Pas d\'accès aux applications métier</li></ul><p>C\'est souvent la <strong>première tâche</strong> qu\'on confie à un admin junior. Faites-la bien !</p><h3>📋 Les conventions de nommage</h3><p>Chaque entreprise a ses règles. Chez nous :</p><ul><li><strong>SamAccountName</strong> — Le login court : <code>prenom.nom</code> (ex: <code>sophie.lambert</code>). C\'est ce que l\'utilisateur tapera chaque matin.</li><li><strong>UPN (User Principal Name)</strong> — Le login \"email-like\" : <code>sophie.lambert@econocom.local</code>. Utilisé pour les connexions modernes (Office 365, VPN...).</li><li><strong>DisplayName</strong> — Le nom affiché : <code>Sophie Lambert</code>. C\'est ce qui apparaît dans l\'annuaire, les mails, etc.</li></ul><div class="tip">💡 <strong>Pourquoi des conventions ?</strong> Imaginez 500 employés avec des logins comme \"soph92\", \"SLambert\", \"sophie_l\"... Impossible de s\'y retrouver. Une convention stricte = un annuaire propre.</div><h3>⌨️ La commande New-ADUser</h3><p>C\'est LA commande à connaître. Décortiquons chaque paramètre :</p><pre><code>New-ADUser -Name "Sophie Lambert" `\n  -SamAccountName sophie.lambert `\n  -UserPrincipalName sophie.lambert@econocom.local `\n  -Path "OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" `\n  -AccountPassword (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force) `\n  -Enabled $true</code></pre><p>Expliquons chaque ligne :</p><ul><li><strong>-Name</strong> — Le nom complet affiché dans AD (le \"CN\" ou Common Name)</li><li><strong>-SamAccountName</strong> — Le login court (obligatoire, unique dans le domaine)</li><li><strong>-UserPrincipalName</strong> — Le login au format email</li><li><strong>-Path</strong> — L\'OU de destination. C\'est l\'adresse du \"dossier\" où ranger le compte. Ici on le met dans Paris → Utilisateurs.</li><li><strong>-AccountPassword</strong> — Le mot de passe initial. <code>ConvertTo-SecureString</code> est obligatoire car PowerShell refuse les mots de passe en clair.</li><li><strong>-Enabled $true</strong> — Active le compte immédiatement. <strong>CRITIQUE : sans ce paramètre, le compte est créé mais désactivé !</strong></li></ul><h3>🔓 Activer / Désactiver un compte</h3><p>Un compte peut être dans deux états :</p><ul><li><strong>Enabled (activé)</strong> — L\'utilisateur peut se connecter</li><li><strong>Disabled (désactivé)</strong> — Le compte existe mais la connexion est refusée</li></ul><pre><code># Activer un compte désactivé\nEnable-ADAccount -Identity sophie.lambert\n\n# Désactiver un compte (ex: départ temporaire)\nDisable-ADAccount -Identity sophie.lambert</code></pre><h3>✏️ Modifier les propriétés après création</h3><p>On a souvent besoin d\'ajouter des infos après coup (titre, département, téléphone...) :</p><pre><code># Ajouter le poste et le département\nSet-ADUser sophie.lambert -Title "Comptable" -Department "Finance"\n\n# Vérifier le résultat\nGet-ADUser sophie.lambert -Properties Title,Department</code></pre><div class="warn">⚠️ <strong>Piège classique du débutant :</strong> créer un utilisateur sans <code>-Enabled $true</code>, puis se demander pourquoi il ne peut pas se connecter. Le compte est désactivé par défaut — c\'est une sécurité de Microsoft.</div><div class="tip">💡 <strong>Astuce pro :</strong> Après la création, vérifiez toujours avec <code>Get-ADUser sophie.lambert</code> que le compte existe et est actif. C\'est un réflexe à prendre.</div>',objectives:[{id:"obj1a",text:"Créer sophie.lambert dans Paris/Utilisateurs",check:()=>adUsers.some(u=>u.sam==='sophie.lambert')},{id:"obj1b",text:"Activer le compte sophie.lambert",check:()=>{const u=adUsers.find(x=>x.sam==='sophie.lambert');return u&&u.enabled}},{id:"obj1c",text:"Vérifier que sophie.lambert est dans Domain Users",check:()=>adGroups.find(g=>g.name==='Domain Users')?.members.includes('sophie.lambert')}],quiz:[{q:"Cmdlet pour créer un utilisateur ?",o:["Add-ADUser","New-ADUser","Create-ADUser","Set-ADUser"],c:1,e:"New-ADUser."},{q:"Compte désactivé par défaut si ?",o:["-Enabled manquant","Mot de passe faible","OU incorrecte","Groupe manquant"],c:0,e:"Sans -Enabled $true, le compte est disabled."},{q:"SamAccountName de Sophie Lambert ?",o:["slambert","sophie.lambert","Sophie.Lambert","s.lambert"],c:1,e:"Convention : prenom.nom en minuscules."},{q:"Activer un compte désactivé ?",o:["Set-ADUser -Active","Enable-ADAccount","Unlock-ADAccount","Start-ADAccount"],c:1,e:"Enable-ADAccount."},{q:"-Path dans New-ADUser ?",o:["Chemin fichier","OU de destination","Domaine","Mot de passe"],c:1,e:"L\'OU où placer l\'objet."}],lab:[{i:"Crée le compte sophie.lambert",x:['New-ADUser -Name "Sophie Lambert" -SamAccountName sophie.lambert -Path "OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" -AccountPassword (ConvertTo-SecureString "P@ssw0rd!" -AsPlainText -Force) -Enabled $true'],o:"Utilisateur sophie.lambert créé.",h:'New-ADUser -Name "Sophie Lambert" -SamAccountName sophie.lambert ...'},{i:"Vérifie que le compte existe",x:["Get-ADUser sophie.lambert"],o:"sophie.lambert True Sophie Lambert",h:"Get-ADUser sophie.lambert"},{i:"Ajoute le titre Comptable",x:['Set-ADUser sophie.lambert -Title "Comptable"'],o:"",h:'Set-ADUser sophie.lambert -Title "Comptable"'},{i:"Active le compte (si nécessaire)",x:["Enable-ADAccount sophie.lambert","Enable-ADAccount -Identity sophie.lambert"],o:"",h:"Enable-ADAccount"},{i:"Affiche toutes les propriétés",x:["Get-ADUser sophie.lambert -Properties *"],o:"Name: Sophie Lambert\nSAM: sophie.lambert\nEnabled: True\nTitle: Comptable",h:"Get-ADUser ... -Properties *"}]},
{id:2,slug:"comptes-oublies",title:"Comptes oubliés",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"AUDIT",from:"RSSI - Marc Petit",message:"Audit sécurité : des comptes inactifs depuis 90 jours ont été détectés. Identifiez-les et désactivez-les immédiatement.",priority:"HAUTE"},course:'<h2>Comptes oubliés — La chasse aux fantômes</h2><p>Imaginez un immeuble de bureaux où des <strong>badges d\'accès traînent sur des bureaux vides</strong>. L\'employé est parti depuis 6 mois, mais son badge ouvre encore toutes les portes. Un cambrioleur n\'a qu\'à le ramasser... C\'est exactement le problème des <strong>comptes inactifs dans Active Directory</strong>.</p><h3>🚨 Pourquoi c\'est un vrai danger</h3><p>Un compte inactif est une <strong>porte d\'entrée invisible</strong> pour un attaquant :</p><ul><li><strong>Personne ne surveille</strong> — Si quelqu\'un se connecte avec le compte de \"test.user\" parti il y a 6 mois, qui va s\'en apercevoir ?</li><li><strong>Mot de passe souvent faible</strong> — Les comptes de test ou temporaires ont rarement des mots de passe robustes</li><li><strong>Accès encore valides</strong> — Le compte a peut-être encore accès à des partages réseau, des bases de données...</li></ul><p>C\'est pour ça que les <strong>audits de sécurité</strong> (ISO 27001, SOC2) demandent toujours : \"Avez-vous des comptes inactifs ?\"</p><h3>🔍 Comment trouver les comptes inactifs</h3><p>AD enregistre la date de dernière connexion de chaque compte. On peut l\'interroger :</p><pre><code># Méthode 1 : La plus simple — comptes inactifs depuis 90 jours\nSearch-ADAccount -AccountInactive -TimeSpan 90.00:00:00</code></pre><p><code>TimeSpan 90.00:00:00</code> signifie \"90 jours, 0 heures, 0 minutes, 0 secondes\". C\'est le format .NET pour exprimer une durée.</p><pre><code># Méthode 2 : Trouver les comptes JAMAIS connectés\nGet-ADUser -Filter * -Properties LastLogonDate | \n  Where-Object {$_.LastLogonDate -eq $null}</code></pre><p>Un <code>LastLogonDate</code> à <code>$null</code> (vide) signifie que le compte n\'a <strong>jamais été utilisé</strong>. C\'est souvent des comptes de test oubliés ou des comptes créés à l\'avance pour des employés qui ne sont jamais venus.</p><pre><code># Méthode 3 : Comptes non connectés depuis plus de 90 jours\nGet-ADUser -Filter * -Properties LastLogonDate | \n  Where-Object {$_.LastLogonDate -lt (Get-Date).AddDays(-90)}</code></pre><p>Ici, <code>(Get-Date).AddDays(-90)</code> calcule la date d\'il y a 90 jours. On compare avec <code>-lt</code> (less than = inférieur à).</p><h3>🔒 Désactiver ≠ Supprimer</h3><p>C\'est une distinction <strong>fondamentale</strong> :</p><ul><li><strong>Désactiver</strong> (Disable) — Le compte existe encore, mais la connexion est bloquée. <strong>C\'est réversible</strong> : on peut le réactiver en 2 secondes.</li><li><strong>Supprimer</strong> (Remove) — Le compte disparaît. <strong>C\'est irréversible</strong> : même si on recrée un compte avec le même nom, il aura un SID différent et aura perdu tous ses accès.</li></ul><pre><code># Désactiver un compte (TOUJOURS faire ça en premier)\nDisable-ADAccount -Identity test.user\n\n# Vérifier que c\'est bien désactivé\nGet-ADUser test.user -Properties Enabled</code></pre><div class="warn">⚠️ <strong>Règle d\'or : désactiver d\'abord, supprimer plus tard.</strong> Ne supprimez jamais un compte sans validation RH et sans respecter le délai légal (RGPD : les données doivent pouvoir être conservées pour les obligations légales).</div><h3>📋 Lister les comptes déjà désactivés</h3><pre><code># Voir tous les comptes désactivés du domaine\nSearch-ADAccount -AccountDisabled</code></pre><p>C\'est utile pour faire un état des lieux : combien de comptes \"fantômes\" traînent dans votre AD ?</p><div class="tip">💡 <strong>Bonne pratique :</strong> Planifiez un audit des comptes inactifs <strong>une fois par mois</strong>. Un script PowerShell automatisé qui envoie un rapport par mail, c\'est le minimum en entreprise.</div>',objectives:[{id:"obj2a",text:"Désactiver le compte test.user",check:()=>{const u=adUsers.find(x=>x.sam==='test.user');return !u||!u.enabled}},{id:"obj2b",text:"Identifier les comptes avec LastLogon: Jamais",check:()=>guiState.tasksDone.includes('obj2b')}],quiz:[{q:"Cmdlet pour trouver les comptes inactifs ?",o:["Get-InactiveAccount","Search-ADAccount -AccountInactive","Find-ADUser","Get-ADUser -Inactive"],c:1,e:"Search-ADAccount -AccountInactive."},{q:"TimeSpan 90.00:00:00 = ?",o:["90 heures","90 minutes","90 jours","90 secondes"],c:2,e:"90 jours."},{q:"Désactiver vs supprimer ?",o:["Identique","Désactiver = réversible","Supprimer = réversible","Les deux réversibles"],c:1,e:"Désactiver est réversible, supprimer non."},{q:"LastLogonDate null signifie ?",o:["Connexion récente","Jamais connecté","Compte admin","Erreur"],c:1,e:"L\'utilisateur ne s\'est jamais connecté."},{q:"Pourquoi les comptes inactifs sont dangereux ?",o:["Ils ralentissent AD","Exploitables par un attaquant","Ils consomment des licences","Ils bloquent les GPO"],c:1,e:"Un attaquant peut les utiliser sans alerter."}],lab:[{i:"Recherche les comptes inactifs depuis 90 jours",x:["Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00"],o:"test.user Inactive LastLogon:Jamais",h:"Search-ADAccount -AccountInactive -TimeSpan 90.00:00:00"},{i:"Liste les utilisateurs jamais connectés",x:["Get-ADUser -Filter * -Properties LastLogonDate | Where-Object {$_.LastLogonDate -eq $null}"],o:"test.user LastLogonDate:\nadmin.service LastLogonDate:",h:"Where LastLogonDate -eq $null"},{i:"Désactive test.user",x:["Disable-ADAccount test.user","Disable-ADAccount -Identity test.user"],o:"",h:"Disable-ADAccount"},{i:"Vérifie l\'état du compte",x:["Get-ADUser test.user -Properties Enabled"],o:"test.user Enabled:False",h:"Get-ADUser ... -Properties Enabled"},{i:"Liste tous les comptes désactivés",x:["Search-ADAccount -AccountDisabled"],o:"test.user Disabled",h:"Search-ADAccount -AccountDisabled"}]},
{id:3,slug:"groupes-acces",title:"Groupes et accès",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"INCIDENT",from:"DSI - Ahmed Benali",message:"L\'équipe DevOps ne peut pas accéder au partage \\\\SRV-FILE\\Projets. Il manque un groupe de sécurité. Créez GRP_DevOps et ajoutez les membres concernés.",priority:"HAUTE"},course:'<h2>Groupes et accès — Qui a le droit de faire quoi ?</h2><p>Imaginez un trousseau de clés. Plutôt que de donner une clé <strong>individuelle</strong> à chaque employé pour chaque porte, on crée des <strong>passes</strong> : le passe \"Compta\" ouvre les bureaux de la compta, le passe \"IT\" ouvre la salle serveur. Un groupe AD, c\'est exactement ce passe.</p><h3>🎯 Pourquoi des groupes ?</h3><p>Sans groupes, pour donner accès à un dossier partagé à 50 personnes, il faudrait ajouter 50 permissions individuelles. Et quand quelqu\'un change de service ? Il faudrait modifier 50 dossiers un par un. Avec un groupe :</p><ul><li>On donne l\'accès au <strong>groupe</strong> (une seule opération)</li><li>On ajoute/retire des <strong>membres</strong> du groupe (une seule opération)</li><li>Les permissions suivent automatiquement</li></ul><h3>📦 Types de groupes</h3><p>AD propose deux <strong>catégories</strong> de groupes :</p><ul><li><strong>Security</strong> — Pour gérer les accès et permissions. C\'est celui qu\'on utilise 95% du temps.</li><li><strong>Distribution</strong> — Pour les listes de diffusion email uniquement. Pas de permissions.</li></ul><p>Et trois <strong>portées</strong> (scope) :</p><ul><li><strong>Global</strong> — Les membres doivent être du même domaine, mais le groupe peut être utilisé partout dans la forêt. C\'est le plus courant.</li><li><strong>Domain Local</strong> — Accepte des membres de n\'importe quel domaine, mais ne peut donner des permissions que dans son propre domaine.</li><li><strong>Universal</strong> — Membres de partout, utilisable partout. Pratique mais plus lourd en réplication.</li></ul><h3>🏗️ Le principe AGDLP</h3><p>C\'est LA bonne pratique Microsoft pour structurer les accès. Ça se lit comme une chaîne :</p><p><strong>A</strong>ccount → <strong>G</strong>lobal group → <strong>D</strong>omain <strong>L</strong>ocal group → <strong>P</strong>ermission</p><p>Concrètement :</p><ul><li>Vous mettez l\'<strong>utilisateur</strong> (Account) dans un groupe <strong>Global</strong> (ex: GRP_DevOps)</li><li>Vous mettez le groupe Global dans un groupe <strong>Domain Local</strong> (ex: DL_Projets_RW)</li><li>Vous donnez la <strong>permission</strong> au groupe Domain Local sur le dossier partagé</li></ul><p>Ça a l\'air compliqué ? En pratique, beaucoup d\'entreprises simplifient en utilisant directement des groupes Global pour les permissions. L\'important est de <strong>ne jamais donner de permissions directement à un utilisateur</strong>.</p><h3>⌨️ Commandes PowerShell</h3><pre><code># Créer un groupe de sécurité Global\nNew-ADGroup -Name "GRP_DevOps" `\n  -GroupScope Global `\n  -GroupCategory Security\n\n# Ajouter des membres au groupe\nAdd-ADGroupMember -Identity GRP_DevOps -Members jdupont,pdurand\n\n# Voir qui est dans le groupe\nGet-ADGroupMember GRP_DevOps\n\n# Lister tous les groupes du domaine\nGet-ADGroup -Filter * | Select Name,GroupScope</code></pre><div class="warn">⚠️ <strong>Principe du moindre privilège :</strong> n\'accordez que les droits strictement nécessaires. Un comptable n\'a pas besoin d\'accéder aux dossiers de l\'IT. Si un jour il y a une fuite de données, la première question sera : \"Pourquoi avait-il accès ?\"</div><div class="tip">💡 <strong>Nommage :</strong> Préfixez vos groupes pour les identifier facilement. Ex: GRP_ pour les groupes métier, DL_ pour les Domain Local, SVC_ pour les comptes de service.</div>',objectives:[{id:"obj3a",text:"Créer le groupe GRP_DevOps (Global, Security)",check:()=>adGroups.some(g=>g.name==='GRP_DevOps')},{id:"obj3b",text:"Ajouter jdupont à GRP_DevOps",check:()=>adGroups.find(g=>g.name==='GRP_DevOps')?.members.includes('jdupont')},{id:"obj3c",text:"Ajouter pdurand à GRP_DevOps",check:()=>adGroups.find(g=>g.name==='GRP_DevOps')?.members.includes('pdurand')}],quiz:[{q:"Portée Global signifie ?",o:["Utilisable partout","Membres locaux seulement","Membres du domaine, utilisable partout","Inter-forêts"],c:2,e:"Membres du domaine, utilisable dans toute la forêt."},{q:"AGDLP — que signifie le G ?",o:["General","Group Policy","Global Group","Gateway"],c:2,e:"Global Group."},{q:"Créer un groupe de sécurité ?",o:["New-ADGroup -GroupCategory Security","New-SecurityGroup","Add-ADGroup","Set-Group"],c:0,e:"New-ADGroup avec -GroupCategory Security."},{q:"Ajouter un membre à un groupe ?",o:["Set-ADGroupMember","Add-ADGroupMember","New-ADGroupMember","Join-ADGroup"],c:1,e:"Add-ADGroupMember."},{q:"Principe du moindre privilège ?",o:["Donner tous les droits","Droits minimum nécessaires","Pas de droits","Droits admin par défaut"],c:1,e:"Uniquement les droits strictement nécessaires."}],lab:[{i:"Crée le groupe GRP_DevOps",x:['New-ADGroup -Name "GRP_DevOps" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_DevOps créé.",h:'New-ADGroup -Name "GRP_DevOps" -GroupScope Global -GroupCategory Security'},{i:"Ajoute jdupont au groupe",x:["Add-ADGroupMember -Identity GRP_DevOps -Members jdupont"],o:"",h:"Add-ADGroupMember -Identity GRP_DevOps -Members jdupont"},{i:"Vérifie les membres",x:["Get-ADGroupMember GRP_DevOps"],o:"jdupont",h:"Get-ADGroupMember GRP_DevOps"},{i:"Ajoute pdurand au groupe",x:["Add-ADGroupMember -Identity GRP_DevOps -Members pdurand"],o:"",h:"Add-ADGroupMember -Identity GRP_DevOps -Members pdurand"},{i:"Liste tous les groupes",x:["Get-ADGroup -Filter *","Get-ADGroup -Filter * | Select Name,GroupScope"],o:"IT-Support Global Security\nRH Global Security\nGRP_DevOps Global Security\nDomain Users Global Security",h:"Get-ADGroup -Filter *"}]},
{id:4,slug:"reset-mdp",title:"Réinitialisation de mot de passe",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"INCIDENT",from:"Helpdesk - Laura Vidal",message:"URGENT : thomas.bernard (Directeur Commercial) est bloqué depuis ce matin. Compte verrouillé après 5 tentatives échouées + mot de passe expiré. Réunion client dans 10 minutes.",priority:"CRITIQUE"},course:'<h2>Reset mot de passe — Le ticket le plus fréquent</h2><p>Si vous travaillez au support IT, préparez-vous : <strong>\"J\'ai oublié mon mot de passe\"</strong> sera le ticket que vous verrez le plus souvent. C\'est le pain quotidien de l\'admin sys. Savoir le gérer vite et bien, c\'est essentiel.</p><h3>🔐 Verrouillage vs Expiration — Deux problèmes différents</h3><p>Les utilisateurs confondent souvent les deux, mais ce sont des mécanismes distincts :</p><ul><li><strong>Compte verrouillé (Locked)</strong> — Trop de tentatives de connexion échouées. C\'est une <strong>protection anti-brute-force</strong>. Comme une carte bancaire bloquée après 3 codes PIN faux.</li><li><strong>Mot de passe expiré (Expired)</strong> — Le mot de passe a dépassé sa durée de vie (ex: 90 jours). L\'utilisateur doit en choisir un nouveau. C\'est une politique de sécurité.</li></ul><h3>📊 Les attributs à connaître</h3><p>Chaque compte AD stocke des informations sur ses tentatives de connexion :</p><ul><li><code>badPwdCount</code> — Le compteur de mots de passe faux. Après X tentatives (défini par la politique), le compte se verrouille.</li><li><code>LockedOut</code> — True = compte verrouillé. L\'utilisateur ne peut plus se connecter même avec le bon mot de passe.</li><li><code>lockoutThreshold</code> — Le seuil de verrouillage. Souvent 5 tentatives en entreprise.</li><li><code>lockoutDuration</code> — Combien de temps le compte reste verrouillé. \"00:30:00\" = 30 minutes, puis il se déverrouille tout seul.</li></ul><h3>🔓 Déverrouiller un compte</h3><p>L\'utilisateur vous dit : \"Je suis sûr de taper le bon mot de passe mais ça ne marche pas.\" Il a probablement le compte verrouillé.</p><pre><code># Déverrouiller immédiatement\nUnlock-ADAccount -Identity thomas.bernard\n\n# Vérifier l\'état avant/après\nGet-ADUser thomas.bernard -Properties LockedOut,badPwdCount</code></pre><p>Cela remet le compteur <code>badPwdCount</code> à 0 et déverrouille instantanément.</p><h3>🔑 Réinitialiser le mot de passe</h3><p>L\'utilisateur a vraiment oublié son mot de passe ? Il faut le réinitialiser :</p><pre><code># Réinitialiser avec un mot de passe temporaire\nSet-ADAccountPassword thomas.bernard -Reset `\n  -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)</code></pre><p>Le paramètre <code>-Reset</code> est crucial : il permet de définir un nouveau mot de passe <strong>sans connaître l\'ancien</strong>. Sans ce flag, PowerShell demanderait l\'ancien mot de passe.</p><h3>🔄 Forcer le changement au prochain login</h3><p>On ne veut pas que l\'utilisateur garde le mot de passe temporaire \"TempP@ss1!\" pour toujours. On le force à en choisir un nouveau :</p><pre><code>Set-ADUser thomas.bernard -ChangePasswordAtLogon $true</code></pre><p>À sa prochaine connexion, Windows affichera \"Votre mot de passe doit être changé\" avant de le laisser entrer.</p><div class="warn">⚠️ <strong>Sécurité :</strong> Ne communiquez JAMAIS un mot de passe temporaire par email non chiffré. Privilégiez : un appel téléphonique, un SMS, ou un canal sécurisé (chat chiffré). Un email peut être intercepté.</div><h3>📜 La politique de mot de passe du domaine</h3><pre><code># Voir la politique par défaut\nGet-ADDefaultDomainPasswordPolicy</code></pre><p>Cette commande affiche les règles appliquées à tout le domaine :</p><ul><li><strong>MinPasswordLength</strong> — Longueur minimale (souvent 8 ou 12 caractères)</li><li><strong>ComplexityEnabled</strong> — Exige majuscule + minuscule + chiffre + caractère spécial</li><li><strong>MaxPasswordAge</strong> — Durée de vie max (ex: 90 jours)</li><li><strong>PasswordHistoryCount</strong> — Nombre d\'anciens mots de passe mémorisés (empêche de réutiliser)</li><li><strong>LockoutThreshold</strong> — Nombre de tentatives avant verrouillage</li></ul><div class="tip">💡 <strong>PasswordNeverExpires</strong> est un attribut qu\'on met parfois sur les comptes de service (ceux utilisés par des applications). Un service ne peut pas \"changer son mot de passe\" tout seul, donc on désactive l\'expiration. Mais <strong>jamais</strong> sur un compte humain.</div>',objectives:[{id:"obj4a",text:"Déverrouiller/activer thomas.bernard",check:()=>{const u=adUsers.find(x=>x.sam==='thomas.bernard');return u&&u.enabled}},{id:"obj4b",text:"Vérifier que thomas.bernard est opérationnel",check:()=>guiState.tasksDone.includes('obj4b')}],quiz:[{q:"Quelle cmdlet déverrouille un compte AD sans réinitialiser le mot de passe ?",o:["Reset-ADAccount","Unlock-ADAccount","Enable-ADAccount","Set-ADAccountPassword"],c:1,e:"Unlock-ADAccount réinitialise badPwdCount et déverrouille immédiatement."},{q:"Quel attribut AD indique le nombre de tentatives échouées ?",o:["FailedLogonCount","badPwdCount","LockoutCount","WrongPasswordAttempts"],c:1,e:"badPwdCount est incrémenté à chaque échec de connexion."},{q:"Que fait -ChangePasswordAtLogon $true ?",o:["Désactive le compte après connexion","Force un nouveau mot de passe à la prochaine connexion","Active l\'expiration mensuelle","Empêche tout changement de mot de passe"],c:1,e:"L\'utilisateur DOIT changer son mot de passe dès sa prochaine connexion."},{q:"Quel est le risque de PasswordNeverExpires sur un compte nominatif ?",o:["Aucun risque","Le mot de passe peut rester compromis indéfiniment","Le compte se désactive automatiquement","Les GPO ne s\'appliquent plus"],c:1,e:"Un mot de passe qui n\'expire jamais peut être exploité sans limite de temps."},{q:"Quelle cmdlet affiche la stratégie de mot de passe du domaine ?",o:["Get-ADPasswordPolicy","Get-DomainPolicy","Get-ADDefaultDomainPasswordPolicy","Show-PasswordRules"],c:2,e:"Get-ADDefaultDomainPasswordPolicy retourne tous les paramètres de la politique de mots de passe."}],lab:[{i:"Déverrouillez le compte thomas.bernard",x:["Unlock-ADAccount thomas.bernard","Unlock-ADAccount -Identity thomas.bernard"],o:"Le compte thomas.bernard a été déverrouillé.",h:"Unlock-ADAccount -Identity thomas.bernard"},{i:"Réinitialisez le mot de passe avec TempP@ss1!",x:['Set-ADAccountPassword thomas.bernard -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)','Set-ADAccountPassword -Identity thomas.bernard -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" -AsPlainText -Force)'],o:"Le mot de passe de thomas.bernard a été réinitialisé.",h:'Set-ADAccountPassword ... -Reset -NewPassword (ConvertTo-SecureString "TempP@ss1!" ...)'},{i:"Forcez le changement de mot de passe à la prochaine connexion",x:["Set-ADUser thomas.bernard -ChangePasswordAtLogon $true","Set-ADUser -Identity thomas.bernard -ChangePasswordAtLogon $true"],o:"ChangePasswordAtLogon activé pour thomas.bernard.",h:"Set-ADUser thomas.bernard -ChangePasswordAtLogon $true"},{i:"Vérifiez les propriétés LockedOut et BadPwdCount",x:["Get-ADUser thomas.bernard -Properties LockedOut,BadPwdCount","Get-ADUser -Identity thomas.bernard -Properties LockedOut,BadPwdCount"],o:"Name: Thomas Bernard\nEnabled: True\nLockedOut: False\nBadPwdCount: 0",h:"Get-ADUser thomas.bernard -Properties LockedOut,BadPwdCount"},{i:"Affichez la stratégie de mot de passe du domaine",x:["Get-ADDefaultDomainPasswordPolicy"],o:"ComplexityEnabled: True\nLockoutThreshold: 5\nLockoutDuration: 00:30:00\nMaxPasswordAge: 90.00:00:00\nMinPasswordLength: 8\nPasswordHistoryCount: 24",h:"Get-ADDefaultDomainPasswordPolicy"}]},
{id:5,slug:"delegation-controle",title:"Délégation de contrôle",level:"intermediate",lv:"INTERMÉDIAIRE",os:"windows",gui:{type:"ad"},incident:{type:"MISSION",from:"N+1 - Pierre Dupuis",message:"Les managers de Lyon doivent pouvoir réinitialiser les mots de passe des utilisateurs de leur OU sans disposer de droits admin complets. Mettez en place la délégation de contrôle.",priority:"NORMALE"},course:'<h2>Délégation de contrôle — Donner les clés sans donner le trousseau</h2><p>Imaginez un hôtel. Le directeur a le passe-partout qui ouvre toutes les chambres. Mais il ne va pas donner ce passe à chaque femme de ménage ! Il leur donne un <strong>passe limité</strong> : 3ème étage uniquement, de 9h à 17h. C\'est exactement le principe de la <strong>délégation de contrôle</strong> dans AD.</p><h3>🎯 Le problème que ça résout</h3><p>Dans beaucoup d\'entreprises, le reflexe c\'est : \"L\'employé du helpdesk a besoin de réinitialiser des mots de passe ? Mettons-le <strong>Domain Admin</strong>.\" C\'est comme donner les clés de la banque à quelqu\'un qui a juste besoin d\'accéder à la photocopieuse.</p><p>Avec la délégation, on peut dire : \"Pierre Durand peut réinitialiser les mots de passe, <strong>mais uniquement</strong> pour les utilisateurs de l\'OU Lyon.\" Pas plus, pas moins.</p><h3>🔐 Comment ça marche : les ACL</h3><p>Chaque objet dans AD (utilisateur, groupe, OU...) possède une <strong>liste de contrôle d\'accès (ACL)</strong>. C\'est comme une feuille scotchée sur la porte qui dit : \"Jean peut entrer, Marie peut lire, Pierre peut modifier.\"</p><p>Les permissions principales :</p><ul><li><code>ResetPassword</code> — Peut réinitialiser le mot de passe d\'un utilisateur</li><li><code>GenericRead</code> — Peut lire toutes les propriétés (nom, email, tel...)</li><li><code>WriteProperty</code> — Peut modifier certains attributs spécifiques</li><li><code>GenericAll</code> — Contrôle total. <strong>À éviter absolument</strong> : c\'est le passe-partout.</li></ul><h3>⌨️ Déléguer avec dsacls</h3><p><code>dsacls</code> est l\'outil en ligne de commande pour modifier les ACL d\'un objet AD :</p><pre><code># Donner au groupe HelpDesk Lyon le droit de reset les mots de passe\n# uniquement sur les utilisateurs de l\'OU Lyon\ndsacls "OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local" `\n  /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"</code></pre><p>Décortiquons :</p><ul><li><strong>Le chemin de l\'OU</strong> — Là où la permission s\'applique</li><li><strong>/G</strong> — Grant (accorder). /R serait Revoke (retirer).</li><li><strong>CA</strong> — Control Access, un type de permission spéciale pour les droits étendus</li><li><strong>;Reset Password</strong> — Le droit spécifique accordé</li><li><strong>;user</strong> — La portée : seulement sur les objets de type \"utilisateur\" (pas les groupes, pas les OUs)</li></ul><h3>🔍 Vérifier les permissions en place</h3><pre><code># Voir les ACL d\'une OU\nGet-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"\n\n# Version détaillée avec les entrées individuelles\n(Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local").Access</code></pre><h3>✅ La bonne méthode en 3 étapes</h3><p>Ne déléguez <strong>jamais</strong> à un utilisateur directement. Toujours via un groupe :</p><pre><code># 1. Créer le groupe de délégation\nNew-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security\n\n# 2. Ajouter les membres du helpdesk\nAdd-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand\n\n# 3. Déléguer les droits au groupe (pas à pdurand directement !)\ndsacls "OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local" `\n  /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"</code></pre><p>Pourquoi via un groupe ? Parce que quand Pierre Durand change de poste, il suffit de le <strong>retirer du groupe</strong>. Les ACL n\'ont pas besoin d\'être modifiées.</p><div class="warn">⚠️ <strong>GenericAll = danger.</strong> Si vous voyez un groupe avec GenericAll sur une OU, c\'est un risque de sécurité majeur. Un attaquant qui compromet un membre de ce groupe a le contrôle total sur tous les objets de l\'OU.</div><div class="tip">💡 <strong>Pour les débutants :</strong> l\'assistant graphique \"Delegation of Control Wizard\" dans la console ADUC (Active Directory Users and Computers) offre une interface guidée avec des cases à cocher. Plus simple pour commencer, mais moins flexible que dsacls pour les cas avancés.</div>',objectives:[{id:"obj5a",text:"Créer le groupe GRP_HelpDeskLyon",check:()=>adGroups.some(g=>g.name==='GRP_HelpDeskLyon')},{id:"obj5b",text:"Ajouter pdurand à GRP_HelpDeskLyon",check:()=>adGroups.find(g=>g.name==='GRP_HelpDeskLyon')?.members.includes('pdurand')}],quiz:[{q:"Quel principe de sécurité justifie la délégation plutôt que Domain Admin ?",o:["Séparation des tâches","Moindre privilège","Défense en profondeur","Traçabilité"],c:1,e:"Le moindre privilège : accorder uniquement les droits strictement nécessaires."},{q:"Que signifie le flag CA dans dsacls ?",o:["Create Account","Control Access","Change Attribute","Custom ACL"],c:1,e:"CA = Control Access, permet d\'accorder un droit étendu (Extended Right)."},{q:"Quelle permission dsacls permet uniquement de réinitialiser les mots de passe ?",o:["GenericAll","GenericWrite","Reset Password","FullControl"],c:2,e:"Reset Password est le droit étendu spécifique à la réinitialisation."},{q:"Quelle cmdlet PowerShell affiche les ACL d\'une OU ?",o:["Get-ADPermission","Get-ACL","Show-ADAccess","Get-ADObjectAcl"],c:1,e:"Get-ACL avec le préfixe AD: et le DN de l\'OU."},{q:"Pourquoi déléguer à un groupe plutôt qu\'à un utilisateur ?",o:["C\'est obligatoire","On gère les membres sans modifier les ACL","Les ACL ne supportent pas les utilisateurs","Pour la performance"],c:1,e:"Gestion simplifiée : ajout/retrait de membres sans toucher aux ACL."}],lab:[{i:"Créez le groupe GRP_HelpDeskLyon",x:['New-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security'],o:"Groupe GRP_HelpDeskLyon créé.",h:'New-ADGroup -Name "GRP_HelpDeskLyon" -GroupScope Global -GroupCategory Security'},{i:"Ajoutez pdurand au groupe GRP_HelpDeskLyon",x:["Add-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand"],o:"pdurand ajouté au groupe GRP_HelpDeskLyon.",h:"Add-ADGroupMember -Identity GRP_HelpDeskLyon -Members pdurand"},{i:"Déléguez le droit Reset Password sur l\'OU Lyon/Utilisateurs",x:['dsacls "OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local" /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"'],o:"La délégation Reset Password a été appliquée sur OU=Utilisateurs,OU=Lyon.",h:'dsacls "OU=..." /G "ECONOCOM\\GRP_HelpDeskLyon:CA;Reset Password;user"'},{i:"Vérifiez les ACL de l\'OU Lyon/Utilisateurs",x:['Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"'],o:"Path: OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local\nOwner: BUILTIN\\Administrators\nAccess: ECONOCOM\\GRP_HelpDeskLyon Allow ResetPassword",h:'Get-ACL "AD:OU=Utilisateurs,OU=Lyon,DC=econocom,DC=local"'},{i:"Listez les membres du groupe GRP_HelpDeskLyon",x:["Get-ADGroupMember GRP_HelpDeskLyon","Get-ADGroupMember -Identity GRP_HelpDeskLyon"],o:"Name: Pierre Durand\nSamAccountName: pdurand\nobjectClass: user",h:"Get-ADGroupMember GRP_HelpDeskLyon"}]},
{id:6,slug:"gpo-securite",title:"GPO — Sécurité poste",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"gpo"},incident:{type:"ALERTE",from:"SOC - Equipe sécurité",message:"Incident de sécurité physique dans l\'open-space de Paris : plusieurs postes sans politique de verrouillage d\'écran ont été trouvés accessibles sans surveillance. Aucune GPO de sécurité n\'est déployée sur l\'OU Postes. Déployez immédiatement.",priority:"CRITIQUE"},course:'<h2>GPO — La télécommande géante de votre parc informatique</h2><p>Imaginez que vous devez configurer <strong>500 postes de travail</strong> : même fond d\'écran, même politique de mot de passe, même verrouillage d\'écran, mêmes restrictions logicielles. Le faire à la main ? Impossible. C\'est là qu\'interviennent les <strong>GPO (Group Policy Objects)</strong>.</p><p>Une GPO, c\'est comme une <strong>télécommande</strong> qui envoie des ordres à des centaines de PC en même temps : \"Verrouille l\'écran après 5 minutes\", \"Interdis l\'accès au Panneau de configuration\", \"Mappe le lecteur S: sur le serveur de fichiers\".</p><h3>🎯 Le cycle de vie d\'une GPO</h3><p>Une GPO suit toujours 3 étapes :</p><ol><li><strong>Créer</strong> — La GPO existe dans AD, mais elle ne fait rien.</li><li><strong>Configurer</strong> — On définit les paramètres qu\'elle applique.</li><li><strong>Lier</strong> — On l\'associe à une OU, un site ou le domaine. C\'est là qu\'elle prend effet.</li></ol><pre><code># Étape 1 : Créer la GPO (elle est vide et non liée)\nNew-GPO -Name "SEC_LockScreen"\n\n# Étape 2 : Configurer un paramètre\nSet-GPRegistryValue -Name "SEC_LockScreen" `\n  -Key "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization" `\n  -ValueName "NoLockScreen" -Type DWord -Value 0\n\n# Étape 3 : Lier la GPO aux postes de Paris\nNew-GPLink -Name "SEC_LockScreen" `\n  -Target "OU=Postes,OU=Paris,DC=econocom,DC=local"</code></pre><div class="warn">⚠️ <strong>Piège classique :</strong> créer une GPO et se demander pourquoi elle ne s\'applique pas. Si elle n\'est pas <strong>liée</strong> à une OU, elle n\'a aucun effet !</div><h3>📋 Ce qu\'on configure le plus souvent</h3><ul><li><strong>Verrouillage d\'écran</strong> — Économiseur d\'écran + mot de passe requis après X minutes. Obligatoire en entreprise.</li><li><strong>Politique de mot de passe</strong> — Longueur minimale, complexité, expiration, historique.</li><li><strong>Restrictions logicielles</strong> — AppLocker pour interdire l\'exécution de certains programmes (ex: pas de jeux sur les postes).</li><li><strong>Mappage de lecteurs réseau</strong> — H: = dossier personnel, S: = partage commun. L\'utilisateur voit ces lecteurs apparaître automatiquement.</li><li><strong>Scripts de connexion</strong> — Exécuter un script à chaque ouverture de session.</li></ul><h3>🏗️ Héritage et priorité — Qui gagne ?</h3><p>Quand plusieurs GPO s\'appliquent au même objet, qui l\'emporte ? La règle est simple, du <strong>moins prioritaire au plus prioritaire</strong> :</p><p><strong>Local → Site → Domaine → OU → OU enfant</strong></p><p>Concrètement : une GPO appliquée sur l\'OU \"Paris/Postes\" écrase une GPO du domaine pour le même paramètre. Le plus proche de l\'objet gagne.</p><p>Deux exceptions importantes :</p><ul><li><strong>Enforced</strong> — Force une GPO parente à s\'appliquer même si une GPO enfant la contredit. C\'est le \"non négociable\" de l\'admin.</li><li><strong>Block Inheritance</strong> — Sur une OU, bloque l\'héritage des GPO parentes. Mais <em>Enforced</em> passe quand même (Enforced > Block).</li></ul><h3>🔄 Appliquer immédiatement</h3><p>Par défaut, les GPO se rafraîchissent <strong>toutes les 90 minutes</strong> (avec un décalage aléatoire de ±30 min pour ne pas surcharger le DC). Pour forcer l\'application immédiate :</p><pre><code># Sur le poste de l\'utilisateur\ngpupdate /force</code></pre><div class="tip">💡 <strong>Règle d\'or :</strong> Testez TOUJOURS une GPO sur un <strong>groupe pilote</strong> (une petite OU de test) avant de la déployer sur tout le parc. Une GPO mal configurée peut verrouiller des milliers de postes en quelques minutes, et c\'est très difficile à corriger quand personne ne peut plus se connecter.</div>',objectives:[{id:"gpo1",text:"Créer une GPO \'SEC_LockScreen\'",check:()=>gpoList.some(g=>g.n==='SEC_LockScreen')},{id:"gpo2",text:"Lier la GPO à OU=Postes",check:()=>gpoList.some(g=>g.n==='SEC_LockScreen'&&g.l.includes('Postes'))}],quiz:[{q:"Quelle cmdlet crée une nouvelle GPO ?",o:["Add-GPO","New-GroupPolicy","New-GPO","Create-GPO"],c:2,e:"New-GPO -Name \"NomGPO\" crée une GPO non liée."},{q:"Une GPO créée mais non liée a quel effet ?",o:["S\'applique à tous","S\'applique aux DCs","Aucun effet","S\'applique aux admins"],c:2,e:"Une GPO non liée n\'a aucun effet. Il faut la lier avec New-GPLink."},{q:"Ordre d\'application des GPO (moins → plus prioritaire) ?",o:["OU → Domaine → Site → Local","Local → Site → Domaine → OU","Domaine → Local → Site → OU","Site → OU → Local → Domaine"],c:1,e:"L-S-D-OU : Local, Site, Domaine, OU (LSDOU)."},{q:"Quelle commande force l\'application immédiate des GPO ?",o:["Update-GPO","Refresh-Policy","gpupdate /force","gprefresh /all"],c:2,e:"gpupdate /force rafraîchit immédiatement les GPO computer et user."},{q:"Quelle option sur une GPO parente empêche les GPO enfants de la remplacer ?",o:["Block Inheritance","Enforced","No Override","Locked"],c:1,e:"Enforced (anciennement No Override) force l\'application malgré les GPO enfants."}],lab:[{i:"Créez la GPO SEC_LockScreen",x:['New-GPO -Name "SEC_LockScreen"'],o:"DisplayName: SEC_LockScreen\nDomainName: econocom.local\nGpoStatus: AllSettingsEnabled",h:'New-GPO -Name "SEC_LockScreen"'},{i:"Liez la GPO à l\'OU Postes de Paris",x:['New-GPLink -Name "SEC_LockScreen" -Target "OU=Postes,OU=Paris,DC=econocom,DC=local"'],o:"GpoId: {a1b2c3d4}\nEnabled: True\nTarget: OU=Postes,OU=Paris",h:'New-GPLink -Name "SEC_LockScreen" -Target "OU=Postes,OU=Paris,..."'},{i:"Listez toutes les GPO du domaine",x:["Get-GPO -All"],o:"Default Domain Policy\nDefault Domain Controllers Policy\nSEC_LockScreen",h:"Get-GPO -All"},{i:"Configurez NoLockScreen=0 dans la GPO",x:['Set-GPRegistryValue -Name "SEC_LockScreen" -Key "HKLM\\SOFTWARE\\Policies\\Microsoft\\Windows\\Personalization" -ValueName "NoLockScreen" -Type DWord -Value 0'],o:"KeyPath: SOFTWARE\\Policies\\...\\Personalization\nValueName: NoLockScreen\nValue: 0",h:'Set-GPRegistryValue -Name "SEC_LockScreen" -Key "HKLM\\..." -ValueName "NoLockScreen" ...'},{i:"Forcez l\'application des GPO",x:["gpupdate /force"],o:"Mise à jour de la stratégie...\nStratégie ordinateur: OK\nStratégie utilisateur: OK",h:"gpupdate /force"}]},
{id:7,slug:"depart-employe",title:"Départ d'un employé",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"TICKET",from:"RH - Christine Morel",message:"Départ ce soir de nicolas.rousseau (Technicien IT). Procédure obligatoire : désactiver le compte, retirer de tous les groupes sauf Domain Users, déplacer vers OU=Archives. Conservation 30 jours minimum (RGPD).",priority:"HAUTE"},course:'<h2>Départ d\'un employé — L\'offboarding, le moment critique</h2><p>Quand un employé quitte l\'entreprise, c\'est comme quand un locataire déménage : il faut <strong>récupérer les clés, changer les serrures si nécessaire, et garder une trace</strong> de qui habitait là. Si vous \"oubliez\" de récupérer les clés, l\'ancien locataire peut revenir quand il veut...</p><p>En informatique, un ancien employé avec un compte encore actif = une <strong>faille de sécurité béante</strong>. C\'est l\'un des vecteurs d\'attaque les plus fréquents.</p><h3>📋 La procédure en 4 étapes</h3><h3>Étape 1 : Désactiver le compte (URGENT)</h3><p>C\'est la <strong>première chose à faire</strong>, idéalement le jour même du départ :</p><pre><code>Disable-ADAccount -Identity nicolas.rousseau</code></pre><p><strong>Pourquoi désactiver et pas supprimer ?</strong> Parce que :</p><ul><li>Le compte conserve son <strong>SID</strong> (identifiant unique). Si on le supprime et recrée, le nouveau compte aura un SID différent et perdra tous les accès.</li><li>Les <strong>groupes, attributs, historique</strong> sont préservés — utile pour les audits.</li><li>C\'est <strong>réversible</strong> : si l\'employé revient (CDD, erreur RH...), on réactive en 2 secondes.</li></ul><h3>Étape 2 : Retirer les groupes</h3><p>Un compte désactivé qui est encore membre du groupe \"Admin-Serveurs\" reste un risque. On retire tous les groupes :</p><pre><code># D\'abord, lister tous les groupes de l\'utilisateur\nGet-ADPrincipalGroupMembership nicolas.rousseau\n\n# Retirer du groupe IT-Support\nRemove-ADGroupMember -Identity "IT-Support" `\n  -Members nicolas.rousseau -Confirm:$false</code></pre><div class="warn">⚠️ <strong>Exception :</strong> Le groupe <code>Domain Users</code> est le groupe primaire de chaque utilisateur. Il ne peut <strong>pas</strong> être retiré avec Remove-ADGroupMember. C\'est normal, ne paniquez pas.</div><h3>Étape 3 : Déplacer vers l\'OU Archives</h3><p>On déplace le compte dans une OU dédiée aux anciens employés. Pourquoi ? Parce que les <strong>GPO ne s\'appliqueront plus</strong> (plus de scripts de connexion, plus de mappage de lecteurs...) :</p><pre><code>Move-ADObject `\n  -Identity "CN=nicolas.rousseau,OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" `\n  -TargetPath "OU=Archives,DC=econocom,DC=local"</code></pre><h3>Étape 4 : Vérification finale</h3><p>Toujours vérifier son travail :</p><pre><code># Le compte doit être : Enabled=False, plus de groupes (sauf Domain Users)\nGet-ADUser nicolas.rousseau -Properties MemberOf,Enabled</code></pre><h3>⚖️ RGPD et obligations légales</h3><p>Vous ne pouvez pas supprimer un compte le jour du départ. En France, les données RH doivent être conservées <strong>5 ans</strong> après la fin du contrat. Les auditeurs (ISO 27001, commissaires aux comptes) doivent pouvoir retrouver la trace de cet employé.</p><p>Concrètement : on <strong>désactive immédiatement</strong>, on <strong>supprime après 5 ans</strong> (ou selon la politique interne).</p><h3>✅ Checklist offboarding complète</h3><ul><li>✅ Compte AD désactivé</li><li>✅ Groupes retirés (sauf Domain Users)</li><li>✅ Compte déplacé dans OU Archives</li><li>✅ Boîte mail mise en délégation au manager (pour les mails qui arrivent encore)</li><li>✅ Accès VPN / badges physiques révoqués</li><li>✅ Ticket RH fermé avec trace de toutes les actions effectuées</li></ul><div class="tip">💡 <strong>Astuce pro :</strong> Automatisez l\'offboarding avec un script PowerShell qui fait tout en un clic. Déclenchez-le automatiquement quand un ticket RH de type \"Départ\" est créé. Zéro oubli, zéro risque.</div>',objectives:[{id:"obj7a",text:"Désactiver nicolas.rousseau",check:()=>{const u=adUsers.find(x=>x.sam==='nicolas.rousseau');return u&&!u.enabled}},{id:"obj7b",text:"Retirer nicolas.rousseau de ses groupes (sauf Domain Users)",check:()=>{const gs=adGroups.filter(g=>g.members.includes('nicolas.rousseau'));return gs.length===0||gs.every(g=>g.name==='Domain Users')}}],quiz:[{q:"Pourquoi désactiver plutôt que supprimer immédiatement ?",o:["La suppression est trop lente","Pour respecter la rétention légale et conserver les données","AD interdit la suppression","Pour que l\'utilisateur puisse revenir"],c:1,e:"La désactivation est réversible et respecte les obligations RGPD de conservation."},{q:"Quel groupe AD ne peut PAS être retiré via Remove-ADGroupMember ?",o:["Domain Admins","IT-Support","Domain Users (groupe primaire)","Tous peuvent être retirés"],c:2,e:"Domain Users est le groupe primaire et ne peut pas être retiré avec cette cmdlet."},{q:"Quelle cmdlet liste tous les groupes d\'un utilisateur ?",o:["Get-ADUserGroups","Get-ADMemberOf","Get-ADPrincipalGroupMembership","Get-ADGroupMember"],c:2,e:"Get-ADPrincipalGroupMembership retourne tous les groupes dont l\'utilisateur est membre."},{q:"Quel avantage de déplacer le compte en OU Archives ?",o:["Suppression automatique après 30j","Les GPO de production ne s\'appliquent plus","Accélère les performances AD","Le compte devient invisible"],c:1,e:"Les GPO liées aux OUs de production ne s\'appliquent plus au compte archivé."},{q:"Durée minimale de conservation RH en France (RGPD) ?",o:["1 an","3 ans","5 ans","10 ans"],c:2,e:"5 ans après la fin du contrat pour les données RH en France."}],lab:[{i:"Désactivez le compte nicolas.rousseau",x:["Disable-ADAccount nicolas.rousseau","Disable-ADAccount -Identity nicolas.rousseau"],o:"Le compte nicolas.rousseau a été désactivé.",h:"Disable-ADAccount nicolas.rousseau"},{i:"Listez les groupes de nicolas.rousseau",x:["Get-ADPrincipalGroupMembership nicolas.rousseau","Get-ADPrincipalGroupMembership -Identity nicolas.rousseau"],o:"Domain Users\nIT-Support",h:"Get-ADPrincipalGroupMembership nicolas.rousseau"},{i:"Retirez nicolas.rousseau du groupe IT-Support",x:['Remove-ADGroupMember -Identity "IT-Support" -Members nicolas.rousseau -Confirm:$false'],o:"nicolas.rousseau retiré du groupe IT-Support.",h:'Remove-ADGroupMember -Identity "IT-Support" -Members nicolas.rousseau -Confirm:$false'},{i:"Déplacez nicolas.rousseau vers OU=Archives",x:['Move-ADObject -Identity "CN=nicolas.rousseau,OU=Utilisateurs,OU=Paris,DC=econocom,DC=local" -TargetPath "OU=Archives,DC=econocom,DC=local"'],o:"nicolas.rousseau déplacé vers OU=Archives.",h:'Move-ADObject -Identity "CN=nicolas.rousseau,..." -TargetPath "OU=Archives,..."'},{i:"Vérifiez l\'état final du compte",x:["Get-ADUser nicolas.rousseau -Properties MemberOf,Enabled"],o:"Name: Nicolas Rousseau\nEnabled: False\nMemberOf: {CN=Domain Users,...}\nOU: Archives",h:"Get-ADUser nicolas.rousseau -Properties MemberOf,Enabled"}]},
{id:8,slug:"sites-replication",title:"Sites et réplication",level:"advanced",lv:"AVANCÉ",os:"windows",gui:{type:"ad"},incident:{type:"ALERTE",from:"Infrastructure - Kevin Moreau",message:"Les utilisateurs de Lyon se connectent lentement : l'authentification passe par le DC de Paris via le WAN. Aucun site AD Lyon n'est configuré. Les temps de réponse dépassent 8 secondes. Corrigez avant lundi.",priority:"HAUTE"},course:'<h2>Sites AD et réplication — Quand votre entreprise a plusieurs bureaux</h2><p>Imaginez deux bureaux : Paris et Lyon. Il y a un serveur AD à Paris. Quand un employé lyonnais se connecte le matin, son PC doit parler au serveur AD... <strong>à Paris</strong>. Via le lien WAN. À 8h du matin quand tout le monde se connecte en même temps. Vous voyez le problème ?</p><p>Les <strong>sites AD</strong> résolvent ce problème en disant : \"Lyon a son propre serveur AD. Les lyonnais s\'authentifient localement, et les deux serveurs se synchronisent entre eux.\"</p><h3>🏢 L\'analogie de la Poste</h3><p>Pensez aux bureaux de poste. Chaque ville a le sien. Quand vous envoyez un courrier local, il ne sort pas de la ville. Quand vous envoyez un courrier à une autre ville, il passe par un centre de tri. Les sites AD fonctionnent pareil :</p><ul><li><strong>Communication intra-site</strong> (dans la même ville) — rapide, directe, en temps réel</li><li><strong>Communication inter-site</strong> (entre villes) — planifiée, compressée, optimisée pour économiser la bande passante</li></ul><h3>🧩 Les composants à comprendre</h3><ul><li><strong>Site</strong> — Un emplacement physique avec un réseau rapide (Paris, Lyon). Les machines d\'un même site communiquent vite entre elles.</li><li><strong>Subnet</strong> — La plage d\'adresses IP associée à un site. C\'est comme ça qu\'un PC sait \"je suis à Lyon\" : son IP est dans le subnet de Lyon.</li><li><strong>Site Link</strong> — La connexion entre deux sites. Définit le coût et la fréquence de réplication.</li><li><strong>KCC (Knowledge Consistency Checker)</strong> — Un processus automatique qui crée la topologie de réplication. Vous n\'avez pas à le configurer, il fait le travail tout seul.</li><li><strong>Bridgehead Server</strong> — Le DC désigné pour parler avec les autres sites. C\'est le \"facteur\" qui gère le courrier inter-villes.</li></ul><h3>⌨️ Commandes essentielles</h3><pre><code># Lister les sites existants\nGet-ADReplicationSite -Filter *\n\n# Créer un nouveau site\nNew-ADReplicationSite -Name "Lyon"\n\n# Créer le lien entre Paris et Lyon\nNew-ADReplicationSiteLink -Name "Paris-Lyon" `\n  -SitesIncluded Paris,Lyon -Cost 100 -ReplicationFrequencyInMinutes 15\n\n# Associer un réseau IP au site Lyon\nNew-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"</code></pre><h3>📊 Coût et fréquence — Comment optimiser</h3><p>Le <strong>coût</strong> d\'un lien détermine la route préférée. AD choisit toujours le chemin avec le coût le plus bas. Si vous avez un lien fibre (rapide) et un lien ADSL (lent) entre deux sites, mettez un coût bas sur la fibre et un coût élevé sur l\'ADSL.</p><p>La <strong>fréquence de réplication</strong> définit à quelle intervalle les DC se synchronisent entre sites. Minimum : 15 minutes. En intra-site, c\'est quasi-instantané (notification-based).</p><div class="warn">⚠️ <strong>Subnet obligatoire !</strong> Si vous oubliez d\'associer un subnet à un site, les PC de ce réseau ne sauront pas qu\'ils sont \"à Lyon\" et contacteront un DC au hasard — potentiellement à Paris, via le WAN, avec une latence horrible.</div><div class="tip">💡 <strong>Un site sans DC</strong> force tous les clients de ce site à s\'authentifier via le WAN. C\'est techniquement possible mais très mauvais pour les performances. Si vous avez un bureau avec plus de 20 personnes, mettez-y un DC.</div>',objectives:[{id:"obj8a",text:"Explorer la structure AD",check:()=>guiState.selNode!==null},{id:"obj8b",text:"Créer un groupe GRP_Lyon_IT",check:()=>adGroups.some(g=>g.name==='GRP_Lyon_IT')}],quiz:[{q:"Quel composant AD génère automatiquement la topologie de réplication ?",o:["DFSR","KCC","SYSVOL","PDC Emulator"],c:1,e:"Le KCC (Knowledge Consistency Checker) calcule et maintient la topologie de réplication."},{q:"Que représente le coût d\'un Site Link ?",o:["Le prix en euros","La priorité de la route (plus bas = préféré)","La bande passante","Le nombre de DCs"],c:1,e:"Plus le coût est bas, plus la route est préférée pour la réplication."},{q:"Quelle est la fréquence minimale de réplication inter-sites ?",o:["1 minute","5 minutes","15 minutes","60 minutes"],c:2,e:"La fréquence minimale est 15 minutes pour la réplication inter-sites."},{q:"Que se passe-t-il sans subnet associé à un site ?",o:["Erreur de réplication","Les clients contactent un DC aléatoire","Le site est supprimé","La réplication s\'arrête"],c:1,e:"Sans subnet, les clients ne peuvent pas déterminer leur site et contactent n\'importe quel DC."},{q:"La réplication intra-site est de quel type ?",o:["Planifiée toutes les 15 min","Par notification (quasi-instantanée)","Manuelle","Quotidienne"],c:1,e:"La réplication intra-site utilise le mécanisme de notification : quasi-instantanée (< 1 sec par défaut)."}],lab:[{i:"Listez les sites AD existants",x:["Get-ADReplicationSite -Filter *"],o:"Name: Default-First-Site-Name\nName: Paris",h:"Get-ADReplicationSite -Filter *"},{i:"Créez le site AD Lyon",x:['New-ADReplicationSite -Name "Lyon"',"New-ADReplicationSite -Name Lyon"],o:"Site Lyon créé.",h:'New-ADReplicationSite -Name "Lyon"'},{i:"Créez le lien de site Paris-Lyon avec un coût de 100",x:['New-ADReplicationSiteLink -Name "Paris-Lyon" -SitesIncluded Paris,Lyon -Cost 100'],o:"SiteLink Paris-Lyon créé. Cost: 100, Frequency: 180min",h:'New-ADReplicationSiteLink -Name "Paris-Lyon" -SitesIncluded Paris,Lyon -Cost 100'},{i:"Listez les liens de site",x:["Get-ADReplicationSiteLink -Filter *"],o:"Name: DEFAULTIPSITELINK\nName: Paris-Lyon (Cost: 100)",h:"Get-ADReplicationSiteLink -Filter *"},{i:"Associez le subnet 10.1.0.0/16 au site Lyon",x:['New-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"'],o:"Subnet 10.1.0.0/16 associé au site Lyon.",h:'New-ADReplicationSubnet -Name "10.1.0.0/16" -Site "Lyon"'}]},
